name: scx-tutorial
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # scRNA-seq stack
      - scanpy>=1.10
      - anndata>=0.10
      - cellxgene-census>=1.17
      - harmonypy>=0.0.9
      - leidenalg>=0.10
      - scikit-misc>=0.3
      # plotting
      - matplotlib>=3.8
      - seaborn>=0.13
      # numerics
      - numpy<2
      # Jupyter tooling for running the notebook
      - jupyter
      - ipykernel
      - nbconvert
      - nbformat
      # pyscx (Rust extension) — editable install from the repo.
      # Requires a Rust toolchain (rustup) and the pyscx source tree at `../pyscx`:
      #     cd pyscx && maturin develop --release
      # When publishing this env to another machine, replace the line below
      # with a wheel downloaded from GitHub Releases:
      # https://github.com/ArcInstitute/scx/releases (look for pyscx-v* tags)
      - maturin>=1.5
