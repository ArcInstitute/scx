[package]
name = "scx-format-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
scx-format-io = { path = "../../scx-format-io" }

[[bin]]
name = "fuzz_header"
path = "fuzz_targets/fuzz_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_shard"
path = "fuzz_targets/fuzz_shard.rs"
test = false
doc = false

[[bin]]
name = "fuzz_decode_shard"
path = "fuzz_targets/fuzz_decode_shard.rs"
test = false
doc = false

[[bin]]
name = "fuzz_catalog"
path = "fuzz_targets/fuzz_catalog.rs"
test = false
doc = false

[[bin]]
name = "fuzz_csc_shard"
path = "fuzz_targets/fuzz_csc_shard.rs"
test = false
doc = false

[[bin]]
name = "fuzz_bitmap"
path = "fuzz_targets/fuzz_bitmap.rs"
test = false
doc = false

[[bin]]
name = "fuzz_modality_table"
path = "fuzz_targets/fuzz_modality_table.rs"
test = false
doc = false

[[bin]]
name = "fuzz_provenance"
path = "fuzz_targets/fuzz_provenance.rs"
test = false
doc = false
