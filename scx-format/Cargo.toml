[package]
name = "scx-format"
version = "0.2.0"
edition = "2021"
description = "File layout, header, catalog, and shard I/O for SCX format"
license.workspace = true
authors.workspace = true

[features]
default = ["parallel", "deletion-vectors"]
parallel = ["rayon"]
deletion-vectors = ["roaring"]

[dependencies]
rayon = { workspace = true, optional = true }
blake3 = { workspace = true }
arrow = { workspace = true }
zstd = { workspace = true }
memmap2 = { workspace = true }
thiserror = { workspace = true }
byteorder = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
roaring = { workspace = true, optional = true }
half = { workspace = true }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
lru = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "catalog_parse"
harness = false
