[package]
name = "scx-cloud"
version = "0.10.0"
edition = "2021"
description = "Cloud operations for SCX: pull, push, explode, pack, cloud-optimize"
license.workspace = true
authors.workspace = true

[dependencies]
scx-format-io = { path = "../scx-format-io", features = ["deletion-vectors"] }
scx-codec = { path = "../scx-codec" }
scx-engine = { path = "../scx-engine" }
object_store = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
arrow = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
# For implementing `object_store::ObjectStore` on the `RetryingStore`
# decorator (and test-only fault injectors). object_store uses `#[async_trait]`
# on the trait declaration, so wrappers must do the same.
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = { workspace = true }
roaring = { workspace = true }
proptest = { workspace = true }
