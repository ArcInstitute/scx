[package]
name = "scx-ops"
version = "0.13.0"
edition = "2021"
description = "File lifecycle operations (append, delete, compact, rollback, merge) for SCX files"
license.workspace = true
authors.workspace = true

[dependencies]
scx-format = { path = "../scx-format" }
scx-format-io = { path = "../scx-format-io", features = ["deletion-vectors"] }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
scx-engine = { path = "../scx-engine" }
half = { workspace = true }
rayon = { workspace = true }
roaring = { workspace = true }
fs4 = { workspace = true }
blake3 = { workspace = true }
byteorder = { workspace = true }
arrow = { workspace = true }
thiserror = { workspace = true }
memmap2 = { workspace = true }
log = { workspace = true }
indicatif = { workspace = true }
serde_json = { workspace = true }
# 1D (`scx sort --shuffle`): the seeded row permutation. ChaCha8 is the same
# generator the training loader's two-level shuffle uses, so the two surfaces
# agree on what "seeded and reproducible" means.
rand = { workspace = true }
rand_chacha = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
