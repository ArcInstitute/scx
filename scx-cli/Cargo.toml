[package]
name = "scx-cli"
version = "0.11.0"
edition = "2021"
description = "CLI tool for SCX: convert, info, validate"
license.workspace = true
authors.workspace = true

# Binary is named `scx` (matches `clap::command(name = "scx", ...)` in
# src/main.rs and every docs / SKILL invocation). The crate name stays
# `scx-cli` so `cargo install scx-cli` and release tag prefix
# `scx-cli-v*` remain stable.
[[bin]]
name = "scx"
path = "src/main.rs"

[features]
default = []
# Conversion paths that need libhdf5: h5ad, h5mu, 10x. The actual code
# lives in scx-convert; this feature is just the toggle.
hdf5 = ["scx-convert/hdf5", "dep:hdf5"]
# Bundles libhdf5 + zlib statically into the binary via hdf5-src + libz-sys.
# Used by the release workflow so downloaded binaries have no system libhdf5
# runtime requirement. Pulls in CMake at build time.
hdf5-static = ["hdf5", "scx-convert/hdf5-static"]
cloud = ["dep:scx-cloud", "dep:tokio"]
# End-user install bundle for `cargo install --features default-bin scx-cli`.
# Enables h5ad/h5mu/10x conversion out of the box. Kept separate from
# `default = []` so contributor builds (`cargo build/test` from a workspace
# checkout) don't drag in libhdf5 unnecessarily.
default-bin = ["hdf5"]

[dependencies]
clap = { workspace = true }
indicatif = { workspace = true }
# `hdf5` is still pulled in here so the integration test under
# tests/convert_subset.rs (which constructs an h5mu fixture directly)
# can build under `--features hdf5`. The conversion pipelines themselves
# live in scx-convert.
hdf5 = { workspace = true, optional = true }
arrow = { workspace = true }
# `scx modify-metadata` reads obs/var from Parquet and obsm/varm from .npy.
parquet = "58"
ndarray = { workspace = true }
ndarray-npy = "0.9"
serde_json = { workspace = true }
byteorder = { workspace = true }
thiserror = { workspace = true }
scx-format-io = { path = "../scx-format-io" }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
scx-ops = { path = "../scx-ops" }
scx-engine = { path = "../scx-engine" }
scx-mtx = { path = "../scx-mtx" }
scx-convert = { path = "../scx-convert" }
scx-cloud = { path = "../scx-cloud", optional = true }
tokio = { workspace = true, optional = true }
chrono = "0.4"
half = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Reset the SIGPIPE disposition to SIG_DFL at startup so `scx ... | head`
# exits cleanly instead of panicking on a broken stdout pipe (report E3).
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
flate2 = "1"
