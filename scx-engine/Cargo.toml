authors.workspace = true

[dependencies]
scx-format = { path = "../scx-format", features = ["deletion-vectors"] }
scx-sparse = { path = "../scx-sparse" }
scx-codec = { path = "../scx-codec" }
arrow = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
