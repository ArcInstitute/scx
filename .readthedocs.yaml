# ReadTheDocs build configuration for the SCX documentation site.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The compiled Rust extension `pyscx.pyscx` is not built on RTD — it is
# mocked via `autodoc_mock_imports` in `docs/conf.py`, so the build only
# needs Python deps from `docs/requirements.txt`.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - htmlzip
  - pdf

python:
  install:
    - requirements: docs/requirements.txt
