name: scx-cli release binaries

on:
  push:
    tags:
      - "scx-cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to attach the release to (e.g. scx-cli-v0.2.0). Required for workflow_dispatch."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: scx-cli-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Pin to ubuntu-22.04 for both arches so the released binaries inherit
        # a glibc 2.35 floor — covers Ubuntu 22.04+, Debian 13+, RHEL 10,
        # Fedora 38+. ubuntu-latest is currently 24.04 (glibc 2.39), which is
        # too new for typical HPC environments still on 22.04 LTS.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Include matrix.runner in the cache key. Without it, swapping the
      # runner image (e.g. ubuntu-24.04 → ubuntu-22.04) reuses C build
      # artifacts (libhdf5 from hdf5-src) compiled against the old runner's
      # glibc, producing link errors against newer libc symbols (e.g.
      # __isoc23_sscanf is glibc 2.38+ only).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.runner }}

      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#scx-cli-v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build (release, hdf5-static + cloud)
        run: cargo build -p scx-cli --release --locked --features hdf5-static,cloud --target ${{ matrix.target }}

      # Cargo emits the binary as `scx` (via the `[[bin]]` stanza in
      # scx-cli/Cargo.toml). The package/crate name stays `scx-cli` so
      # `cargo install scx-cli` and the release tag prefix `scx-cli-v*`
      # remain stable — only the on-disk binary file is `scx`.
      - name: Strip binary
        run: strip "target/${{ matrix.target }}/release/scx"

      - name: Verify static linkage of libhdf5
        run: |
          bin="target/${{ matrix.target }}/release/scx"
          if ldd "$bin" | grep -i hdf5; then
            echo "ERROR: libhdf5 is dynamically linked; static feature did not take effect" >&2
            exit 1
          fi

      - name: Package tarball
        id: pkg
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          target="${{ matrix.target }}"
          name="scx-cli-${version}-${target}"
          staging="${RUNNER_TEMP}/${name}"
          mkdir -p "$staging"
          cp "target/${target}/release/scx" "$staging/scx"
          cp README.md "$staging/"
          tar -czvf "${name}.tar.gz" -C "${RUNNER_TEMP}" "$name"
          echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: scx-cli-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: scx-cli-*
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
