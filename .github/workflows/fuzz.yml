name: Fuzz

# Build-check every PR + push to main so the fuzz crates can't bitrot
# (they live in separate cargo workspaces under <crate>/fuzz/, so the
# main `cargo build/test/clippy --workspace` walks past them).
#
# Run-on-demand only via workflow_dispatch — no cron schedule. Trigger
# from the Actions tab before a release or after touching a parser.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Per-target fuzz duration in seconds"
        required: false
        default: "120"
      target:
        description: "Run only this target name (omit to run all)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-build:
    name: Fuzz build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            scx-codec/fuzz
            scx-format/fuzz
            scx-engine/fuzz
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Build scx-codec fuzz targets
        working-directory: scx-codec/fuzz
        run: cargo +nightly fuzz build
      - name: Build scx-format fuzz targets
        working-directory: scx-format/fuzz
        run: cargo +nightly fuzz build
      - name: Build scx-engine fuzz targets
        working-directory: scx-engine/fuzz
        run: cargo +nightly fuzz build

  fuzz-run:
    name: Fuzz ${{ matrix.crate }}/${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: scx-codec,  target: fuzz_bitstream }
          - { crate: scx-codec,  target: fuzz_delta_golomb }
          - { crate: scx-codec,  target: fuzz_forbp }
          - { crate: scx-codec,  target: fuzz_rice }
          - { crate: scx-format, target: fuzz_header }
          - { crate: scx-format, target: fuzz_shard }
          - { crate: scx-format, target: fuzz_catalog }
          - { crate: scx-format, target: fuzz_csc_shard }
          - { crate: scx-format, target: fuzz_bitmap }
          - { crate: scx-format, target: fuzz_modality_table }
          - { crate: scx-format, target: fuzz_provenance }
          - { crate: scx-engine, target: fuzz_predicate_index }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}/fuzz
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Run ${{ matrix.target }}
        if: github.event.inputs.target == '' || github.event.inputs.target == matrix.target
        working-directory: ${{ matrix.crate }}/fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event.inputs.duration_seconds }}
      - name: Upload crash inputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.crate }}-${{ matrix.target }}-crashes
          path: ${{ matrix.crate }}/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
