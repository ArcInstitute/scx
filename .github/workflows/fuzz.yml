name: Fuzz

# Build-check PRs + pushes to main that touch the fuzzed crates, so the fuzz
# crates can't bitrot (they live in separate cargo workspaces under
# <crate>/fuzz/, so the main `cargo build/test/clippy --workspace` walks past
# them). Path-filtered: the check only catches signature drift in
# scx-codec/scx-format/scx-engine (and their in-workspace deps scx-sparse and
# scx-format-io via scx-engine), so PRs that touch none of them skip the
# nightly-toolchain compile entirely. This is not a required check; an absent
# run reads as green.
#
# Documented residual of GitHub's native paths filter: on a diff of more than
# 3,000 files whose matching paths are not in the first 3,000, the workflow
# does NOT run (docs: "Git diff comparisons") — i.e. it fails open, silently.
# The weekly schedule below is the bitrot backstop for that hole and for long
# stretches where no PR touches the fuzzed crates.
#
# Fuzz *runs* are on-demand only via workflow_dispatch. Trigger from the
# Actions tab before a release or after touching a parser.

on:
  schedule:
    # Weekly fuzz-build bitrot check (Mondays 06:17 UTC; fuzz-run stays
    # dispatch-only — its job-level `if` already excludes schedule events).
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - "scx-codec/**"
      - "scx-format/**"
      - "scx-format-io/**"
      - "scx-engine/**"
      - "scx-sparse/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: [main]
    paths:
      - "scx-codec/**"
      - "scx-format/**"
      - "scx-format-io/**"
      - "scx-engine/**"
      - "scx-sparse/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Per-target fuzz duration in seconds"
        required: false
        default: "120"
      target:
        description: "Run only this target name (omit to run all)"
        required: false
        default: ""

# Superseded PR pushes cancel their in-flight run; main pushes and manual
# fuzz dispatches (unique run id) always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-build:
    name: Fuzz build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            scx-codec/fuzz
            scx-format/fuzz
            scx-engine/fuzz
      # `cargo check` (not `cargo fuzz build`) is enough to catch the
      # bitrot we care about: if `scx_format` / `scx_engine` rename or
      # change the signature of a function a fuzz target calls, the
      # check fails. Skips the release-mode sanitizer-instrumented codegen
      # + linking that `cargo fuzz build` does, which is the bulk of the
      # 10-minute run on a cold cache. Sanitizer codegen is exercised by
      # the workflow_dispatch fuzz-run job; this PR-time job only needs
      # to typecheck.
      - name: Check scx-codec fuzz targets
        run: cargo +nightly check --manifest-path scx-codec/fuzz/Cargo.toml
      - name: Check scx-format fuzz targets
        run: cargo +nightly check --manifest-path scx-format/fuzz/Cargo.toml
      - name: Check scx-engine fuzz targets
        run: cargo +nightly check --manifest-path scx-engine/fuzz/Cargo.toml

  fuzz-run:
    name: Fuzz ${{ matrix.crate }}/${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: scx-codec,  target: fuzz_bitstream }
          - { crate: scx-codec,  target: fuzz_delta_golomb }
          - { crate: scx-codec,  target: fuzz_forbp }
          - { crate: scx-codec,  target: fuzz_rice }
          # Composite-level targets: these drive `decode_shard_ref`, where a
          # codec's guards are actually applied. `fuzz_shufdelta` existed but
          # was never listed here, so it was build-checked and never run.
          - { crate: scx-codec,  target: fuzz_shufdelta }
          - { crate: scx-codec,  target: fuzz_lz4_shuffle }
          - { crate: scx-codec,  target: fuzz_pcodec }
          # Sweeps all six codecs from one corpus, and is the only target that
          # reaches `decode_shard_scipy` / `decode_shard_native`, which bypass
          # `decode_shard_ref` for Scx1.
          - { crate: scx-codec,  target: fuzz_decode_shard }
          - { crate: scx-format, target: fuzz_header }
          - { crate: scx-format, target: fuzz_shard }
          - { crate: scx-format, target: fuzz_catalog }
          - { crate: scx-format, target: fuzz_csc_shard }
          - { crate: scx-format, target: fuzz_bitmap }
          - { crate: scx-format, target: fuzz_modality_table }
          - { crate: scx-format, target: fuzz_provenance }
          - { crate: scx-engine, target: fuzz_predicate_index }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}/fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run ${{ matrix.target }}
        if: github.event.inputs.target == '' || github.event.inputs.target == matrix.target
        working-directory: ${{ matrix.crate }}/fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=${{ github.event.inputs.duration_seconds }}
      - name: Upload crash inputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.crate }}-${{ matrix.target }}-crashes
          path: ${{ matrix.crate }}/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
