name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cpu-only:
    name: Build (CPU-only workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # PR branches restore-only; only main saves the cache. The post-job
          # cache-save step packs the whole-workspace target/ and was running the
          # runner out of disk on PRs ("No space left on device" — tests passed,
          # only the save failed). main keeps the cache fresh.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Validates that the entire workspace — including scx-gpu (cudarc) —
      # compiles on machines without CUDA installed. GPU tests are `#[ignore]`d
      # and gated, so the Test job reports them as ignored rather than as passes
      # that did nothing; scx-gpu/tests/gpu_test_gating.rs enforces the pairing.
      - name: Verify CPU-only workspace build
        run: cargo build --workspace --exclude rscx

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Link with mold (installed below): far lower peak memory/temp per link
      # than the default rust-lld, and faster. `cargo test --workspace` links a
      # separate binary per doctest against the full arrow dependency closure,
      # and on a stock runner that burst faulted the linker with SIGBUS
      # (ld "signal 7 [Bus error]" — an ENOSPC-on-mmap symptom). Pairs with the
      # disk-reclaim step below.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      # Reclaim ~25-30 GB of preinstalled toolchains/images. The stock
      # ubuntu-latest disk (~14 GB free) fills mid-link during the doctest
      # phase (see the "No space left on device" history in the cache note
      # below), which is what faulted the linker. `tool-cache: false` keeps the
      # hosted toolchain cache the Rust/Python setup actions rely on.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # PR branches restore-only; only main saves the cache. The post-job
          # cache-save step packs the whole-workspace target/ and was running the
          # runner out of disk on PRs ("No space left on device" — tests passed,
          # only the save failed). main keeps the cache fresh.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --exclude rscx

  # `cargo test --workspace` above runs at DEFAULT features, and nothing in the
  # workspace enables `scx-convert/hdf5` by default — `scx-cli` declares
  # `default = []`, `pyscx` declares no `default` at all, and each only opts in
  # through its own `hdf5` feature (`pyscx`'s comes from `[tool.maturin]
  # features`, which affects `maturin` and not `cargo test`). The
  # `feature-check` lane compiles and clippy-checks the gated half but never runs
  # it. So before this job existed, ~210 `#[test]`s in
  # `scx-convert/src/convert_tests_*.rs` plus every hdf5-gated `scx-cli`
  # integration test were built by CI and executed by nothing — which is how two
  # Criticals — the streaming h5ad exporter's categorical vocabulary, and the
  # unbounded ingest reorder buffer this PR fixes — shipped with regression
  # tests that could not fail.
  test-hdf5:
    name: Test (hdf5 features)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # Assert rather than skip: the parallel streaming coordinator's tests
      # `return` early when libhdf5 lacks `--enable-threadsafe`, and libtest
      # captures that message, so a non-threadsafe runner would report this
      # whole lane green with the coordinator untested. `scx-convert`'s
      # `hdf5_threadsafe::tests::ci_requires_a_threadsafe_libhdf5` fails when
      # this is set and the probe is false. Same shape as `SCX_REQUIRE_GPU`.
      SCX_REQUIRE_HDF5_THREADSAFE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install hdf5 dev headers
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - run: cargo test -p scx-convert --features hdf5
      # `--test-threads=1`, and NOT `HDF5_USE_FILE_LOCKING=FALSE`.
      #
      # `scx-cli`'s integration tests build an h5ad with `hdf5::File::create` in
      # the test process and then spawn the `scx` binary to open it. Run in
      # parallel, sibling tests' open files make libhdf5 refuse the child's
      # `H5Fopen` with `unable to lock file, errno = 11`. This is not a
      # network-filesystem quirk: measured locally on ext4, 11-13 of the 18
      # tests in `convert_stream.rs` fail this way in parallel and all 18 pass
      # serialised. The first run of this job caught it on `ubuntu-latest`.
      #
      # Disabling the lock would make the whole suite pass too, and that is what
      # every developer does locally — but it would also hide any future
      # *genuine* locking failure, on the one lane that exists to stop hiding
      # things. Serialising keeps libhdf5's locking fully enforced. Measured
      # cost: 203 tests in 7.2 s.
      - run: cargo test -p scx-cli --features hdf5 -- --test-threads=1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # PR branches restore-only; only main saves the cache. The post-job
          # cache-save step packs the whole-workspace target/ and was running the
          # runner out of disk on PRs ("No space left on device" — tests passed,
          # only the save failed). main keeps the cache fresh.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--all-targets` lints tests, benches and examples too. Without it a
      # whole class of test-code defect is invisible to CI, and test code is
      # where the correctness reasoning lives.
      - run: cargo clippy --workspace --exclude rscx --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  dedup-guard:
    name: I-ORG-1 dedup guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # T5.11: every FileHeader must be built via FileHeader::new_single_modality(...)
      # or FileHeader { .., ..Default::default() }. The `reserved: [0u8; 112]` field
      # initializer is the fingerprint of a hand-spelled full literal; the only
      # legitimate occurrences live in scx-format/src/header.rs (Default + read_from).
      # The pattern tolerates formatting variants (whitespace, the type-inferred
      # `[0; 112]` form) so the guard does not silently depend on `cargo fmt`.
      - name: No hand-spelled FileHeader literals
        run: |
          if grep -rEn --include='*.rs' \
               'reserved:[[:space:]]*\[[[:space:]]*0(u8)?[[:space:]]*;[[:space:]]*112[[:space:]]*\]' . \
               | grep -v 'scx-format/src/header.rs'; then
            echo "::error::Hand-spelled FileHeader literal found — use FileHeader::new_single_modality(...) or FileHeader { .., ..Default::default() }."
            exit 1
          fi
      # ORG-3.7-3: the three shape-derived decode caps are derived in exactly
      # one place, `DecodeBounds::derive`. Every whole-shard decode entry point
      # (including the Scx1 short-circuits in `decode_shard_scipy` /
      # `decode_shard_native`, which `scx-format-io` materialization reaches)
      # must go through it rather than re-deriving the products by hand.
      #
      # This is a static guard because it is not falsifiable at runtime: Scx1's
      # independent `bound_capacity` rejects a hostile shape before the byte
      # caps decide, so a hostile-input test stays green whether or not the
      # derivation is there. Grepping for the primitives is what actually pins
      # it. `guards.rs` defines them; `shard_codec.rs` is the one derivation
      # site; `raw.rs`/codec bodies use `checked_len` for other products. A
      # legitimate standalone use marks itself `ORG-3.7-3-ALLOW` with a reason
      # (today: `decode_indptr_only`, which has no nnz or encoding to derive
      # from).
      - name: Decode caps are derived only in DecodeBounds::derive
        run: |
          if grep -rEn --include='*.rs' 'indptr_byte_cap[[:space:]]*\(' scx-codec/src \
               | grep -vE 'scx-codec/src/(guards\.rs|shard_codec\.rs)' \
               | grep -v 'ORG-3.7-3-ALLOW'; then
            echo "::error::indptr_byte_cap called outside DecodeBounds::derive — decode caps must come from the driver's derivation."
            exit 1
          fi
      # The negative grep above only rejects a *forbidden* helper call, so
      # deleting a `DecodeBounds::derive(...)` outright leaves nothing for it
      # to find. This is the positive half: all three whole-shard decode entry
      # points — `decode_shard_ref`, `decode_shard_scipy`, `decode_shard_native`
      # — must each derive. Removing any one fails here.
      - name: All three whole-shard decode entry points derive their bounds
        run: |
          n=$(grep -cE 'DecodeBounds::derive[[:space:]]*\(' scx-codec/src/dispatch.rs || true)
          if [ "$n" -ne 3 ]; then
            echo "::error::expected 3 DecodeBounds::derive call sites in dispatch.rs (decode_shard_ref, decode_shard_scipy, decode_shard_native), found $n."
            exit 1
          fi

      # ORG-4.9-1: the catalog entry list is walked in exactly one place,
      # `scx-format/src/catalog_cursor.rs`. The cost of the alternative is on
      # record: when `FullCatalog::read_from` and `CatalogView::read_from_bytes`
      # each had their own walk they drifted on the order of two steps, and the
      # one that decoded stats before resolving the section type made any file
      # containing a future section type unopenable (§4.2).
      #
      # `MIN_ENTRY_BYTES` is the fingerprint of a hand-rolled walk: nothing
      # needs the value except code sizing entries itself. A caller that must
      # find where a catalog ends without parsing it calls
      # `catalog_payload_len`; one that walks a `File` it cannot slice
      # (scx-ops' rollback reader) imports the constants rather than restating
      # them. Test files may name it in a comment about the guard it exercises.
      - name: Catalog entry layout is spelled out only in catalog_cursor.rs
        run: |
          if grep -rEn --include='*.rs' 'MIN_ENTRY_BYTES' . \
               | grep -vE '(scx-format/src/(catalog_cursor\.rs|catalog_cursor_tests\.rs|lib\.rs)|_tests\.rs|/tests/)' \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|///|//!)'; then
            echo "::error::catalog entry-size arithmetic outside catalog_cursor.rs — walk the catalog with CatalogEntryCursor, or import the layout constants."
            exit 1
          fi
      # The negative grep above cannot see a walk that re-derives 53 without
      # naming it. This is the positive half: both representations are built by
      # the cursor, so each must construct one.
      #
      # Scanned only up to the first `#[cfg(test)]`. `catalog_view.rs` embeds its
      # test module in the same file, so a whole-file grep would stay green on a
      # `read_from_bytes` that had stopped using the cursor as long as some test
      # below still constructed one — the guard would be satisfied by the thing
      # it is supposed to be checking.
      - name: Both catalog representations are built by the cursor
        run: |
          for f in scx-format/src/catalog.rs scx-format/src/catalog_view.rs; do
            if ! sed '/#\[cfg(test)\]/,$d' "$f" \
                 | grep -qE 'CatalogEntryCursor::(new|over_payload)[[:space:]]*\('; then
              echo "::error::$f no longer builds a CatalogEntryCursor in production code — the two catalog parsers must share one entry walk."
              exit 1
            fi
          done

      # ORG-4.9-5: row-major CSR shards are stitched together in exactly one
      # place, `scx-format-io/src/reader/matrix.rs::assemble_row_major`, and the
      # two checks every such body needs live in `plan_row_major_layout` and
      # `check_decoded_lengths` beside it. The cost of the alternative is on
      # record: there were four hand-rolled copies (three in reader.rs, one in
      # typed_read.rs that the review did not even count), carrying four copies
      # of the same `checked_sub` and twelve of the same three length checks --
      # so a bounds fix could land in three of four places.
      #
      # `row_end.checked_sub(` is the fingerprint of a fifth copy: deriving a
      # shard's row count from catalog stats is exactly what the shared layout
      # planner is for. Test files may name it in a comment about the guard.
      - name: Row-major shard layout is derived only in reader/matrix.rs
        run: |
          if grep -rEn --include='*.rs' 'row_end\.checked_sub\(|length mismatch: catalog stats' . \
               | grep -vE 'scx-format-io/src/reader/matrix\.rs' \
               | grep -vE '(_tests\.rs|/tests/)' \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|///|//!)'; then
            echo "::error::row-major shard layout arithmetic outside reader/matrix.rs — call plan_row_major_layout / check_decoded_lengths instead of restating them."
            exit 1
          fi
      # The negative grep above cannot see a body that re-derives the layout
      # without naming checked_sub. This is the positive half: every consumer
      # must be reached from the shared helpers.
      #
      # Scanned only up to the first `#[cfg(test)]` in each file. reader_tests.rs
      # constructs assemblers directly, so a whole-file grep would stay green on
      # a production path that had stopped using them as long as a test still
      # did — the guard would be satisfied by the thing it is supposed to check.
      # (This is the mistake round 2 of #439 caught in the catalog guard above.)
      - name: Every row-major assembler is built from the shared helpers
        run: |
          set -e
          # reader/matrix.rs owns the one assembler and must call both helpers.
          for h in plan_row_major_layout check_decoded_lengths; do
            if ! sed '/#\[cfg(test)\]/,$d' scx-format-io/src/reader/matrix.rs \
                 | grep -qE "$h[[:space:]]*\("; then
              echo "::error::reader/matrix.rs no longer calls $h — the row-major layout checks must stay in one place."
              exit 1
            fi
          done
          # typed_read.rs assembles at a narrowed dtype and is the copy the
          # review missed; it must keep calling the same two helpers rather than
          # growing its own again.
          for h in plan_row_major_layout check_decoded_lengths; do
            if ! sed '/#\[cfg(test)\]/,$d' scx-format-io/src/typed_read.rs \
                 | grep -qE "$h[[:space:]]*\("; then
              echo "::error::typed_read.rs no longer calls $h — it was a fourth copy of the row-major checks once already."
              exit 1
            fi
          done
      # §4.7: a column-major shard whose sidecar was built against superseded
      # CSR data must not decode. The guard is keyed on the entry's section type
      # and sits at the four functions that turn shard payload into values.
      #
      # It was on `read_csc_from_entry` first, on the reasoning that every
      # ScxReader CSC read funnels through it. Two things funnelled around it,
      # and both were found by review rather than by this guard: the framed (v2)
      # arm of `read_csc_columns` decodes via `decode_block_index_row_runs` and
      # `continue`s, and `scx upgrade` copies a sidecar forward with
      # `read_shard_from_entry` and re-stamps it at the output's generation --
      # turning a detectable stale sidecar into an undetectable one. So the
      # guard checks the decode entry points, not the CSC-shaped wrappers.
      #
      # Known limit, stated so a green run is not read as more than it is: this
      # catches the call being deleted or moved below `#[cfg(test)]` (both
      # watched failing), not the call being neutered -- `if false && ...` still
      # satisfies a grep. What catches neutering is the behavioural test,
      # `stale_csc_sidecar_is_refused_on_every_reader_csc_path`, which runs both
      # the framed and unframed arms. The grep is a structural tripwire layered
      # over that test, not a replacement for it.
      - name: Every shard-decode entry point guards CSC sidecar freshness
        run: |
          set -e
          prod() { sed '/#\[cfg(test)\]/,$d' scx-format-io/src/reader/matrix.rs; }
          if ! prod | grep -qE 'fn guard_csc_sidecar_fresh'; then
            echo "::error::reader/matrix.rs no longer defines guard_csc_sidecar_fresh (§4.7)."
            exit 1
          fi
          n=$(prod | grep -cE 'self\.guard_csc_sidecar_fresh\(' || true)
          if [ "$n" -lt 4 ]; then
            echo "::error::guard_csc_sidecar_fresh has $n call sites in production code, expected at least 4 (read_shard_from_entry_inner, read_shard_from_entry_native, read_shard_indptr_from_entry, decode_block_index_row_runs). A decode path that skips it serves a stale sidecar (§4.7)."
            exit 1
          fi

      # §10.1: a numpy borrow is not GIL-bound and does not clear numpy's
      # WRITEABLE flag, so a `&[T]` taken from one must never be read after the
      # GIL is released. `GilHeldCsrSlices` is the single borrowed-buffer
      # escape hatch; it is sound only because the GPU PCA / fused dispatch
      # holds the GIL throughout, and it is `#[cfg(feature = "gpu")]`-gated so
      # a CPU build cannot even name it. Keep it in the one file that can
      # honour that invariant — every other caller uses `convert::owned_csr`.
      # Deliberately strict: this fires on a *mention* too, so referring to the
      # type by name from another Rust file's comment trips it. Say "the GPU
      # borrowed-CSR path" there instead, or add the file to the allowlist.
      - name: Borrowed-CSR machinery stays in the one GIL-held file
        run: |
          if grep -rEn --include='*.rs' \
               'GilHeldCsrSlices|borrow_csr_slices_gil_held' . \
               | grep -v 'pyscx/src/accel/pca.rs'; then
            echo "::error::Borrowed numpy CSR slices outside pyscx/src/accel/pca.rs — use crate::convert::owned_csr() (see docs/conventions.md § Python Bindings)."
            exit 1
          fi
      # The same fix folded three near-duplicate scipy→ScxCsr materializers
      # into `convert::owned_csr`. Two of them copied twice (an `astype`
      # copy plus a pyo3 sequence extraction that allocated one Python object
      # per nonzero); resurrecting either re-opens both the duplication and the
      # question of which one is safe across `detach`.
      - name: No revived duplicate CSR materializers
        run: |
          if grep -rEn --include='*.rs' 'fn (extract_materialized_csr|scipy_to_scxcsr)\b' .; then
            echo "::error::Duplicate scipy→ScxCsr materializer — use crate::convert::owned_csr()."
            exit 1
          fi
      # §9.1/§9.2: `fork()` copies rayon's global registry as a data structure
      # but not its worker threads, so a `par_*` dispatched from a forked
      # DataLoader worker parks forever in `LockLatch::wait_and_reset` — no
      # error, no batch. Every parallel dispatch in scx-loader must therefore go
      # through a pool built in *this* process: the per-pipeline pool passed
      # into `decode_stage`, or `crate::pool::cpu_pool()`.
      #
      # Deliberately NOT a file allowlist: the files holding a `par_*` today are
      # exactly where the next one will be added, so allowlisting them would
      # blind the gate where it matters most. Instead every dispatch line needs
      # an `install(` within the preceding 12 lines, in the same function, and
      # **lexically inside that install's closure** — the guard is armed at the
      # `install(` line and disarmed again as soon as brace depth returns to
      # where it started, so a sibling block that merely happens to be deeper
      # does not inherit it. Each clause is here because a bypass got through
      # without it, all four now in the bad fixture: a `par_iter` in the *next*
      # function (needs the `fn` reset), one after a single-line
      # `pool.install(...)` (needs depth), and ones inside a following `if` or
      # `match` block (need the disarm — depth alone accepted them). The good
      # fixture covers the mirror-image false positives: a single-line
      # `install(|| par_*)` and a `par_*` nested inside the install's own
      # `if`.
      #
      # It is a text heuristic, so it is checked against known-good and
      # known-bad fixtures before its silence on the real tree is trusted. It
      # also stops at the crate boundary: it cannot see the `par_iter` in
      # `scx-format-io`'s `warm_shards` or `read_obs`, which are covered by
      # `BackedCsrReader::set_cpu_pool` and an `install` at the call site.
      # `pyscx/tests/test_fork_safety.py` is what actually pins those.
      - name: scx-loader never dispatches to rayon's global pool
        run: |
          mkdir -p /tmp/gatefix
          printf '%s\n' \
            'FNR == 1 { last_install = -100; depth = 0; install_depth = -1 }' \
            '{ line = $0; sub(/^[[:space:]]+/, "", line) }' \
            'line ~ /^\/\// { next }' \
            '{ start_depth = depth; t = $0; depth += gsub(/{/, "", t); t = $0; depth -= gsub(/}/, "", t) }' \
            '# The install closure has ended once depth returns to where it began.' \
            'install_depth >= 0 && FNR > last_install && start_depth <= install_depth { last_install = -100; install_depth = -1 }' \
            'line ~ /^(pub[[:space:]]*(\([^)]*\))?[[:space:]]*)?(default[[:space:]]+)?(const[[:space:]]+)?(async[[:space:]]+)?(unsafe[[:space:]]+)?fn[[:space:]]/ { last_install = -100; install_depth = -1 }' \
            '/\.install\(/ { last_install = FNR; install_depth = start_depth }' \
            '/par_iter|par_chunks|par_bridge|into_par_iter|par_sort|par_extend|par_drain|rayon::(join|scope|in_place_scope|spawn|broadcast)/ {' \
            '  guarded = (FNR == last_install) || (install_depth >= 0 && start_depth > install_depth && FNR - last_install <= 12)' \
            '  if (!guarded) print FILENAME ":" FNR ": " line' \
            '}' \
            > /tmp/gatefix/gate.awk
          printf '%s\n' \
            'fn guarded(pool: &rayon::ThreadPool, v: &mut [f32]) {' \
            '    pool.install(|| {' \
            '        v.par_iter_mut().for_each(|x| *x *= 2.0);' \
            '    });' \
            '}' \
            '' \
            'fn guarded_on_one_line(pool: &rayon::ThreadPool, v: &mut [f32]) {' \
            '    pool.install(|| v.par_iter_mut().for_each(|x| *x *= 2.0));' \
            '}' \
            '' \
            'fn guarded_inside_a_nested_block(pool: &rayon::ThreadPool, v: &mut [f32]) {' \
            '    pool.install(|| {' \
            '        if v.len() > 1 {' \
            '            v.par_iter_mut().for_each(|x| *x *= 2.0);' \
            '        }' \
            '    });' \
            '}' \
            > /tmp/gatefix/good.rs
          printf '%s\n' \
            'fn guarded(pool: &rayon::ThreadPool, v: &mut [f32]) {' \
            '    pool.install(|| {' \
            '        v.par_iter_mut().for_each(|x| *x *= 2.0);' \
            '    });' \
            '}' \
            '' \
            'fn leaks_into_the_next_fn(v: &mut [f32]) {' \
            '    v.par_iter_mut().for_each(|x| *x *= 3.0);' \
            '}' \
            '' \
            'fn also_unguarded(f: impl Fn() + Send) {' \
            '    rayon::spawn(f);' \
            '}' \
            '' \
            'fn same_fn_after_install(pool: &rayon::ThreadPool, v: &mut [f32]) {' \
            '    pool.install(|| do_one_safe_thing());' \
            '    v.par_iter_mut().for_each(|x| *x *= 4.0);' \
            '}' \
            '' \
            'fn sibling_block(pool: &rayon::ThreadPool, v: &mut [f32], cond: bool) {' \
            '    pool.install(|| {' \
            '        do_one_safe_thing();' \
            '    });' \
            '    if cond {' \
            '        v.par_iter_mut().for_each(|x| *x *= 5.0);' \
            '    }' \
            '}' \
            '' \
            'fn sibling_match(pool: &rayon::ThreadPool, v: &mut [f32]) {' \
            '    pool.install(|| {' \
            '        do_one_safe_thing();' \
            '    });' \
            '    match 0 {' \
            '        _ => v.par_iter_mut().for_each(|x| *x *= 6.0),' \
            '    }' \
            '}' \
            > /tmp/gatefix/bad.rs

          if [ -n "$(awk -f /tmp/gatefix/gate.awk /tmp/gatefix/good.rs)" ]; then
            echo "::error::rayon gate self-test: flagged a correctly guarded dispatch."
            exit 1
          fi
          n=$(awk -f /tmp/gatefix/gate.awk /tmp/gatefix/bad.rs | wc -l)
          if [ "$n" -ne 5 ]; then
            echo "::error::rayon gate self-test: expected 5 findings in the bad fixture, got $n:"
            awk -f /tmp/gatefix/gate.awk /tmp/gatefix/bad.rs
            exit 1
          fi

          bad=$(awk -f /tmp/gatefix/gate.awk $(find scx-loader/src -name '*.rs'))
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::rayon dispatch in scx-loader with no pool.install(...) earlier in the same function — route it through crate::pool::cpu_pool() (see docs/multithreading.md § Fork safety)."
            exit 1
          fi

      # ORG-4.9-7: one LRU eviction loop and one singleflight, both in
      # `scx-format-io/src/backed/cache.rs`. There were three of the first and
      # two of the second: `CscCache` (count-only, no singleflight at all) and
      # `DenseLruCache` (a ~55-line transcription of `get_or_decode`, down to
      # the re-check under `in_flight`). They differed only in how a payload is
      # measured in bytes, which is now `SizeHint`.
      #
      # `pop_lru()` is the fingerprint of a fourth eviction loop and
      # `LeaderGuard {` of a third singleflight — constructing the guard is the
      # step that makes a thread a leader.
      - name: One shard-cache eviction loop and one singleflight
        run: |
          if grep -rEn --include='*.rs' '\.pop_lru\(\)|LeaderGuard[[:space:]]*\{' . \
               | grep -vE 'scx-format-io/src/backed/cache\.rs' \
               | grep -vE '(_tests\.rs|/tests/)' \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|///|//!)'; then
            echo "::error::LRU eviction or singleflight leadership outside backed/cache.rs — drive ShardCache::get_or_decode instead of restating it."
            exit 1
          fi
      # The negative grep cannot see a reader that grows its own cache without
      # naming either token. This is the positive half: each of the three
      # readers must reach its cache through the shared type.
      #
      # Scanned only up to the first `#[cfg(test)]`, so a test that drives
      # ShardCache cannot satisfy a guard about the production path — the
      # mistake round 2 of #439 caught in the catalog guard above.
      - name: All three backed readers share one ShardCache
        run: |
          set -e
          for f in csr csc dense; do
            if ! sed '/#\[cfg(test)\]/,$d' "scx-format-io/src/backed/$f.rs" \
                 | grep -qE 'get_or_decode[[:space:]]*\('; then
              echo "::error::backed/$f.rs no longer decodes through ShardCache::get_or_decode — that is how a second singleflight gets written."
              exit 1
            fi
          done

      # Phase 4a: the two *evaluators* share one descent.
      #
      # Deliberately only the positive half. A "nobody else destructures
      # Predicate::And/Or/Not" guard would be false: `pushdown::can_exclude_shard`
      # (Level-1 catalog pruning, different semantics — it answers "can this
      # shard be excluded", not "which rows match"), `collect::flatten_and`
      # (conjunct flattening, not evaluation) and
      # `category_diagnosis::string_equality_terms` all walk the tree for their
      # own reasons and legitimately do not go through `walk`. Guarding what is
      # actually true beats a guard that has to be exempted into meaninglessness.
      - name: Both predicate evaluators go through walk()
        run: |
          set -e
          for f in eval_inner eval_rowset; do
            # Extract the function BODY (signature line to the first
            # column-0 `}`) rather than a fixed -A window: a doc comment or
            # attribute added inside the signature would otherwise push `walk(`
            # out of range and fail the guard on correct code.
            if ! sed '/#\[cfg(test)\]/,$d' scx-engine/src/predicate.rs \
                 | sed -n "/^\(pub \)\?fn $f/,/^}/p" | grep -qE '\bwalk\(' ; then
              echo "::error::$f no longer evaluates through walk() — that is how the two evaluators drift apart again (review 5.1)."
              exit 1
            fi
          done

      # ORG-6.14-2: one predicate-index rebuild, so a rewrite op cannot grow its
      # own longhand copy again. Before 5c there were four rebuild bodies in
      # scx-ops, three obs-option resolvers, four copies of the var half, and the
      # `100_000` high-cardinality cap spelled out at seven sites -- which is how
      # `--index-preset <typo>` came to be a hard error on `convert` and a silent
      # fall-through to auto-detection on `merge` / `append` / `modify_metadata`.
      #
      # Both halves are asserted. Deleting `ObsVarIndexPass` outright would leave
      # the negative greps below trivially satisfied, so the positive half runs
      # first -- the mistake 6e's guard audit found in two existing guards.
      - name: One predicate-index rebuild pass, one high-cardinality cap
        run: |
          set -euo pipefail
          engine=scx-engine/src/index/build.rs
          pass=scx-ops/src/predicate_index.rs
          # Assert the inputs exist before asserting anything about them: a guard
          # keyed on a path that has moved passes vacuously and says nothing.
          for f in "$engine" "$pass"; do
            test -f "$f" || { echo "::error::$f is missing — this guard's paths moved; retarget it rather than deleting it (ORG-6.14-2)."; exit 1; }
          done

          # Positive half 1: the cap is declared once, in the engine.
          if ! grep -qE '^pub const HIGH_CARDINALITY_THRESHOLD: usize' "$engine"; then
            echo "::error::$engine no longer declares pub const HIGH_CARDINALITY_THRESHOLD — every builder derives the cap from it (ORG-6.14-2)."
            exit 1
          fi
          # Positive half 2: the shared resolver and the ops pass both exist, and
          # the pass is actually used by more than one op.
          if ! grep -qE '^pub fn resolve_predicate_index_build_options' "$engine"; then
            echo "::error::$engine no longer defines resolve_predicate_index_build_options — that is the one place an --index-preset is resolved, and where an unknown name errors (ORG-6.14-2)."
            exit 1
          fi
          if ! grep -qE '^pub struct ObsVarIndexPass' "$pass"; then
            echo "::error::$pass no longer defines ObsVarIndexPass (ORG-6.14-2)."
            exit 1
          fi
          n=$(grep -rhoE 'ObsVarIndexPass::(resolve|carried)\(' scx-ops/src --include='*.rs' \
                | wc -l | tr -d ' ')
          if [ "$n" -lt 5 ]; then
            echo "::error::ObsVarIndexPass has $n construction sites in scx-ops, expected at least 5 (append x2, merge x1, modify_metadata x2). An op that stopped using it has its own rebuild again (ORG-6.14-2). If a refactor legitimately merged two entry points, lower this number in the same commit."
            exit 1
          fi

          # Negative half 1: the cap is assigned nowhere else. Test files build
          # `PredicateIndexBuildOptions` directly to exercise the builder at other
          # thresholds, which is legitimate; production code must ask the table.
          if grep -rEn --include='*.rs' 'high_cardinality_threshold:' \
               scx-engine/src scx-ops/src scx-convert/src scx-cli/src pyscx/src \
               | grep -vE '(^|/)[a-z_]*_tests\.rs:' \
               | grep -vE "^($engine|$pass):" \
               | grep -vE ':[0-9]+:[[:space:]]*(//|///|//!)'; then
            echo "::error::a production site sets high_cardinality_threshold itself — resolve it through scx_engine::resolve_predicate_index_build_options (or ObsVarIndexPass) so the cap has one derivation (ORG-6.14-2)."
            exit 1
          fi
          # Negative half 2: the var half of a rebuild lives only in the pass.
          if grep -rEn --include='*.rs' 'build_var_predicate_index_bytes\(' scx-ops/src \
               | grep -vE "^$pass:" \
               | grep -vE '(^|/)[a-z_]*_tests\.rs:' \
               | grep -vE ':[0-9]+:[[:space:]]*(//|///|//!)'; then
            echo "::error::a scx-ops site builds the var predicate index directly — use ObsVarIndexPass::write_var so the var half exists once (ORG-6.14-2)."
            exit 1
          fi


      # ORG-7.21-1: one column-moments finalize, one cancellation threshold.
      # The Bessel-corrected `(sum(x^2) - n*mean^2)/(n-1)` per-column finalize was
      # written out nine times before Phase 7a -- four HVG CSR arms, one CSC arm,
      # two `scx-gpu` device arms and two `scx-accel/src/hvg/gpu.rs` batched arms,
      # four of them with a NaN-swallowing `.max(0.0)` clamp and five with
      # `if v < 0.0`. It now lives once, in `scx-sparse`, which is the only crate
      # below both `scx-accel` and `scx-gpu`.
      - name: One column-moments finalize, one cancellation threshold
        run: |
          set -euo pipefail
          prim=scx-sparse/src/moments.rs
          # Assert the input exists before asserting anything about it: a guard
          # keyed on a path that has moved passes vacuously and says nothing.
          test -f "$prim" || { echo "::error::$prim is missing — this guard's path moved; retarget it rather than deleting it (ORG-7.21-1)."; exit 1; }

          # Positive half 1: the primitive and the one threshold are declared here.
          for sym in 'pub fn finalize_column_moments' 'pub const CLOSED_FORM_VAR_REL_EPS' 'pub fn residual_lost_to_cancellation'; do
            if ! grep -qE "^$sym" "$prim"; then
              echo "::error::$prim no longer declares \`$sym\` — it is the single source of the per-column mean/variance finalize and its cancellation guard (ORG-7.21-1)."
              exit 1
            fi
          done
          # Positive half 2: the primitive is actually used by more than one crate.
          # Deleting it outright would otherwise leave the negative greps below
          # nothing to find, and this guard would pass on a fully re-duplicated tree.
          for crate in scx-accel scx-gpu; do
            n=$(grep -rhoE 'finalize_column_moments\(' "$crate/src" --include='*.rs' | wc -l | tr -d ' ')
            if [ "$n" -lt 2 ]; then
              echo "::error::$crate has $n finalize_column_moments call sites, expected at least 2. A kernel that stopped calling it has its own copy of the finalize again (ORG-7.21-1). If a refactor legitimately merged entry points, lower this number in the same commit."
              exit 1
            fi
          done

          # Negative half 1: nobody re-derives the finalize. `nb_glm/dispersion.rs`
          # is exempt and deliberately so -- it is a *scalar* per-gene variance, not
          # a per-column vector, and routing it through a vector primitive would
          # allocate two 1-element slices per gene inside a per-gene loop.
          # `*_tests.rs` files are exempt: a test re-implementing the formula to
          # check the kernel is the point (see pflog_tests.rs).
          if grep -rEn --include='*.rs' -- '- *(n|nf|total_f|n_obs as f64) \* mean \* mean' \
               scx-accel/src scx-gpu/src scx-format-io/src pyscx/src \
               | grep -vE '(^|/)[a-z_0-9]*_tests?\.rs:' \
               | grep -vE '(^|/)dispersion\.rs:' \
               | grep -vE ':[0-9]+:[[:space:]]*(//|///|//!)'; then
            echo "::error::a site computes the Bessel-corrected column variance itself — call scx_sparse::finalize_column_moments so the formula, the clamp and the cancellation report exist once (ORG-7.21-1)."
            exit 1
          fi
          # Negative half 2: the threshold is not redefined anywhere.
          if grep -rEn --include='*.rs' 'CLOSED_FORM_VAR_REL_EPS *: *f64 *=' \
               scx-accel/src scx-gpu/src scx-engine/src scx-format-io/src pyscx/src; then
            echo "::error::the cancellation threshold is redefined outside scx-sparse — one threshold, one definition, shared by the per-column, whole-matrix and pflog guards (ORG-7.21-1)."
            exit 1
          fi

      # ORG-7.21-5: one distance kernel per metric, in distances.rs.
      # `discrimination.rs` carried a private masked copy of all three metrics
      # that disagreed with the shared kernel on two of cosine's edge
      # conventions (a zero denominator gave 0.0 instead of 1.0, and the [0, 2]
      # clamp was missing). Every cell-eval parity claim in docs/scanpy.md rests
      # on those conventions, so a second kernel is a second set of them.
      - name: One distance kernel per metric
        run: |
          set -euo pipefail
          dist=scx-accel/src/eval_metrics/distances.rs
          # Assert the input exists before asserting anything about it.
          test -f "$dist" || { echo "::error::$dist is missing — this guard's path moved; retarget it rather than deleting it (ORG-7.21-5)."; exit 1; }

          # Positive half 1: both entry points are declared, in that file.
          for sym in 'pub fn point_distance' 'pub fn point_distance_masked'; do
            if ! grep -qE "^$sym\(" "$dist"; then
              echo "::error::$dist no longer declares \`$sym\` — it is the only place a pairwise distance is defined (ORG-7.21-5)."
              exit 1
            fi
          done
          # Positive half 2: the masked entry point is actually used outside its
          # own module. Without this, deleting it would leave the negative grep
          # below nothing to find and this guard would pass on a re-duplicated tree.
          n=$(grep -rlE 'point_distance_masked\(' scx-accel/src --include='*.rs' \
                | grep -vE '(^|/)distances(_[a-z_]+)?\.rs$' | wc -l | tr -d ' ')
          if [ "$n" -lt 1 ]; then
            echo "::error::no module outside distances.rs calls point_distance_masked — a column-excluding caller has its own kernel again (ORG-7.21-5)."
            exit 1
          fi

          # Negative half: within eval_metrics -- where every cell-eval parity
          # claim in docs/scanpy.md lives -- no file but distances.rs accumulates
          # cosine norms. `\bnorm_a\b` with word boundaries, because a bare
          # `norm_a` also matches inside the identifier
          # `zero_norm_and_range_hold_on_both_entry_points`; a grep cannot tell a
          # call from a sentence unless you make it.
          #
          # Scoped to eval_metrics deliberately, and the two things it does NOT
          # cover are legitimate rather than overlooked. `pca/cpu.rs` computes a
          # cosine *similarity* inside an inline `#[cfg(test)]` assertion, which is
          # not a distance kernel. `harmony/cpu.rs` computes `2*(1 - dot*inv_norm)`
          # -- a squared cosine distance against whole-matrix precomputed inverse
          # norms, not a per-pair distance; routing it through the pairwise kernel
          # would be both wrong and slower. CUDA C kernels in scx-gpu are out of
          # scope too, gated by their own CPU/GPU parity tests.
          if grep -rEln --include='*.rs' '\bnorm_a\b' scx-accel/src/eval_metrics \
               | grep -vE '(^|/)distances\.rs$' \
               | grep -vE '(^|/)[a-z_0-9]*_tests?\.rs$'; then
            echo "::error::the eval_metrics file(s) above accumulate cosine norms themselves — call distances::point_distance{,_masked} so the zero-norm and [0, 2] clamp conventions exist once (ORG-7.21-5)."
            exit 1
          fi

      # ORG-11.16-3: an export-only convert option cannot be NAMED on an ingest
      # call. `export_obs_keep_mask` / `export_min_counts` live on
      # `ExportOptions` and nowhere else. The runtime helper that used to police
      # this -- `reject_export_row_filter_on_import`, called at the top of all
      # five ingest entry points purely to turn a nonsensical combination into
      # an error string -- is deleted, because the type now expresses the
      # distinction.
      #
      # The convention the grep keys on: an export-only option is named
      # `export_*`. Declaring one on `IngestOptions` re-creates the whole "flag
      # silently ignored on the wrong direction" class (review 1.1, 11.12).
      #
      # This step used to name `scx-convert/src/pipeline.rs` and `sed` the struct
      # out of it. ORG-11.16-6 moved `IngestOptions` to `options.rs` (beside
      # `ExportOptions`) and turned `pipeline.rs` into `pipeline/mod.rs`, and
      # EITHER change silently disarmed the guard: `sed` on a file that no longer
      # holds the struct emits nothing, `grep` on empty input exits 1, and the
      # `if` is therefore false. Green. Measured on the 6e branch with a real
      # `pub export_bogus` field added to `IngestOptions`: the old guard passed.
      #
      # (The old `set -e` was not `pipefail`, so a missing file did not even
      # surface as an error -- `sed`'s status is discarded as the left side of a
      # pipe. That is the second, independent way it went vacuous.)
      #
      # So: find the declaration instead of assuming its path, and FAIL when the
      # search comes up empty or ambiguous. A guard that cannot tell "nothing to
      # check" from "checked, nothing wrong" is not a guard.
      - name: No export-only option is declared on the ingest options
        run: |
          set -euo pipefail
          if grep -rEn --include='*.rs' 'fn reject_export_row_filter_on_import' . \
               | grep -v '^./target'; then
            echo "::error::reject_export_row_filter_on_import is back — the ingest/export split is what makes it unnecessary (ORG-11.16-3)."
            exit 1
          fi
          src=$(grep -rlE '^pub struct IngestOptions \{' --include='*.rs' scx-convert/src || true)
          if [ -z "$src" ]; then
            echo "::error::no 'pub struct IngestOptions {' declaration found under scx-convert/src — this guard just went vacuous. Retarget it rather than deleting it (ORG-11.16-3)."
            exit 1
          fi
          if [ "$(printf '%s\n' "$src" | wc -l)" -ne 1 ]; then
            echo "::error::more than one IngestOptions declaration, so the grep below would only check one of them: $src"
            exit 1
          fi
          if sed -n '/^pub struct IngestOptions {/,/^}/p' "$src" \
               | grep -nE '^[[:space:]]*pub[[:space:]]+export_'; then
            echo "::error::an export-only option (export_*) is declared on IngestOptions — it belongs on ExportOptions (ORG-11.16-3)."
            exit 1
          fi
      # The greps above only reject a forbidden shape, so re-widening an export
      # entry point back to the ingest type would pass them: no forbidden token
      # appears. This is the positive half. Named individually rather than
      # counted, so adding a private helper does not move the number.
      #
      # Known limit, stated so a green run is not read as more than it is: the
      # negative half keys on a NAMING convention, so a genuinely export-only
      # field called something other than `export_*` slips through. What catches
      # that is the compiler, once the field is on ExportOptions; the grep is a
      # tripwire against re-widening IngestOptions, not a classifier.
      - name: Every export entry point takes ExportOptions
        run: |
          set -e
          for f in scx_to_h5ad_streaming write_scx_to_h5ad_streaming \
                   scx_to_h5mu_streaming scx_modality_to_h5ad_streaming; do
            if ! grep -rA8 --include='*.rs' "pub fn $f(" scx-convert/src \
                 | grep -qE 'opts:[[:space:]]*&(crate::)?(options::)?ExportOptions'; then
              echo "::error::$f no longer takes &ExportOptions — an export writer that accepts ingest options can silently ignore half of them (ORG-11.16-3)."
              exit 1
            fi
          done

      # ORG-11.16-5: memory-budget arithmetic is derived in exactly one place,
      # `scx-convert/src/budget.rs`. Review 11.5 is what one-site drift looks
      # like: `dense_stream.rs` divided the budget by 4 in one function and
      # multiplied the resulting slab by 2 in another, spending the same reserve
      # twice and collapsing every budget-bound dense convert to a single
      # thread. The same line also keyed its reserve to the source dtype width,
      # which the resident buffers do not depend on, so a u8 input exceeded its
      # budget threefold.
      #
      # Dividing or multiplying any identifier CONTAINING `budget` by an integer
      # literal is the fingerprint of a hand-rolled reservation; a legitimate
      # caller asks the table for a `Share`.
      #
      # The pattern is `[a-z_]*budget[a-z_]*`, not `\bbudget[a-z_]*`. The first
      # version used a word boundary and so matched only a bare `budget`,
      # missing `memory_budget / 4` and `opts.memory_budget / 4` -- the
      # spellings the real call sites actually use -- because `_` is a word
      # character, so `\bbudget` cannot match inside `memory_budget`. It was
      # falsified with a bare `budget / 4` and passed, which is exactly how a
      # guard weaker than its own comment survives review. Test modules are exempt (they assert on
      # the numbers); a justified standalone use marks itself
      # `ORG-11.16-5-ALLOW` with a reason.
      - name: Budget arithmetic lives only in scx-convert/src/budget.rs
        run: |
          if grep -rEn --include='*.rs' \
               '[a-z_]*budget[a-z_]*[[:space:]]*(/|\*)[[:space:]]*[0-9]' scx-convert/src \
               | grep -vE 'scx-convert/src/budget(_tests)?\.rs' \
               | grep -vE 'scx-convert/src/convert_tests_' \
               | grep -vE 'ORG-11\.16-5-ALLOW' \
               | grep -vE ':[0-9]+:[[:space:]]*(//|///|//!)'; then
            echo "::error::budget arithmetic outside scx-convert/src/budget.rs — add a Reservation row and ask the table for a Share instead of dividing the budget inline (ORG-11.16-5)."
            exit 1
          fi
      # The arithmetic grep above cannot see a budget bypassed as a CONSTANT or a
      # STRING rather than a division -- which is how the CSC sidecar ignored
      # `memory_budget` for three releases while the pipeline documented the
      # opposite: the call sites passed `DEFAULT_CSC_MEMORY_BYTES` and the
      # literal "4G". Both spellings now come from
      # `budget::csc_sidecar_bytes(opts.memory_budget)`.
      #
      # Scoped to every crate that can build a sidecar, not just scx-convert:
      # the first version of this guard looked only at `scx-convert/src` and so
      # missed `pyscx`'s `from_anndata`, which was a fifth site passing the
      # default. A guard that stops at the crate the bug was found in only
      # catches the instance, not the class.
      - name: No scx-convert site hard-codes a sidecar memory budget
        run: |
          set -e
          if grep -rEn --include='*.rs' 'DEFAULT_CSC_MEMORY_BYTES' \
               scx-convert/src pyscx/src scx-ops/src \
               | grep -vE 'scx-convert/src/budget\.rs' \
               | grep -vE ':[0-9]+:[[:space:]]*(//|///|//!)'; then
            echo "::error::a scx-convert call site passes DEFAULT_CSC_MEMORY_BYTES directly — route it through budget::csc_sidecar_bytes so --memory-budget reaches the sidecar (ORG-11.16-5)."
            exit 1
          fi
          if grep -rEn --include='*.rs' '"[0-9]+[KMGT]"' scx-convert/src \
               | grep -vE ':[0-9]+:[[:space:]]*(//|///|//!)'; then
            echo "::error::a scx-convert call site hard-codes a byte-size string (e.g. \"4G\") — pass a resolved budget instead (ORG-11.16-5)."
            exit 1
          fi
      # Positive half: deleting the table outright leaves the grep above nothing
      # to find. The two dense sites that drifted apart in 11.5 -- the slab cap
      # in `open_dense_streaming` and the estimate in `per_worker_bytes` -- must
      # each derive from it. Re-splitting them is exactly the double-count.
      #
      # Names a single FILE, which is the same coupling that silently disarmed the
      # IngestOptions guard above -- and it fails the same way, verified: with the
      # path missing, `grep -c` writes nothing, `|| true` swallows the error, `n`
      # is the empty string, and `[ "" -lt 3 ]` exits 2 with "integer expression
      # expected", which makes the `if` FALSE. Vacuous pass, with the diagnosis
      # buried in stderr. 6e does not move `dense_stream.rs`, so the assertion
      # below is pre-emptive rather than a fix -- but the guard is one file move
      # away from silence and there is no reason to leave it there.
      - name: Both dense budget sites derive from one table entry
        run: |
          set -euo pipefail
          f=scx-convert/src/h5ad/dense_stream.rs
          if [ ! -f "$f" ]; then
            echo "::error::$f not found — this guard just went vacuous. Retarget it rather than deleting it (ORG-11.16-5)."
            exit 1
          fi
          # Count CALLS, not mentions. The original counted 5 "sites" in this
          # file, one of which is a doc comment on line 8 naming
          # `dense_peak_bytes_per_elem` in prose -- so with a threshold of 3 the
          # guard tolerated a real call being inlined away and still passed
          # (verified). Comment lines are excluded and the floor is the actual
          # production call count, which makes losing any one of them fail.
          n=$(grep -nE 'crate::budget::dense_(slab_bytes|max_slab_rows|min_budget|peak_bytes_per_elem)[[:space:]]*\(' \
                "$f" \
                | grep -vE '^[0-9]+:[[:space:]]*(//|///|//!)' \
                | wc -l)
          if [ "${n:-0}" -lt 4 ]; then
            echo "::error::expected at least 4 crate::budget::dense_* CALLS in $f (slab cap, refusal message, per_worker_bytes estimate), found ${n:-0} (comment lines excluded). Re-deriving any of them locally is the 11.5 double-count (ORG-11.16-5)."
            exit 1
          fi

  feature-check:
    name: Feature matrix (cargo check)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # scx-cli cloud feature only
          - flags: "-p scx-cli --features cloud --all-targets"
            name: "scx-cli --features cloud"
          # scx-cli cloud + hdf5 — pulls in the hdf5-rust bindings
          - flags: "-p scx-cli --features hdf5,cloud --all-targets"
            name: "scx-cli --features hdf5,cloud"
          # scx-accel gpu feature — requires cudarc stubs only, no CUDA toolkit
          - flags: "-p scx-accel --features gpu --all-targets"
            name: "scx-accel --features gpu"
          # scx-convert hdf5 — the ingest/export path. The `test` job runs
          # default features only, so before this lane existed the hdf5-gated
          # half of scx-convert (including its test modules) was compiled by no
          # CI job at all.
          - flags: "-p scx-convert --features hdf5 --all-targets"
            name: "scx-convert --features hdf5"
          # pyscx gpu feature — the rapids-absent lane (ACC-RUST-OPT-V4 §4.3).
          # Compiles + clippy-checks the gpu-gated rapids routing on a CPU runner
          # with neither CUDA nor rapids-singlecell present (cudarc stubs compile);
          # the detected-dependency contract (pyscx imports + CPU/streaming/loader
          # run with rapids absent) holds by construction, and the planner's
          # no_rapids branch is unit-tested in `cargo test` (scx-accel route).
          # The runtime no_rapids→CPU assertion on a GPU host without rapids is a
          # Phase 2.2 GPU gate (needs hardware CI does not have).
          - flags: "-p pyscx --features gpu --all-targets"
            name: "pyscx --features gpu"
          # pyscx hdf5 + gpu — the documented GPU build combo (report F2).
          # maturin's `--features` REPLACES the pyproject default set (which
          # includes hdf5), so the docs/skills build with `--features hdf5,gpu`;
          # this guards that the combo compiles + clippy-checks so the h5ad I/O
          # path can't silently regress under a GPU build.
          - flags: "-p pyscx --features hdf5,gpu --all-targets"
            name: "pyscx --features hdf5,gpu"
          # pyscx cloud — covered by the python job; also check standalone
          - flags: "-p pyscx --features cloud --all-targets"
            name: "pyscx --features cloud"
          # scx-gpu's benchmark binary is `required-features = ["bench"]`, so no
          # default-feature lane ever compiles it — a `scx-codec` signature change
          # broke it and every GPU lane here still passed. It is the binary
          # `benchmarks/scripts/slurm_gpu_bench.sh` runs, so the break would have
          # surfaced hours into a SLURM job instead of in CI.
          - flags: "-p scx-gpu --features bench --bin gpu_bench"
            name: "scx-gpu --features bench (gpu_bench bin)"
          # scx-format-io's three non-default feature configurations. The `test`
          # job runs default features (`parallel` + `deletion-vectors`), so
          # without these no CI job compiles the sequential reader or the
          # deletion-vector-free build at all.
          #
          # `--all-targets`, not the `--lib` the first of these used to carry:
          # this job runs check + clippy, and without `--all-targets` neither
          # reaches the test target. `--lib` was there because the test target
          # did not compile with `parallel` off; it does now, and compiling it
          # is the point -- that is what surfaced three dead-code warnings and
          # two tests that *fail* without `parallel` (the prefetch bit-identity
          # pair, on their own vacuity guard, now gated with it).
          - flags: "-p scx-format-io --no-default-features --features deletion-vectors --all-targets"
            name: "scx-format-io (parallel off)"
          - flags: "-p scx-format-io --no-default-features --features parallel --all-targets"
            name: "scx-format-io (deletion-vectors off)"
          - flags: "-p scx-format-io --no-default-features --all-targets"
            name: "scx-format-io (neither feature)"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # PR branches restore-only; only main saves the cache. The post-job
          # cache-save step packs the whole-workspace target/ and was running the
          # runner out of disk on PRs ("No space left on device" — tests passed,
          # only the save failed). main keeps the cache fresh.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # hdf5 feature needs the system library. Install on demand.
      - name: Install hdf5 dev headers
        if: contains(matrix.flags, 'hdf5')
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - name: cargo check ${{ matrix.name }}
        run: cargo check ${{ matrix.flags }}
      - name: cargo clippy ${{ matrix.name }}
        run: cargo clippy ${{ matrix.flags }} -- -D warnings

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    # Fork-safety regression tests run inside the same job.
    # `OMP_NUM_THREADS=1` keeps OpenMP-using deps (scanpy, numpy via
    # OpenBLAS) from spawning extra threads in the parent that would
    # amplify any future fork-after-pthread regression. `RUST_LOG=warn`
    # surfaces the bounded-shutdown warnings (`pipeline.rs::join_handle_bounded`)
    # to the CI log without flooding it with trace-level events.
    env:
      OMP_NUM_THREADS: "1"
      RUST_LOG: "warn"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pin pyarrow to the new upper bound of the supported range
      # (pyscx/pyproject.toml: pyarrow>=14,<24) so CI exercises the
      # widened cap rather than whatever pyarrow pip happens to resolve.
      # `torch` is added so `pyscx/tests/test_fork_safety.py` runs
      # instead of being skipped via `pytest.importorskip("torch")`.
      # CPU build only — the fork-safety test does no GPU work. Install
      # torch from PyTorch's CPU-only index URL; the default PyPI torch
      # wheel on Linux pulls a >1 GB CUDA cascade (cuda_toolkit, cudnn,
      # cusparselt, nccl, nvshmem, triton) that has timed out mid-download
      # at PyPI in past runs and is wasted bandwidth on a CPU runner.
      # `pydeseq2` is added so the `pseudobulk_dex` / `pdex_nb_glm` DESeq2 path
      # actually runs here instead of being skipped. It previously had zero CI
      # coverage, which is how a bug that mutated process-global
      # NUMBA_NUM_THREADS (breaking every later numba compile) shipped green —
      # see tests/test_pseudobulk_thread_env.py.
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0;sys_platform=='linux'"
          pip install maturin pytest numpy scipy "pyarrow==23.0.1" anndata scanpy igraph scikit-misc python-dotenv formulaic polars pydeseq2
      # libhdf5 is needed by the `hdf5` pyscx feature, which exposes
      # `pyscx.from_h5ad` and the backed-AnnData → streaming router that
      # `tests/test_streaming_conversion.py` exercises.
      - name: Install hdf5 dev headers
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - run: . .venv/bin/activate && cd pyscx && maturin develop --features cloud,hdf5 && pytest --ignore=tests/test_scvi_integration.py

  # The `python` job above hand-installs every optional package, so it has never
  # exercised what `pip install pyscx` actually produces. That gap is exactly how
  # eight default paths shipped broken with no extra that would fix them.
  #
  # `tests/test_optional_deps.py` simulates a base install with a `sys.meta_path`
  # blocker, which covers the *code* — but a blocker cannot catch a pyproject
  # typo that ships a wheel whose extras don't resolve, or an extra that pins the
  # wrong distribution. Only a real wheel in a real empty venv can. Hence this
  # job installs the built wheel with no extras at all and runs the
  # `test_base_install_*` subset plus the packaging assertions.
  base-install:
    name: Base install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `[tool.maturin] features` includes `hdf5`, which links dynamically
      # against libhdf5 — same reason the `python` and `feature-check` jobs
      # install this. Building without it fails in `hdf5-metno-sys`'s build
      # script ("Unable to locate HDF5 root directory and/or headers"), which is
      # invisible on a dev box that already has the headers.
      - name: Install hdf5 dev headers
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - name: Build the wheel
        run: |
          python -m venv .build-venv
          . .build-venv/bin/activate
          pip install maturin
          cd pyscx && maturin build --release --out ../dist
      # A separate interpreter with ONLY pyscx's declared hard dependencies —
      # whatever the wheel itself resolves. Nothing is installed by name here on
      # purpose: naming a package would recreate the blind spot this job exists
      # to close.
      - name: Install into an empty venv and run the base-install suite
        run: |
          python -m venv .base-venv
          . .base-venv/bin/activate
          pip install dist/*.whl pytest
          python - <<'EOF'
          import importlib.util as u
          for m in ("scanpy", "skmisc", "pydeseq2", "polars", "formulaic", "mudata"):
              assert u.find_spec(m) is None, f"{m} leaked into the base venv — this job is not testing a base install"
          print("confirmed: no optional package present")
          EOF
          cd pyscx && pytest tests/test_optional_deps.py -v \
            -k "base_install or advertised_extra or extras_pin or dev_extra or blocker"

  # NOTE: the fork-safety tests should also run on Linux aarch64 in
  # addition to x86_64 — aarch64 + glibc fork semantics differ subtly
  # enough to be worth covering. GitHub's `ubuntu-24.04-arm` runners
  # are available for public repos as of 2025; adding an aarch64 matrix
  # entry here is a follow-up. The fix itself is architecture-
  # independent (rayon's global pool + fork hazard is generic POSIX),
  # but a full regression net wants both.
