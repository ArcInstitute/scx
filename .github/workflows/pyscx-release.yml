name: pyscx release wheels

on:
  push:
    tags:
      - "pyscx-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to attach the release to (e.g. pyscx-v0.1.0). Required for workflow_dispatch."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} wheel (py${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        # Attach a runner to each target. aarch64 builds natively on an arm
        # runner inside the manylinux2014 aarch64 container (no QEMU). Pin to
        # ubuntu-22.04 for parity with scx-cli-release.yml; the manylinux
        # container — not the host — sets the wheel's glibc floor.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: pyscx
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: >-
            --release
            --strip
            --out dist
            --interpreter python${{ matrix.python-version }}
            --features hdf5-static,cloud

      - name: List built wheels
        run: ls -lh pyscx/dist

      - uses: actions/upload-artifact@v4
        with:
          name: pyscx-wheel-${{ matrix.target }}-py${{ matrix.python-version }}
          path: pyscx/dist/*.whl
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pyscx-wheel-*
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: dist/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true
