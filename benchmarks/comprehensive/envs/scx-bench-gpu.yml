# SCX Comprehensive Benchmark Suite — GPU Environment
#
# Extends the CPU benchmark env with CUDA + RAPIDS (cuVS, cuGraph) for
# GPU-accelerated PCA, kNN, UMAP, Leiden, and fused preprocessing benchmarks.
#
# Create:   conda env create -f benchmarks/comprehensive/envs/scx-bench-gpu.yml
# Activate: conda activate scx-bench-gpu
# Build pyscx: cd pyscx && maturin develop --release --features gpu && cd ..
#
# IMPORTANT: Pin cuda-version to match your NVIDIA driver's max CUDA version.
#   Driver 535.x → cuda-version=12.2  (DO NOT USE — see note below)
#   Driver 550.x → cuda-version=12.4
#   Driver 560.x → cuda-version=12.6  (preferred — Chimera's driver)
# PyTorch is taken from conda-forge's cuda126 builds (the `pytorch-cuda`
# metapackage on the pytorch channel caps at 12.4 and conflicts).
# Check with: nvidia-smi (look for "CUDA Version: 12.x" in top-right corner)
#
# 2026-05-20: bumped cuda-version 12.2 → 12.6 and relaxed RAPIDS / pyarrow
# pins. The 12.2-toolkit libcusparse=12.1.2.141 produced wrong
# CUSPARSE_SPMM_ALG_DEFAULT results, breaking GPU PCA correctness floors
# (subspace cosines ≈ 0.03 vs ≥ 0.9 absolute floor). Bumping cuda-version
# pulls in libcusparse ≥ 12.4.x, which fixes it. The existing
# i64→i32 indptr workaround in scx-gpu/src/cusparse.rs is preserved as
# defense in depth for older driver/toolkit combos.
#
# NOTE: pyscx is built from source inside the env with --features gpu.

name: scx-bench-gpu
channels:
  - rapidsai
  - conda-forge
  - defaults

dependencies:
  # Python — kept loose; conda solver picks 3.12 or 3.13 to match RAPIDS builds.
  - python>=3.11,<3.14

  # Core single-cell stack
  - anndata>=0.12
  - scanpy>=1.12
  - scipy>=1.15
  - numpy>=2.0
  - pandas>=2.2
  - h5py>=3.14

  # Format-specific. Pyarrow left to solver — cugraph pins it transitively;
  # 21.0.0 was previously forced and that constraint cascade made the broken
  # env unable to upgrade cuda-version cleanly.
  - zarr>=3.0
  - pyarrow
  # tiledbsoma is installed via pip below; the conda-forge alias was renamed
  # to tiledbsoma-py and isn't a drop-in.

  # Analysis
  - scikit-learn>=1.5
  - scikit-misc>=0.5  # skmisc.loess — scanpy HVG `flavor="seurat_v3"` path
  - umap-learn>=0.5
  - leidenalg>=0.10
  - python-igraph>=0.11

  # Visualization
  - matplotlib>=3.8
  - seaborn>=0.13

  # System monitoring
  - psutil>=5.9

  # Build tooling
  - maturin>=1.5
  - patchelf  # silences pyscx maturin RPATH warning post-install

  # CUDA + RAPIDS — the reason this env exists. cuda-version=12.6 matches
  # Chimera's driver 560.x. cugraph/cuvs upper bound at <26.04 because
  # 26.04+ shipped cuda13-only. Lower bound 25.10 — solver picks latest
  # (currently 26.02, matching the historical env). NB: GPU Leiden ARI vs
  # leidenalg is ≈ 0 on both 25.12 and 26.02 (documented limitation in
  # CLAUDE.md, justified in
  # `results/justifications/accel_leiden_gpu_cugraph_label_divergence.md`).
  - cuda-version=12.6
  - cuvs>=25.10,<26.04
  - cugraph>=25.10,<26.04

  # PyTorch with CUDA (for GPU ML loader benchmarks). Use conda-forge's
  # `cuda126` builds — the official pytorch channel's `pytorch-cuda`
  # metapackage caps at 12.4 and conflicts with cuda-version=12.6.
  - pytorch=*=*cuda126*

  # pip-only packages
  - pip
  - pip:
    - submitit>=1.5.0
    - tiledbsoma>=2.3.0
    - tiledbsoma-ml>=0.1.0
