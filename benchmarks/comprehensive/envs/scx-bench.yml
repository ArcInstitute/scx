# SCX Comprehensive Benchmark Suite — CPU Environment
#
# All CPU benchmarks: format comparisons, accelerators, lazy preprocessing,
# correctness validation, ML data loaders.
#
# Create:   conda env create -f benchmarks/comprehensive/envs/scx-bench.yml
# Activate: conda activate scx-bench
# Build pyscx: cd pyscx && maturin develop --release && cd ..
#
# NOTE: pyscx is built from source inside the env; it is not a conda package.

name: scx-bench
channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.13

  # Core single-cell stack
  - anndata=0.12.7
  - scanpy=1.12
  - scipy=1.16.3
  - numpy=2.2.0
  - pandas=2.3.3
  - h5py=3.16.0

  # Multimodal (Phase K): h5mu / MuData round-trip + benchmarks.
  # Required by `multimodal_compression`, `multimodal_training`,
  # the h5mu_runner / zarr_mudata_runner format runners, and
  # pyscx.from_mudata / to_mudata. Without this, every multimodal
  # convert/bench job ImportError's at runtime. mudata 0.3.x is the
  # current PyPI cap (0.4.x not yet released as of 2026-05); upgrade
  # the pin once 0.4 ships.
  - mudata=0.3.8

  # Format-specific
  - zarr=3.1.5
  - pyarrow=23.0.1
  - tiledbsoma=2.3.0

  # Cloud object-store (zarr + anndata async store routing for gs:// URIs).
  # Both packages must land via the same channel (conda-forge here) so that
  # gcsfs's protocol registration is visible to fsspec at import time. The
  # 2026-05-10 tier-full gate caught a worker env where conda's solver
  # silently dropped gcsfs but left fsspec, breaking 24 zarr cloud_*/zarr_*
  # cells with "Please install gcsfs to access Google Storage". Pin to a
  # matched-version pair so future env rebuilds preserve the registration.
  - fsspec=2026.2.0
  - gcsfs=2026.2.0

  # Analysis (for accelerator comparisons against scanpy)
  - scikit-learn=1.8.0
  - umap-learn=0.5.11
  - leidenalg=0.11.0
  - python-igraph=1.0.0

  # Visualization
  - matplotlib=3.10.8
  - seaborn=0.13.2

  # System monitoring
  - psutil=7.2.2

  # Cloud fixture fingerprinting (see cloud_fixtures.compute_blake3). The
  # fallback to hashlib.blake2b was removed because it produced hashes
  # that silently disagreed with the Rust writer — blake3 is now required.
  - blake3=0.4

  # Build tooling (for pyscx from source)
  - maturin>=1.5.0

  # PyTorch (CPU-only — for ML data loader benchmarks)
  - pytorch-cpu>=2.0

  # pip-only packages
  - pip:
    - submitit>=1.5.0
    # TileDB-SOMA-ML (separate package, not on conda-forge)
    - tiledbsoma-ml>=0.1.0
    # cell-eval / arc-bench for the cell_eval_parity_perf benchmark.
    #
    # cell-eval is public — pin to the tag the parity suite was validated
    # against. arc-bench is private; the SSH URL relies on the user's own
    # GitHub SSH key (works inside Arc's network without embedded secrets).
    # Override with a local clone for development:
    #     pip install -e /path/to/local/cell-eval -e /path/to/local/arc-bench
    - cell-eval @ git+https://github.com/arcinstitute/cell-eval.git@v0.7.0
    - arc-bench @ git+ssh://git@github.com/arcinstitute/arc-bench.git@54563413dffb92ed8fb6e6c3647fa4fb5f07d091
    - pdex>=0.2.0
    - polars>=1.30.0
    - tqdm>=4.67
    # Required by validate_scanpy_equivalence.check_pseudobulk_dex /
    # check_pseudobulk_dex_stratified — without it those tests
    # self-classify as Skipped and the 4 pseudobulk rows in the Scanpy
    # API Equivalence table render as "pydeseq2 not installed — skipped".
    - pydeseq2>=0.5.4
