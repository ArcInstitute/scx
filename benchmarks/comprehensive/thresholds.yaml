# 19. cloud_metadata / `scx info <cloud-url>` — OPT-CLOUD-1
#     A subprocess arm, added in PR-02c: `scx info --json <gs://…>`. Not a
#     duplicate of the in-process `read_cloud_metadata` arm — `scx info` fills
#     two columns the library open does not (the per-shard codec breakdown and
#     the value-encoding summary) by range-reading every CSR shard's 76-byte
#     header at `METADATA_SHARD_FETCH_CONCURRENCY = 8`. That constant is what
#     OPT-CLOUD-1 raises, and only this arm moves when it does.
#
#     *** THE "~175 s -> ~22 s expected" FIGURE THIS ENTRY CARRIED IS WRONG. ***
#     Measured through the capture on the tier fixtures, `wall_s__scx_info_cloud`
#     medians are **0.21 s (pbmc3k / pbmc10k), 0.23 (smartseq2), 0.24 (tabula),
#     0.41 (census_500k), 0.62 (census_1m)** — three orders off. Whatever the
#     175 s described, it was not `scx info` over these fixtures. Two
#     consequences: OPT-CLOUD-1's expected win here is a fraction of a second,
#     not minutes, so it should not be justified on this arm; and the metric is
#     close to the "do not floor a quantity smaller than its own noise" rule —
#     census_1m ranges 0.587 / 0.622 / 1.506 across three runs, a 2.4x spread
#     on a sub-second number. Floor it if you like, but expect the ceiling to
#     be doing very little.
#
#     ACTIVATION, and the ORDER matters:
#       1. `scx_info_cloud_ok` -> min: 1.0 can be authored FIRST and needs no
#          recapture: it is a 0/1 emitted on every run of the arm, and a 0
#          means the CLI exited non-zero or printed an `n_obs` that disagreed
#          with the dataset. It is deliberately NOT authored in PR-02c only
#          because the arm skips (recording a reason, emitting nothing) on a
#          build without `--features cloud`, which would read as a
#          missing-metric violation on any host that has not built one.
#          Author it once the capture flow builds a cloud CLI.
#          `scx_info_cloud_ok` is 1 only when BOTH `n_obs` and `n_vars` match
#          the dataset's own. `n_obs` alone accepted any file with the same
#          cell count — a stale catalog, the wrong URL resolved — and recorded
#          its (fast) wall as a successful open.
#       2. `wall_s__scx_info_cloud` -> max: 1.25x the recaptured median, and
#          read that median from a capture on the SAME fixture: the metric is
#          proportional to shard count, so it is not comparable across
#          datasets.
#       3. `harness_rss_mb__scx_info_cloud` is the *harness's* footprint while
#          a child process does the work, so it is a diagnostic, not a bound on
#          the operation — and deliberately not called a peak: the harness
#          blocks in `waitpid` and allocates nothing, so there is no peak to
#          sample. The child's own would need `wait4` rusage, the same gap
#          `doublet_interop`'s `residual_rss_mb` documents. Do not floor it.
#
#     The arm adds **no runs**: its keys are attached to the in-process runs
#     that already exist, so `median_wall_s`, `wall_s_iqr`, `n_runs` and
#     `peak_rss_mb_median` are exactly what the library arm left them and
#     `_load_current_raw_metric` still medians the sparse key over the runs
#     carrying it. That is why this arm has NO justification file, and why one
#     must not be added if the arm is ever changed to append instead: an
#     `open_cloud` catalog read is sub-second and `scx info` was ~175 s on the
#     largest fixture, so pooling them produces a median describing neither.
#     `test_cli_info_arm_adds_no_runs_and_leaves_the_pooled_medians_alone`
#     enforces it.
#
#  16. **A budget-bound ceiling on the grouped-sort side, and on the genuinely
#      worst fixture.** OPT-CONVERT-10 charged the framed encode's transient to
#      both budgeted callers, and the ingest half is gated above
#      (`peak_over_memory_budget__budget_bound` on smartseq2, measured at 0.505
#      against a 1.0 observed ceiling — not a contract; the allocation rows stay
#      `enforced: false` — with the arm's own 12-thread pin and a binary-MiB
#      denominator). Two halves are deliberately NOT gated:
#
#      a. **`grouped_sort` under a memory budget.** `pyscx.sort` accepts
#         `memory_budget` and `grouped_fast_concurrency` now charges the whole
#         block phase (`GROUPED_BLOCK_PHASE_MULTIPLE`), so the arm is
#         implementable — but two things would make its floor decorative. All
#         five `GROUP_SPEC` datasets sit outside every `capture_baseline.TIERS`
#         list, so a default gate run never produces the triple and the floor
#         is skipped silently (the same shape as the three unevaluable
#         `grouped_peak_rss_mb` ceilings above). And `grouped_sort` samples
#         **in-process** with a `_gc()` between ops, so a budget arm's peak
#         inherits the previous arm's retained glibc heap — the contamination
#         that made `conversion_streaming` climb 1722 -> 2983 -> 3472 MB across
#         three identical runs. Blockers, in order: port `grouped_sort` to the
#         subprocess-per-arm pattern `conversion_streaming` uses, then either
#         tier one grouping dataset or accept an explicitly `--datasets`-scoped
#         floor.
#
#      b. **The worst reachable fixture.** The charge is set by
#         `encoded <= payload`, which is *tight* only on incompressible integer
#         data — `chemogenetic_rgfp` (~6,700 nnz/cell of raw integer UMIs) is
#         the case where the bound is met rather than slacked, and
#         `budget.rs`'s own derivation names integer ATAC peaks as the worst
#         codec path (`Lz4Shuffle` approaching its 8 B/nnz input). smartseq2 is
#         deep but compressible, which is why its ratio is 0.55 and not near 1.
#         `chemogenetic_rgfp` is off-tier, and the only ATAC fixture
#         (`multiome_pbmc`) is `.h5mu` and reachable only by the three
#         multimodal benchmarks, so neither can carry a default-gate floor
#         today. Measure under `--datasets chemogenetic_rgfp` before tiering
#         anything: if that ratio is also well under 1, the bound is loose and
#         `ENCODE_TRANSIENT_MULTIPLE` is worth re-deriving downward, which
#         would give budgeted callers concurrency back.
