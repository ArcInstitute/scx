# Absolute-floor regression thresholds.
#
# Consumed by ``compare_against_baseline.py --gate --thresholds <this-file>``.
# For each entry, the gate reads the named metric out of every run's
# ``extra`` dict in ``<current_run>/raw/<benchmark>__<format>__<dataset>.json``,
# takes the median across runs, and fails when the median violates the
# declared bound (or the metric is missing entirely).
#
# These floors are absolute — they don't depend on the baseline snapshot,
# and they survive baseline promotion. Use them for hard contracts: "a
# cloud push at or below 50 MB/s is a support incident regardless of the
# prior snapshot's numbers." Relative-tolerance checks (the default diff)
# remain the primary gate.
#
# Schema:
#   absolute_floors:
#     - benchmark: <benchmark name>   # matches the benchmark's result 'benchmark' field
#       format:    <format key>       # e.g. scx_auto
#       dataset:   <dataset name>
#       metric:    <field name in runs[].extra>
#       min:       <float>            # observed must be >= min (higher-is-better)
#       # --- OR ---
#       max:       <float>            # observed must be <= max (lower-is-better, e.g. wall_s)
#       # direction is inferred from min/max; set explicitly only to disambiguate.

absolute_floors:
  # GPU pdex_ref CSC-direct route assertion. `accel_de.py` emits
  # `de_route_csc_direct` in runs[].extra for the GPU pdex_ref triple: 1.0
  # when the CSC-direct route ran (or wasn't expected this run), 0.0 on a
  # *silent fallback* — i.e. a CSC sidecar fixture was built, yet the
  # CSR-direct route `gpu_csr_v3` ran. The floor
  # turns "benchmarked the wrong route" into a hard gate failure. The metric
  # is always present (never a missing-metric violation); a 0.0 means the
  # planner/dispatch silently dropped off the intended CSC-direct path. See
  # docs/performance.md § pdex_ref GPU v3-CSC and the accelerator route
  # metadata on adata.uns["scx_accel"].
  #
  # Gated on three tiers: pbmc3k (single CSC shard — the minimal route check),
  # tabula_sapiens_100k, which exercises the **multi-shard** CSC-direct path
  # (multi-shard CSC iteration + range prefiltering) that pbmc3k can't reach,
  # and census_1m (the largest tier with a built CSC sidecar — guards the
  # range-prefilter path at atlas scale). All are no-ops unless a run builds a
  # CSC fixture (v3 CSC-direct is the default route); then a silent multi-shard
  # CSC->CSR fallback at scale fails the gate. `check_absolute_floors` skips any
  # triple silently on runs that didn't execute it.
  - benchmark: accel_de
    format: accel_de__pyscx_pdex_ref_gpu
    dataset: pbmc3k
    metric: de_route_csc_direct
    min: 1.0
  - benchmark: accel_de
    format: accel_de__pyscx_pdex_ref_gpu
    dataset: tabula_sapiens_100k
    metric: de_route_csc_direct
    min: 1.0
  - benchmark: accel_de
    format: accel_de__pyscx_pdex_ref_gpu
    dataset: census_1m
    metric: de_route_csc_direct
    min: 1.0
  # GPU Wilcoxon route gate. `accel_de.py` emits `wilcoxon_route_gpu_correct`
  # for the GPU Wilcoxon triple: 1.0 when a GPU route ran (always a v3 DE route
  # `gpu_csc_v3`/`gpu_csr_v3` since the v1/v2 drivers were removed), 0.0
  # on a silent CPU fallback. The variant is skipped on non-GPU hosts (so a
  # recorded route always means GPU was attempted); a cpu_* route here means
  # dispatch silently fell off the GPU path. Gated on the same tiers DE GPU
  # runs at.
  - benchmark: accel_de
    format: accel_de__pyscx_wilcoxon_gpu
    dataset: pbmc3k
    metric: wilcoxon_route_gpu_correct
    min: 1.0
  - benchmark: accel_de
    format: accel_de__pyscx_wilcoxon_gpu
    dataset: tabula_sapiens_100k
    metric: wilcoxon_route_gpu_correct
    min: 1.0

  # GPU Wilcoxon CSC-direct route assertion, mirroring pdex_ref's
  # `de_route_csc_direct`. `accel_de.py` emits `wilcoxon_route_csc_direct`:
  # 1.0 when the CSC-direct v3 Wilcoxon route ran (or wasn't expected this
  # run), 0.0 on a *silent fallback* — a CSC sidecar fixture was built, yet the
  # CSR-direct route `gpu_csr_v3` ran. Dormant until a run builds a CSC fixture
  # (v3 is now the unconditional default — the SCX_GPU_DE_V3 gate was removed);
  # then a silent CSC→CSR fallback fails the gate. pbmc3k is the
  # single-shard route check;
  # tabula_sapiens_100k exercises the multi-shard CSC-direct path.
  - benchmark: accel_de
    format: accel_de__pyscx_wilcoxon_gpu
    dataset: pbmc3k
    metric: wilcoxon_route_csc_direct
    min: 1.0
  - benchmark: accel_de
    format: accel_de__pyscx_wilcoxon_gpu
    dataset: tabula_sapiens_100k
    metric: wilcoxon_route_csc_direct
    min: 1.0

  # GPU CSR device-residency gate (§9.11 / task 4.5). `accel_de.py` emits
  # `de_route_resident_csr` **only on a `gpu_csr*` route**: 1.0 when the CSR
  # route held the matrix device-resident across gene chunks, 0.0 when it
  # silently fell back to re-decoding every shard for every chunk — the
  # quadratic that made GPU DE 98.6 % host-decode-bound at census_500k.
  #
  # ALWAYS emitted on a GPU run: 1.0 means "held resident OR not applicable",
  # 0.0 means a CSR route silently lost residency. The CSC-direct route makes
  # no residency decision, so it reports the vacuous 1.0 — the same convention
  # `de_route_csc_direct` uses above.
  #
  # ⚠️ An earlier version emitted this ONLY on a `gpu_csr*` route, on the
  # premise that "`check_absolute_floors` skips a triple whose metric is
  # absent, so on a run that takes the CSC route these floors are simply
  # inert". **That premise was false.** `check_absolute_floors` skips a triple
  # whose RESULT is missing (`_triple_was_run`); a triple that ran and lacks
  # the metric is a violation — its docstring reads "missing, NaN, or violates
  # the configured threshold". And because `accel_de` always builds a CSC
  # sidecar, every GPU run takes `gpu_csc_v3`, so the metric was never emitted
  # and these two floors were structurally unsatisfiable: they could only fail,
  # or be silently scoped out on a run that did not schedule the triple. Phase
  # 7's gate ran pbmc3k + census_1m and never exposed it; the Phase 8b gate ran
  # tabula_sapiens_100k and failed on both (job 2850131) while the DE routes
  # were entirely correct (`de_route_csc_direct` = `wilcoxon_route_csc_direct`
  # = 1.0). Fixed in `accel_de.py` by always emitting.
  #
  # A 0.0 means one of: the VRAM pre-flight refused (the matrix outgrew
  # `SCX_GPU_DE_RESIDENT_MAX_FRAC` of free memory — real, and worth knowing
  # about at atlas scale), `SCX_GPU_DE_RESIDENT=0` leaked into the bench
  # environment, or a dispatch regression. All three should fail the gate.
  - benchmark: accel_de
    format: accel_de__pyscx_pdex_ref_gpu
    dataset: tabula_sapiens_100k
    metric: de_route_resident_csr
    min: 1.0
  - benchmark: accel_de
    format: accel_de__pyscx_wilcoxon_gpu
    dataset: tabula_sapiens_100k
    metric: de_route_resident_csr
    min: 1.0

  # ── GPU pseudobulk NB-GLM (accel_de_nb_glm, route gpu_nb_glm_csr) ──────────
  # Three deterministic hard floors on the GPU variant, gated on the synthetic
  # stratified fixture `nb_glm_synth` (the only dataset that exercises the
  # pdex_nb_glm replicate-stratifier path). The variant is skipped on non-GPU
  # hosts (returns None → no JSON), so `check_absolute_floors` treats it as a
  # scoped-out triple there; a present row always means GPU was attempted. The
  # GPU speedup is NODE-DEPENDENT (scales with the GPU node's CPU core count —
  # ~1.2x @12 cores vs ~2x @32 cores for identical code), so it is deliberately
  # surfaced-not-floored (tracked by the relative regression check + the report
  # NB-GLM section), NOT given an absolute floor here.
  #
  # 1. Route correctness — a cpu_nb_glm route on the GPU variant = silent
  #    GPU→CPU fallback (planner regression / device= not threaded through).
  - benchmark: accel_de_nb_glm
    format: accel_de_nb_glm__pyscx_gpu
    dataset: nb_glm_synth
    metric: nb_glm_route_gpu_correct
    min: 1.0
  # 2. CPU↔GPU numerical concordance (log2FC Spearman >= 0.999 AND max per-gene
  #    relative log2FC <= 2e-3). The 2e-3 bar is the precise-f64 agreement floor:
  #    nb_glm.cu is compiled WITHOUT --use_fast_math (precise div/sqrt, no
  #    flush-to-zero) precisely to protect the Cox-Reid dispersion math. DO NOT
  #    loosen this to paper over a fast-math / precision regression — a re-enabled
  #    --use_fast_math blows past 2e-3 and that is exactly the signal to catch.
  - benchmark: accel_de_nb_glm
    format: accel_de_nb_glm__pyscx_gpu
    dataset: nb_glm_synth
    metric: nb_glm_cpu_gpu_concordant
    min: 1.0
  # 3. Independent anchor — NB-GLM vs pdex_ref (a *different* algorithm) Spearman
  #    >= 0.95 on log2FC + FDR. The only non-self-referential correctness signal
  #    (pyDESeq2 OOMs in the comprehensive correctness reference, so CPU NB-GLM
  #    is otherwise its own reference). Catches a *shared* bug in the ported math
  #    that CPU↔GPU agreement alone cannot.
  - benchmark: accel_de_nb_glm
    format: accel_de_nb_glm__pyscx_gpu
    dataset: nb_glm_synth
    metric: nb_glm_pdex_ref_concordant
    min: 1.0

  # GPU perturbation-evaluation metric route gates. `accel_eval_metrics.py`
  # emits `<op>_route_gpu_correct` (1.0 when a `gpu_*` route ran, 0.0 on a
  # silent GPU→CPU fallback) for the two GPU-capable cell-eval effect metrics,
  # gated on the small synthetic paired fixture `pert_synth_10k`. The GPU
  # variant is skipped on non-GPU hosts (returns None → no JSON), so
  # `check_absolute_floors` treats it as a scoped-out triple there; a present
  # row always means GPU was attempted. A cpu_* route on the GPU variant means
  # device= didn't thread through / the planner regressed. CPU↔GPU concordance
  # and GPU speedup are surfaced-not-floored (node-dependent / covered by the
  # pyscx parity tests). `discrimination_score` GPU is deferred (see § "Deferred
  # floors"), so it has no live route floor.
  - benchmark: accel_eval_metrics
    format: accel_eval_metrics__pyscx_perturbation_metrics_gpu
    dataset: pert_synth_10k
    metric: perturbation_metrics_route_gpu_correct
    min: 1.0
  - benchmark: accel_eval_metrics
    format: accel_eval_metrics__pyscx_energy_distance_gpu
    dataset: pert_synth_10k
    metric: energy_distance_route_gpu_correct
    min: 1.0

  # CSC dispatch verification. `bench_csc_dispatch.py` emits
  # `csc_dispatch_correct` per run for ops that stamp a route: 1.0 when the
  # variant's intended layout actually dispatched (a `_csc` variant ran a route
  # containing "csc", a `_csr` variant did not), 0.0 on a silent fallback
  # (require_csc() dropped to CSR because the sidecar build failed, or vice
  # versa). All five ops (qc_metrics, hvg, rank_genes_groups, pdex_ref,
  # pseudobulk_dex) stamp a route, so every `_csc` variant is gated.
  #
  # Gated on tabula_sapiens_100k — its multi-shard CSC sidecar exercises the
  # column slab read that pbmc3k's single shard can't, and the 100k-cell
  # multi-shard backed-open path (sharded obs/var categorical assembly).
  - benchmark: bench_csc_dispatch
    format: bench_csc__qc_metrics_csc
    dataset: tabula_sapiens_100k
    metric: csc_dispatch_correct
    min: 1.0
  - benchmark: bench_csc_dispatch
    format: bench_csc__hvg_csc
    dataset: tabula_sapiens_100k
    metric: csc_dispatch_correct
    min: 1.0
  - benchmark: bench_csc_dispatch
    format: bench_csc__de_csc
    dataset: tabula_sapiens_100k
    metric: csc_dispatch_correct
    min: 1.0
  - benchmark: bench_csc_dispatch
    format: bench_csc__pdex_ref_csc
    dataset: tabula_sapiens_100k
    metric: csc_dispatch_correct
    min: 1.0
  - benchmark: bench_csc_dispatch
    format: bench_csc__pseudobulk_csc
    dataset: tabula_sapiens_100k
    metric: csc_dispatch_correct
    min: 1.0

  # Cloud push/pull throughput — migrated from the retired
  # ``benchmark_cloud.py`` hardcoded ``_median(throughputs) > 50`` gate.
  # The 50 MB/s floor is a "network path is healthy" check, not a
  # performance target; a value below this indicates misconfiguration or
  # a provider-side regression, not a tuning opportunity.
  #
  # Keyed on ``tabula_sapiens_100k`` rather than pbmc3k because the 4 MB
  # pbmc3k file is too small for per-request overhead to amortize —
  # measured at ~12 MB/s push / ~0.7 MB/s pull there, well below the
  # bandwidth regime. On tabula_sapiens_100k (428 MB file) the same
  # hardware hits ~115 MB/s push / ~180 MB/s pull, comfortably above the
  # 50 MB/s floor with ~2× headroom for network-noise tolerance.
  - benchmark: cloud_push
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: throughput_mbps
    min: 50.0
  - benchmark: cloud_pull
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: throughput_mbps
    min: 50.0

  # --- cloud_read correctness ----------------------------------------
  # Hard parity gate: the cloud-pulled SCX matrix must equal the local
  # source SCX. Catches silent corruption in the cloud-fixture pipeline
  # (BLAKE3 sidecar drift, exploded-shard layout regression on push or
  # pull). cloud_read previously measured wall-time + RSS only — a
  # post-pull layout corruption would have surfaced as a timing
  # anomaly, not a hard failure.
  #
  # The verification pass in cloud_read.py runs once per (dataset,
  # format, cloud_url) — outside the timed loop — and broadcasts its
  # result into every run's extra so the gate's median-across-runs
  # collapses cleanly to the underlying 0/1 value.
  #
  # On census-tier datasets (n_obs > 1M) the full `csr_equal` path is
  # skipped to avoid double-materialising at 40+ GB RSS; the helper
  # falls back to row-sum equality and exposes
  # `csr_equal_rowsum_int` instead of `csr_equal_int`. Floors below
  # gate the aggregate (`correctness_n_failed <= 0`) which folds in
  # whichever variant ran.
  - benchmark: cloud_read
    format: scx_auto
    dataset: pbmc3k
    metric: correctness_passed_int
    min: 1
  - benchmark: cloud_read
    format: scx_auto
    dataset: pbmc3k
    metric: correctness_n_failed
    max: 0
  - benchmark: cloud_read
    format: scx_auto
    dataset: pbmc3k
    metric: shape_match_int
    min: 1
  - benchmark: cloud_read
    format: scx_auto
    dataset: pbmc3k
    metric: nnz_match_int
    min: 1
  - benchmark: cloud_read
    format: scx_auto
    dataset: pbmc3k
    metric: obs_var_dims_match_int
    min: 1
  - benchmark: cloud_read
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: correctness_passed_int
    min: 1
  - benchmark: cloud_read
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: correctness_n_failed
    max: 0
  # --- doublet_interop: the plumbing tier ------------------------------
  #
  # `doublet_interop.py` runs external doublet callers, imports their results
  # through `pyscx.doublet_import`, then reads the canonical obs columns back
  # and compares them with each tool's own output **joined by key**. These
  # three floors gate that round trip, and only that: they are deterministic
  # (an exact value comparison and two counts), so they can be set from first
  # principles rather than calibrated.
  #
  # `roundtrip_call_disagreements` is the load-bearing one. A *positional*
  # import — the failure mode this whole interop exists to prevent — passes
  # every row-count and column-presence check and shows up here and nowhere
  # else, as every call landing on the wrong cell. `import_matched_frac` at
  # 1.0 catches the opposite failure: a join that silently matched nothing.
  #
  # `check_absolute_floors` skips a triple whose metric is absent, so these are
  # no-ops on a run where no tool env was available (the metrics are only
  # emitted when at least one tool actually ran).
  #
  # The SCIENCE tier — AUROC against injected truth, pairwise kappa, score-rank
  # Spearman — is floored separately below, and only after a capture showed
  # repeat runs are bit-identical. Those are distributional, so a guessed bound
  # would either fire on noise or pass anything; the values there are
  # calibrated from observed numbers with a margin. What remains deferred is
  # listed in the "Deferred floors" note at the end of this file.
  - benchmark: doublet_interop
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: roundtrip_call_disagreements
    max: 0
  - benchmark: doublet_interop
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: roundtrip_max_score_delta
    max: 1.0e-5
  - benchmark: doublet_interop
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: import_matched_frac
    min: 1.0
  - benchmark: doublet_interop
    format: scx_auto
    dataset: pbmc3k
    metric: roundtrip_call_disagreements
    max: 0
  - benchmark: doublet_interop
    format: scx_auto
    dataset: pbmc3k
    metric: roundtrip_max_score_delta
    max: 1.0e-5
  - benchmark: doublet_interop
    format: scx_auto
    dataset: pbmc3k
    metric: import_matched_frac
    min: 1.0

  # --- doublet_interop: the science tier -------------------------------
  #
  # Calibrated 2026-08-03 from the first captures, after confirming the run is
  # **bit-identical across two invocations** (all 19 emitted metrics) — the
  # injection seed, the tool seeds and scDblFinder's `set.seed` carry all the
  # way through, so these are not noisy quantities and a floor is meaningful.
  #
  # Observed / floor:
  #   pbmc3k              scdblfinder AUROC 0.979 / 0.90   scrublet 0.785 / 0.70
  #   tabula_sapiens_100k scdblfinder AUROC 0.912 / 0.85   scrublet 0.841 / 0.75
  #   kappa               0.482 / 0.459  ->  0.35 both
  #   score Spearman      0.280 / 0.369  ->  0.20 both
  #
  # The margins are deliberately wide (~0.05-0.09). These floors exist as a
  # REGRESSION TRIPWIRE — if a change to the import path silently corrupted
  # scores, AUROC would collapse and this catches it. They are NOT an accuracy
  # claim about the tools: the truth is computational injection
  # (DOUBLET-DETECTION.md Category D), so the absolute numbers are a property
  # of summed count vectors as much as of the caller. A scDblFinder or Scrublet
  # version bump may legitimately move these; re-calibrate rather than assume a
  # regression.
  #
  # Raw agreement is floored nowhere on purpose. It reads 0.953 / 0.966 here,
  # which sounds excellent and means little: at a ~7% doublet rate two tools
  # that both call almost nothing agree ~95% by construction. Kappa on the same
  # comparison is 0.48 / 0.46, and that is the number worth gating.
  - benchmark: doublet_interop
    format: scx_auto
    dataset: pbmc3k
    metric: scdblfinder_auroc
    min: 0.90
  - benchmark: doublet_interop
    format: scx_auto
    dataset: pbmc3k
    metric: scrublet_auroc
    min: 0.70
  - benchmark: doublet_interop
    format: scx_auto
    dataset: pbmc3k
    metric: agreement_kappa__scdblfinder__scrublet
    min: 0.35
  - benchmark: doublet_interop
    format: scx_auto
    dataset: pbmc3k
    metric: score_spearman__scdblfinder__scrublet
    min: 0.20
  - benchmark: doublet_interop
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: scdblfinder_auroc
    min: 0.85
  - benchmark: doublet_interop
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: scrublet_auroc
    min: 0.75
  - benchmark: doublet_interop
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: agreement_kappa__scdblfinder__scrublet
    min: 0.35
  - benchmark: doublet_interop
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: score_spearman__scdblfinder__scrublet
    min: 0.20

  - benchmark: cloud_read
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: shape_match_int
    min: 1
  - benchmark: cloud_read
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: nnz_match_int
    min: 1
  - benchmark: cloud_read
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: obs_var_dims_match_int
    min: 1
  # census_10m runs the row-sum fallback (n_obs > 1M); the per-check
  # floors below gate that variant via `correctness_n_failed`. No
  # explicit `csr_equal_int` floor here — would be `missing → fail`
  # because the helper emits `csr_equal_rowsum_int` instead.
  - benchmark: cloud_read
    format: scx_auto
    dataset: census_10m
    metric: correctness_passed_int
    min: 1
  - benchmark: cloud_read
    format: scx_auto
    dataset: census_10m
    metric: correctness_n_failed
    max: 0
  - benchmark: cloud_read
    format: scx_auto
    dataset: census_10m
    metric: shape_match_int
    min: 1
  - benchmark: cloud_read
    format: scx_auto
    dataset: census_10m
    metric: nnz_match_int
    min: 1
  - benchmark: cloud_read
    format: scx_auto
    dataset: census_10m
    metric: obs_var_dims_match_int
    min: 1

  # ─── Accelerator thresholds ─────────────────────────────────────────
  #
  # Gate the `pyscx.accel.*` surface routed through the comprehensive
  # framework. Floors are tight for CORRECTNESS (cosine sim, ARI,
  # Jaccard) and loose for TIMING (we only gate "not catastrophically
  # regressed"). Correctness is measured against scanpy / leidenalg
  # references inside each `accel_*.py` module and stored in the run's
  # `extra` dict — see the module docstrings for metric keys.

  # --- accel_pca: correctness vs scanpy ---
  - benchmark: accel_pca
    format: accel_pca__pyscx_cpu_auto
    dataset: pbmc3k
    metric: cosine_sim_min
    min: 0.99
  # Randomized PCA's per-PC cosine is unreliable by construction — the
  # randomized subspace iteration agrees with scanpy's subspace but
  # returns axes rotated/permuted vs the deterministic reference. The
  # covariance-path floor above (0.99 min) already catches real PCA
  # correctness regressions; these floors on the randomized variants
  # serve as sanity checks (are we producing non-trivial embeddings at
  # all) rather than strict numerical agreement. Observed across the
  # post-findings Tier-3 run: pbmc3k ~0.42, tabula_sapiens_100k ~0.79,
  # census_1m ~0.83 — floors sit ~0.05 below observed to catch a true
  # collapse (e.g., all-zero embedding) without tripping on normal
  # subspace rotation.
  #
  # The strict correctness gate for the randomized variants lives on
  # `subspace_cos_min` below — that metric (the smallest principal-angle
  # cosine between candidate and reference subspaces) is invariant to
  # the basis rotation/permutation/sign that defeats per-PC cosine.
  # Both metrics are kept: cosine_sim_mean for backward continuity with
  # promoted baselines, subspace_cos_min for the real correctness
  # contract.
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_hh
    dataset: pbmc3k
    metric: cosine_sim_mean
    min: 0.35
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_chol
    dataset: pbmc3k
    metric: cosine_sim_mean
    min: 0.35
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_hh
    dataset: tabula_sapiens_100k
    metric: cosine_sim_mean
    min: 0.70
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_chol
    dataset: tabula_sapiens_100k
    metric: cosine_sim_mean
    min: 0.70
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_hh
    dataset: census_1m
    metric: cosine_sim_mean
    min: 0.75
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_chol
    dataset: census_1m
    metric: cosine_sim_mean
    min: 0.75
  # --- accel_pca: rotation-invariant subspace floors ---
  # ``subspace_cos_min`` is the smallest principal-angle cosine between
  # the candidate and scanpy reference column-spans. By construction:
  #   * 1.0 iff the two k-dim subspaces coincide (any basis rotation,
  #     column permutation, or column-sign flip)
  #   * < 1.0 iff a component direction is genuinely missing or rotated
  #     out of plane — the failure mode that per-PC cosine cannot detect
  #
  # 2026-05-20: randomized variants now use a **layered** gate:
  #   * `subspace_cos_mean ≥ 0.70/0.85` — main correctness floor.
  #   * `subspace_cos_min  ≥ 0.01/0.02` — loose orthogonal-component guard.
  # Empirical calibration (pbmc3k + tabula_sapiens_100k + census_1m on
  # cuda-version=12.6 / libcusparse=12.5.4.2):
  #   randomized PCA at default params (n_oversamples=10, n_power_iterations=2)
  #   at n_comps=50 produces well-resolved top PCs (top-10 cos ≥ 0.99)
  #   but degrades at the tail of the spectrum — pbmc3k PC50 cos ≈ 0.05.
  #   This is textbook randomized-SVD behavior, not a code regression;
  #   CPU randomized produces the same tail-PC drift on the same fixtures.
  # `subspace_cos_mean` is the main correctness signal: a broken
  # implementation (e.g. buggy SpMM or QR) collapses it toward 0; a
  # correct one holds mean ≳ 0.8 at small n_obs and ≳ 0.92 at large n_obs.
  # Mean floors sit ~0.05 below the calibrated value so noise doesn't trip.
  # The mean alone is insensitive to a *single* PC going orthogonal
  # (cos_mean stays at (k-1)/k ≈ 0.98 for k=50), which is the failure mode
  # `test_subspace_regression_drops_min_cosine` documents. To preserve
  # that coverage we keep a loose `subspace_cos_min` floor — set well
  # under the empirical tail (pbmc3k 0.032, tabula 0.041, census_1m
  # 0.185) so randomized-SVD tail drift passes, but a true component-loss
  # regression (cos_min → 0) still fails.
  # (The in-VRAM covariance PCA path and its strict subspace_cos_min ≥ 0.95
  # floors were removed in ACC-RUST-OPT-V4 Phase 3.2 — in-VRAM PCA routes to
  # rapids-singlecell, whose subspace correctness is gated below.)
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_hh
    dataset: pbmc3k
    metric: subspace_cos_mean
    min: 0.70
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_hh
    dataset: pbmc3k
    metric: subspace_cos_min
    min: 0.01
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_chol
    dataset: pbmc3k
    metric: subspace_cos_mean
    min: 0.70
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_chol
    dataset: pbmc3k
    metric: subspace_cos_min
    min: 0.01
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_hh
    dataset: tabula_sapiens_100k
    metric: subspace_cos_mean
    min: 0.85
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_hh
    dataset: tabula_sapiens_100k
    metric: subspace_cos_min
    min: 0.01
  - benchmark: accel_pca
