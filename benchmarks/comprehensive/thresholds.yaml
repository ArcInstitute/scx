# ---------------------------------------------------------------------------
# Deferred floors — known gaps tracked here so operators can see what's
# missing and why. Add entries above this block once the blockers below
# resolve; do NOT add them under `absolute_floors` until then, as the
# gate would synthesise "missing metric" violations on every run.
# ---------------------------------------------------------------------------
#
# 1. ml_loader / slaf throughput + TTFB floors
#    Blocker: slafpy lives in a separate `scx-bench-slaf` conda env;
#    the orchestrator activates exactly one env per gate run, so a
#    single-env capture never produces slaf rows in the same snapshot
#    as the rest. A floor here would synthesise a "missing metric"
#    violation on every run from `scx-bench`. Revisit once the
#    orchestrator supports per-runner env activation (or once slafpy
#    is reachable from `scx-bench` without a transitive breakage).
#
# 2. accel_gpu_train / avg_gpu_util_pct__gpu_train floors
#    Blocker: the current sampler runs `nvidia-smi dmon` at 1 Hz, which
#    misses sub-second epoch boundaries on small fixtures (pbmc10k:
#    ~30–60 ms per batch). The reported avg_util_pct under-counts the
#    real utilisation by 20–50%, depending on epoch geometry. A floor
#    on the under-counted value would either tolerate genuine
#    underutilisation (set high) or false-positive on healthy runs
#    (set low). Need an in-process CUDA event sampler that ticks at
#    >= the kernel launch rate before a floor is safe.
#
# 3. cell_eval_parity_perf / census_1m floors
#    Blocker: the cell-eval reference's energy_distance variants are
#    O(N²) in n_obs and infeasible at >= 500K cells (would take days
#    on the reference path even though SCX completes in minutes). The
#    parity benchmark skips these variants at `n_obs >= 500K` —
#    floors there would surface as missing-metric violations. Revisit
#    if cell-eval upstream lands a streaming energy_distance, or if
#    we accept "no reference comparison at census scale" and gate
#    only on the SCX side wall-time / RSS (a different metric than
#    cell_eval_parity_perf measures today).
#
# 4. nb_glm_route_csc_direct (GPU NB-GLM device-resident aggregation, Stage C)
#    The Stage-A/B GPU pseudobulk NB-GLM floors (nb_glm_route_gpu_correct,
#    nb_glm_cpu_gpu_concordant, nb_glm_pdex_ref_concordant) are now ACTIVE
#    `absolute_floors` rows above, gated on the `nb_glm_synth` stratified
#    fixture via the `accel_de_nb_glm` bench module. What remains deferred is
#    the Stage-C device-resident aggregation route `gpu_nb_glm_csc` (CSC/CSR
#    sum kernels feeding the fitter with no host round-trip — the path to ≥3x).
#    When it lands, add a `nb_glm_route_csc_direct` floor (mirroring
#    `de_route_csc_direct`) on `accel_de_nb_glm__pyscx_gpu` + an
#    aggregation-phase perf signal. The `gpu_nb_glm_csc` route string is
#    reserved but never emitted today.
#
# 5. ml_loader batches_per_sec floors for the adaptive `scx_auto` (post-flip) —
#    PARTIALLY ACTIVE + PROVISIONAL. After the auto→adaptive flip (2026-07-12),
#    `scx_auto` is cost-aware adaptive and `scx_fast` is the decode-max heuristic
#    (the pre-flip `auto`). The `scx_fast` throughput floors and the `scx_auto`
#    compression floors are transplanted from the pre-flip numbers (see the
#    ml_loader + compression blocks). The adaptive `scx_auto` throughput floor is
#    ACTIVE only for `pbmc10k` (reused from the old `auto_v2` capture — a
#    conservative lower bound). DEFERRED to the P4.3 recapture: adaptive
#    `scx_auto` throughput floors for `pbmc3k` / `tabula_sapiens_100k` / census,
#    and tightening every PROVISIONAL floor to the captured adaptive medians
#    (min = 0.85× the measured min run). The recapture must also add the looser
#    raw-path (G1b) floor documented in docs/performance.md.
#
# 6. discrimination_route_gpu_correct (GPU discrimination_score)
#    The GPU eval-metric route floors (perturbation_metrics_route_gpu_correct,
#    energy_distance_route_gpu_correct) are now ACTIVE `absolute_floors` rows
#    above, gated on `pert_synth_10k` via the `accel_eval_metrics` bench module.
#    `discrimination_score` GPU stays DEFERRED: it needs exact-rank parity
#    (`rank = count(d < correct_dist)`) that an f32 cuBLAS gemm can't guarantee
#    (f32 rounding can flip near-tie ranks), and it is already fast on the small
#    `[P×G]` effect matrix — low ROI. When a GPU kernel lands (exact-rank-safe),
#    add a `discrimination_route_gpu_correct` floor mirroring the two above, plus
#    an `accel_eval_metrics__pyscx_discrimination_score_gpu` variant. The
#    `discrimination_score` op stamps only `cpu_*` routes today.
#
# 7. Data-load Phase 0 signals: ooc_loader / cellset_gather / obs_open
#    NOW ACTIVE — 33 cold-cache floors, all live under `absolute_floors` above:
#    24 captured 2026-07-23 (baseline v0.11.5-dataload-phase0; ooc_loader SCX +
#    4 competitors, cellset_gather SCX, obs_open SCX + h5ad_none) plus 9 from the
#    2026-07-30 second wave (S=512 gather x 3 datasets x 2 plan types, and the
#    3 rank-scaling-efficiency floors). What remains DEFERRED:
#      * cellset_gather / census_5m: the scattered 5M-row gather read cold
#        exceeds the SLURM wall limit on the pre-optimization raw-local path
#        (that slowness is the Phase-1 target). Re-enable a floor once the
#        in-Rust gather assembly lands and the epoch fits the budget.
#      * cellset_gather scattered-READ-ROUTE floors: the route the cell-set
#        gather takes is now emitted into runs[].extra per scenario, precisely
#        so it can be floored — the shape `accel_de`'s `de_route_csc_direct`
#        uses above, which turns a silent dispatch flip into a hard failure.
#        Deferred because it cannot discriminate anything yet: all three floored
#        fixtures (tabula_sapiens_100k / census_500k / census_1m `_auto.scx`)
#        are `format_version = 3`, i.e. UNFRAMED, and `block_index_eligible`
#        requires `shard_is_framed` — so the full-shard route is forced by the
#        fixture, not chosen by the code, and a floor would read as coverage
#        while providing none. That is exactly the failure this block exists to
#        prevent.
#
#        ACTIVATION, precisely (this is not a "move two rows up" — the rows
#        below do not exist as YAML, they have to be authored):
#          1. Regenerate the fixtures at v4 via
#             `benchmarks/scripts/reconvert_fixtures.py`, and CONFIRM with
#             `scx info <f> --json` that `format_version` is 4. Without that the
#             floors are still vacuous, just less obviously.
#          2. Confirm the route is actually reachable on the new fixtures by
#             reading `metadata.scatter_block_index_route.block_index_reachable`
#             from a capture — the benchmark writes it from a 1-batch untimed
#             probe. A `false` there is NOT by itself proof the reframe failed:
#             `block_index_eligible` also ANDs the process-global
#             `SCX_SCATTER_BLOCK_INDEX` switch and a row-range cost window.
#             Check `env_kill_switch_engaged` in the same metadata block first;
#             only once that is false does `block_index_reachable: false` point
#             back at step 1.
#          3. THEN add, under `absolute_floors` above, for each of the three
#             datasets at `format: scx_auto`:
#                 metric: full_shard_groups__gather_random   ->  min: 1.0
#                 metric: full_shard_groups__gather_grouped  ->  min: 1.0
#             i.e. "the shipped default must still warm whole shards". A flip
#             back to the block-index route drives these to 0 and fails.
#          4. Expect NO wall-clock or `median_wall_s` rebase from this: the
#             probe is untimed and never calls `add_run`, deliberately. Do not
#             reintroduce a timed both-routes arm here — those samples pool into
#             `BenchmarkResult.median_wall_s` / `peak_rss_mb_median`, which the
#             gate compares (the `cellset_gather_s512_raises_pooled_rss.md`
#             justification exists because exactly that happened once), and on
#             v4 fixtures the block-index arm runs ~180x slower, so a timed
#             50-batch arm would add minutes per cohort. Price the two routes in
#             `benchmarks/scripts/bench_cellset_scatter_routes.py` instead.
#      * obs_open / h5ad_none / {census_1m,census_5m}: the eager-obs baseline
#        wasn't run at census_1m/5m (Wave B was SCX-only to avoid the 60–80s
#        per-file anndata cost dominating the job). Add the h5ad_none obs floor
#        there when a competitor OOC wave is run, to quantify the Phase-1A win.
#      * obs_open manifest scenario (`*__open_manifest`, `*__open_manifest_r4`):
#        floor once the manifest fixture is a committed prep step in the tier
#        flow. Until then a floor would synthesise a "missing metric" violation
#        on every host that hasn't run `prep_manifest_fixture.py`. Measured
#        2026-07-30 for the record: SCX 6.13 ms/file vs h5ad 115.5 ms/file over
#        256 files (18.8x), and rank-scaling efficiency 1.78 at N=4 (SCX) vs
#        1.03 (h5ad) — the SCX figure is cache sharing, since every rank walks
#        the same files.
#      * obs_open `open_only` / `open_only_unverified`: deliberately NOT floored.
#        Both are sub-millisecond at tabula (0.09-0.10 ms) and the BLAKE3 verify
#        term derived from them measured *negative* (-3.8 ms) at census_1m —
#        i.e. below the run-to-run spread. A floor on a quantity smaller than its
#        own noise floor fails on noise, which trains operators to ignore the
#        gate. They stay as recorded diagnostics; the finding they support (obs
#        read is 96-99.8% of per-file cost, so the open side is not worth
#        optimizing) is in docs/performance.md.
#    BioNeMo-SCDL ooc_loader row stays DEFERRED (isolated NeMo/CUDA env not yet
#    added — see envs/scx-bench.yml note). Only AnnLoader + annbatch + scDataset
#    are wired for Phase 0.
#
# 8. Data-load Phase 1D: shuffle_layout (`scx sort --shuffle`)
#    DEFERRED, and the reason differs per arm — this is not one blocker.
#      * `x_size_ratio__<codec>` / `file_size_ratio__<codec>`: not floored
#        because the quantity is a *property of the data and codec*, not of the
#        implementation. `scx1` is size-neutral by construction (each row's gene
#        indices are coded independently of row order); `zstd` / `shufdelta`
#        move by whatever cross-row redundancy the corpus happened to carry, in
#        either direction. A floor would fire on a fixture refresh rather than
#        on a regression. The measured values live in docs/performance.md, which
#        is where a data-dependent number belongs.
#      * `samples_per_sec__train_{unshuffled,shuffled}`: single capture, and the
#        arm's purpose is a *neutrality* check (~1.00x) rather than a throughput
#        claim — the ratio must never gate, since the interesting direction is a
#        regression and `ooc_loader`'s `samples_per_sec__raw` floors already
#        cover TrainingDataset throughput on the same datasets. Revisit if a
#        second capture shows the absolute rate is stable enough to floor.
#      * `label_tv_block__after`: the honest candidate — a shuffle that stopped
#        mixing would show up here and nowhere else. Deferred only because one
#        capture cannot separate the sampling-noise floor (a function of shard
#        size and label cardinality) from a real regression. Floor it after a
#        second capture on the same fixtures.
#      * `cells_per_sec__shuffle_write`: rewrite throughput is
#        `compact`/`sort`-shaped and has no existing floor to sit beside;
#        deferred with the rest until there is more than one observation.
#
# 9. doublet_interop: what is still deferred
#    The plumbing AND science floors are both live above (calibrated
#    2026-08-03 against bit-identical repeat captures). What remains deferred:
#      * `<tool>_recall` / `<tool>_precision`: these move with the tool's own
#        threshold, which is a scientific choice each caller makes and revises
#        between versions — unlike AUROC, which is threshold-free and so
#        actually measures whether the scores still separate. Recall IS
#        recorded per doublet kind, and the stratification is where the signal
#        is: on tabula_sapiens_100k scDblFinder recalls 0.484 of heterotypic
#        but 0.188 of homotypic injections, and Scrublet 0.286 / 0.000. A
#        pooled recall floor would hide exactly that.
#      * `consensus_auroc`: 0.842 / 0.744, BELOW either tool alone. Not a bug —
#        "majority" of two voters is an AND, and the metric ranks by an integer
#        vote count (0/1/2) with massive ties. It is recorded because it is
#        worth knowing; flooring a number whose meaning depends on the tool
#        count would break the moment a third tool is added.
#      * `n_tools_ran`: cannot floor at 2 while Solo has no environment on this
#        cluster; a floor would turn a legitimate optional-tool skip into a
#        gate failure. The run records `tools_skipped` with a reason instead.
#
# 10. derived-file output size (compact / merge / subset / sort): no gate yet
#    The v0.12.0 dogfood found `scx compact` GROWING an 864 MiB file by 5.1%
#    while claiming to reclaim 562 MB of orphaned bytes, and `scx sort --by`
#    turning it into 1.7 GiB. Root cause: every derived-file op built a framing
#    config whose `decode_target` was `None` — precisely the `fast` profile — so
#    `auto` on a rewrite never re-adopted ShufDeltaZstd. Fixed, with per-shard
#    codec + byte-total assertions in `scx-ops/tests/codec_adaptive.rs`.
#
#    It reached a release because **nothing in this harness watches a derived
#    file's size**: `compression` and `multimodal_compression` are convert-path
#    only, and there is no `compact` / `merge` / `subset` benchmark at all. The
#    gate that belongs here — an `output_size_ratio_vs_input` ceiling near 1.02
#    on compact — is deferred because it needs a producing benchmark script
#    first; adding the threshold alone would be an inert entry that reads as
#    coverage. `scx-ops/tests/bench_ops.rs::compact_after_3_appends` already
#    emits `compact_vs_fresh`, but on a 20K-cell fixture too small to floor.
#    Recorded rather than left silent, per the no-silent-caps rule above.
#
#    Tracking, so this note is not the only record: the remaining ~1.30x on a
#    mixed-width file comes from `scx_ops::helpers::widest_value_encoding`
#    widening `mixed (uint16, uint32)` to a uniform `uint32` on any rewrite —
#    measured on census_500k and tabulated in `docs/sharding.md` § Output size
#    ("A rewrite still costs ~1.3x on a mixed-width file, for a different
#    reason"). It is a separate axis from the codec bug above: `sort --by` on an
#    ALREADY-sorted key costs the same 1.301x, so it is not reordering. Closing
#    it means preserving each shard's value encoding through
#    compact/merge/sort/subset, which is why it is not folded into the codec fix.
#
# 11. read_selective per-scenario wall thresholds: need a recapture
