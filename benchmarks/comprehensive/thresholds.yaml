  # Grouped-write RSS ceilings (gross-regression guards only).
  #
  # Two things about these were wrong until the peak-sampler change, and they
  # cancelled into something that read as coverage:
  #
  #   1. The metric was spelled `peak_rss_mb`, which is a **reserved**
  #      `add_run` parameter. It lands on the RunRecord and never in
  #      `runs[].extra`, and `_load_current_raw_metric` reads `extra` only —
  #      so the ceiling could not resolve a value on any run, ever. Verified
  #      against the tracked
  #      `results/raw/grouped_sort__scx_auto__chemogenetic_rgfp.json`: its runs
  #      carry `extra = {scenario, output_size_bytes}` and nothing else.
  #   2. That would normally be a loud missing-metric violation. It never fired
  #      because all three datasets sit outside every `capture_baseline.TIERS`
  #      list, so a default gate run never produces the triple and
  #      `check_absolute_floors` skips it silently.
  #
  # The metric is now `grouped_peak_rss_mb`, emitted in `extra` on every timed
  # run (a sparse `peak_rss_mb__<scenario>` is emitted alongside it for
  # diagnosis, not gated). `tests/test_floor_reachability.py` now rejects any
  # floor keyed to a reserved parameter name.
  #
  # The measurement also changed: it is a true in-region `PeakRssSampler` peak,
  # not `current_rss_mb()` sampled after the op. **The values below are
  # unchanged and deliberately so.** The A/B campaign already measured the true
  # peaks separately with `/usr/bin/time -v` — chemogenetic ~18.7 GB, replogle
