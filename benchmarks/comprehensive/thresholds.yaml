  # ─── OPT-FORMATIO-1 row-group LRU: the cache works where it can ──────
  # `read_scattered` records `row_group_hit_rate` = hits / (hits + misses) of
  # the row-group lookups a framed gather makes. On pbmc3k the whole file's
  # groups (11 at G=256, 6 at G=512) fit the loader's budget, so after the
  # 3-batch warm-up every batch is served from the LRU: measured 0.990 on
  # both G, same-build A/B job 2930348 at f5a9a171. A regression that stops
  # retaining groups (or breaks the `(file_id, shard, group)` key) drives this
  # to 0 → gate failure. NOT floored on smartseq2 / tabula_sapiens_100k: there
  # the benchmark's auto-tuned two-shard budget is under one batch's groups,
  # so the per-gather admission rule bypasses the LRU by design and the rate
  # is 0 — a floor would assert the wrong contract. Same `--formats` caveat as
  # every floor in this block: the triple only runs when explicitly selected.
  - benchmark: read_scattered
