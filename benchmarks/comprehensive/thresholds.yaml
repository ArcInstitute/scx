  # floors turn a silent regression in rscx's dispatch or stamping into a
  # gate failure (rscx has no CI lane, so this local gate is its only
  # automated signal). `accel_r_route.py` shells `scripts/r_route_probe.R`
  # into the rscx conda env on synthetic matrices — routing facts are
  # dataset-independent, so pbmc3k is a scheduling slot, not an input. All
