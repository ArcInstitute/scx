  # --- accel_harmony: mean per-PC Pearson r vs harmonypy ---
  # Phase 7e, ORG-7.21-4. Harmony had no thresholds entry at all before this.
  #
  # This is NOT a numerical-parity floor and cannot be one: SCX seeds k-means++
  # from `rand_chacha` where harmonypy uses `sklearn.KMeans`, so the two runs
  # start from different cluster geometry, and the objective cross-entropies
  # differ by a `log(2)` term (pinned as a divergence in
  # `scx-accel/src/harmony/harmony_reference_values.rs`, which gates the exact
  # numerics Rust-side under plain `cargo test`). This is the end-to-end sanity
  # net at the resolution a stochastic init allows.
  #
  # Set from the MEASURED first gate run (job 2840853), not from the
  # `0.989-0.999` figure `docs/performance.md` used to report against R harmony:
  # that number pre-dates the Phase 7e M-step and was measured on gitignored
  # fixtures nobody can rerun.
  #
  # ⚠️ The first version of this comment said these were measured "with a fixed
  # `random_state` on both sides". THAT WAS FALSE: the benchmark passed
  # `random_state=42` to pyscx and let harmonypy take its own default of 0, and
  # `epsilon_harmony` / `epsilon_kmeans` were unmatched too (1e-2/1e-3 vs
  # 1e-4/1e-5). Found in review by codex and Cursor Agent, independently. The
  # arms are now pinned to one seed, one cluster count and one pair of
  # tolerances, and these numbers are re-measured on THAT configuration —
  # the earlier ones described a comparison that no longer exists.
  #
  # ⚠️ A SECOND correction. The re-measurement these floors were waiting on was
  # itself measured wrong, twice over, and both were found in review:
  #
  #   * `lamb` was never aligned. Both calls omitted it, and the omissions mean
  #     OPPOSITE things — pyscx's `None` is dynamic `alpha*E[k,b]`, harmonypy's
  #     is a fixed lambda of 1. harmonypy spells dynamic `lamb=-1`.
  #   * The measuring job built its PCA over ALL genes, while the gate's
  #     `load_preprocessed` subsets to 2000 seurat_v3 HVGs first. A 50-PC
  #     embedding of 32k genes is not the 50-PC embedding of 2k HVGs.
  #
  # Those two together moved census_1m from 0.9697 to 0.9987 — the earlier
  # number was not a slightly-off measurement, it was of something else.
  #
  # FINAL, job 2843742, gate preprocessing + all four parameters aligned:
  #
  #     dataset    n_vars  K    harmonypy   pyscx_cpu   pyscx_gpu
  #     pbmc3k     2000    90   1.0 (self)  0.9996      0.9996
  #     census_1m  2000    100  1.0 (self)  0.9987      0.9987
  #
  # Both floors are 0.99. Sizing, since the number that matters is not the
  # measurement but the slack: run-to-run spread is EXACTLY zero (both
  # implementations are deterministic given the seed), so there is no sampling
  # noise to absorb and the bar is sized purely for cross-ENVIRONMENT drift.
  # The only cross-machine figure available is pbmc3k, which measured 0.9991 on
  # a login node and 0.9996 on the GPU node — 5e-04. A 0.99 floor is ~19x that
  # on pbmc3k and ~17x on census_1m.
  #
  # census_1m is the harder fixture (618 real donors via `donor_id` vs 3
  # synthetic batches) and is the arm to watch, but it is NOT the looser one:
  # once measured correctly the two datasets agree to 1e-03.
  - benchmark: accel_harmony
    format: accel_harmony__pyscx_cpu
    dataset: pbmc3k
    metric: mean_per_pc_r_vs_harmonypy
    min: 0.99
  - benchmark: accel_harmony
    format: accel_harmony__pyscx_gpu
    dataset: pbmc3k
    metric: mean_per_pc_r_vs_harmonypy
    min: 0.99
  - benchmark: accel_harmony
    format: accel_harmony__pyscx_cpu
    dataset: census_1m
    metric: mean_per_pc_r_vs_harmonypy
    min: 0.99
  - benchmark: accel_harmony
    format: accel_harmony__pyscx_gpu
    dataset: census_1m
