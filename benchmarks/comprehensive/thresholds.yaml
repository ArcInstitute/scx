  # --- cell_eval_parity_perf marquee floors --------------------------
  # AGENTS.md headline claims:
  #   - energy_distance(backend="gemm", dtype="f32"): 52x at 20K x 2K x 50 perts
  #   - clustering_agreement: 12.83x at 200 perts
  #
  # Floors are calibrated below observed baseline medians (0.6x for min,
  # 2.0x for max), NOT against the marquee claims directly — this
  # protects against a same-axis cell-eval slowdown faking a "free win"
  # while still catching real SCX regressions.
  #
  # Per-op keys are emitted sparsely (only for non-skipped operations);
  # the gate's median-over-non-None values picks them up cleanly.
  #
  # Coverage scope:
  #   - pert_synth_10k and pert_synth_100k are both gated. census_1m and
  #     larger remain excluded: _SKIP_RULES in cell_eval_parity_perf.py
  #     skips energy_distance variants at n_obs >= 500K, and routine
  #     gating at census scale needs a separate budget tier.
  #   - speedup__clustering_agreement is NOT gated — at 50 perts (the
  #     pert_synth_* config) SCX is ~0.8x of cell-eval. The 12.83x claim
  #     lives at 200 perts (a config we don't ship yet). The
  #     scx_median_s__clustering_agreement floor still catches SCX-side
  #     regressions on the clustering path independent of cell-eval.
  - benchmark: cell_eval_parity_perf
    format: scx_auto
    dataset: pert_synth_10k
    metric: speedup__energy_distance_blas_f32
    min: 11.0
  - benchmark: cell_eval_parity_perf
    format: scx_auto
    dataset: pert_synth_10k
    metric: scx_median_s__energy_distance_blas_f32
    max: 1.4
  - benchmark: cell_eval_parity_perf
