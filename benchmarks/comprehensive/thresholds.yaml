# Absolute-floor regression thresholds.
#
# Consumed by ``compare_against_baseline.py --gate --thresholds <this-file>``.
# For each entry, the gate reads the named metric out of every run's
# ``extra`` dict in ``<current_run>/raw/<benchmark>__<format>__<dataset>.json``,
# takes the median across runs, and fails when the median violates the
# declared bound (or the metric is missing entirely).
#
# These floors are absolute — they don't depend on the baseline snapshot,
# and they survive baseline promotion. Use them for hard contracts: "a
# cloud push at or below 50 MB/s is a support incident regardless of the
# prior snapshot's numbers." Relative-tolerance checks (the default diff)
# remain the primary gate.
#
# Schema:
#   absolute_floors:
#     - benchmark: <benchmark name>   # matches the benchmark's result 'benchmark' field
#       format:    <format key>       # e.g. scx_auto
#       dataset:   <dataset name>
#       metric:    <field name in runs[].extra>
#       min:       <float>            # observed must be >= min (higher-is-better)
#       # --- OR ---
#       max:       <float>            # observed must be <= max (lower-is-better, e.g. wall_s)
#       # direction is inferred from min/max; set explicitly only to disambiguate.

absolute_floors:
  # Cloud push/pull throughput — migrated from the retired
  # ``benchmark_cloud.py`` hardcoded ``_median(throughputs) > 50`` gate.
  # The 50 MB/s floor is a "network path is healthy" check, not a
  # performance target; a value below this indicates misconfiguration or
  # a provider-side regression, not a tuning opportunity.
  #
  # Keyed on ``tabula_sapiens_100k`` rather than pbmc3k because the 4 MB
  # pbmc3k file is too small for per-request overhead to amortize —
  # measured at ~12 MB/s push / ~0.7 MB/s pull there, well below the
  # bandwidth regime. On tabula_sapiens_100k (428 MB file) the same
  # hardware hits ~115 MB/s push / ~180 MB/s pull, comfortably above the
  # 50 MB/s floor with ~2× headroom for network-noise tolerance.
  - benchmark: cloud_push
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: throughput_mbps
    min: 50.0
  - benchmark: cloud_pull
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: throughput_mbps
    min: 50.0

  # ─── Phase 9 accelerator thresholds ──────────────────────────────────
  #
  # Gate the `pyscx.accel.*` surface migrated into the comprehensive
  # framework (Phase 9 of GPU-ACC-SPEED-UP.md). Supersedes (once
  # Phase-8 stopgap deprecated) the hard-floor table in
  # `benchmarks/scripts/gpu_regression_diff.py::apply_hard_floors`.
  # Floors are tight for CORRECTNESS (cosine sim, ARI, Jaccard) and
  # loose for TIMING (we only gate "not catastrophically regressed").
  # Correctness is measured against scanpy / leidenalg references
  # inside each `accel_*.py` module and stored in the run's `extra`
  # dict — see the module docstrings for metric keys.

  # --- accel_pca: correctness vs scanpy ---
  - benchmark: accel_pca
    format: accel_pca__pyscx_cpu_auto
    dataset: pbmc3k
    metric: cosine_sim_min
    min: 0.99
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_cov
    dataset: pbmc3k
    metric: cosine_sim_min
    min: 0.99
  # Randomized PCA's per-PC cosine is unreliable by construction — the
  # randomized subspace iteration agrees with scanpy's subspace but
  # returns axes rotated/permuted vs the deterministic reference. The
  # covariance-path floor above (0.99 min) already catches real PCA
  # correctness regressions; these floors on the randomized variants
  # serve as sanity checks (are we producing non-trivial embeddings at
  # all) rather than strict numerical agreement. Observed across the
  # post-findings Tier-3 run: pbmc3k ~0.42, tabula_sapiens_100k ~0.79,
  # census_1m ~0.83 — floors sit ~0.05 below observed to catch a true
  # collapse (e.g., all-zero embedding) without tripping on normal
  # subspace rotation.
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_hh
    dataset: pbmc3k
    metric: cosine_sim_mean
    min: 0.35
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_chol
    dataset: pbmc3k
    metric: cosine_sim_mean
    min: 0.35
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_hh
    dataset: tabula_sapiens_100k
    metric: cosine_sim_mean
    min: 0.70
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_chol
    dataset: tabula_sapiens_100k
    metric: cosine_sim_mean
    min: 0.70
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_hh
    dataset: census_1m
    metric: cosine_sim_mean
    min: 0.75
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_rand_chol
    dataset: census_1m
    metric: cosine_sim_mean
    min: 0.75
  # Covariance path at census_1m — f32 GPU vs f64 CPU tail-PC drift is real
  # but bounded; observed 0.9999+. Keep 0.90 floor for safety headroom.
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_cov
    dataset: census_1m
    metric: cosine_sim_min
    min: 0.90

  # --- accel_knn: recall vs scanpy ---
  - benchmark: accel_knn
    format: accel_knn__pyscx_gpu_cagra
    dataset: pbmc3k
    metric: recall_vs_scanpy
    min: 0.90
  - benchmark: accel_knn
    format: accel_knn__pyscx_gpu_cagra
    dataset: tabula_sapiens_100k
    metric: recall_vs_scanpy
    min: 0.90

  # --- accel_umap: trustworthiness ---
  - benchmark: accel_umap
    format: accel_umap__pyscx_gpu
    dataset: pbmc3k
    metric: trustworthiness
    min: 0.90
  - benchmark: accel_umap
    format: accel_umap__pyscx_gpu
    dataset: tabula_sapiens_100k
    metric: trustworthiness
    min: 0.90

  # --- accel_leiden: ARI vs leidenalg ---
  # First comprehensive run on pbmc3k produced ARI=0.893 for pyscx_cpu,
  # 0.895 for pyscx_gpu — consistent with AGENTS.md's "ARI 0.92 vs
  # leidenalg" target at larger scale, with small-dataset noise pulling
  # pbmc3k down. Floor set at 0.85 to accommodate that variance.
  - benchmark: accel_leiden
    format: accel_leiden__pyscx_gpu
    dataset: pbmc3k
    metric: ari_vs_leidenalg
    min: 0.85
  - benchmark: accel_leiden
    format: accel_leiden__pyscx_cpu
    dataset: pbmc3k
    metric: ari_vs_leidenalg
    min: 0.85

  # --- accel_preprocess: numerical equivalence to scanpy ---
  # GPU f32 vs CPU f64 intermediate drift on normalize+log1p is ~1e-5
  # on typical counts; 1e-3 provides ~2 orders of magnitude headroom.
  - benchmark: accel_preprocess
    format: accel_preprocess__pyscx_gpu
    dataset: pbmc3k
    metric: max_abs_diff_vs_scanpy
    max: 1.0e-3

  # --- accel_hvg: HVG set overlap vs scanpy seurat_v3 ---
  - benchmark: accel_hvg
    format: accel_hvg__pyscx_gpu
    dataset: pbmc3k
    metric: hvg_overlap_vs_scanpy
    min: 0.95
  - benchmark: accel_hvg
    format: accel_hvg__pyscx_cpu
    dataset: pbmc3k
    metric: hvg_overlap_vs_scanpy
    min: 0.99

  # --- ml_loader throughput floors (§3.1) ----------------------------
  # Floors at 0.5x observed Phase-1 baseline median (0.6x on pbmc3k
  # since N_RUNS_SMALL=5 gives a tighter median than N_RUNS_LARGE=3).
  # Per-scenario keys (batches_per_sec__<scenario>) are emitted only
  # on that scenario's runs, so the gate's median is over scenario-
  # coherent runs (not aliased across raw/hvg/norm/hvg_norm).
  #
  # Headline claim ("82x vs TileDB-SOMA-ML, ~340x vs SLAFDataLoader,
  # 1,405 batches/sec on 1M cells") is in docs/performance.md; these
  # floors protect that claim at the small / medium tier.
  #
  # GPU utilization (avg_gpu_util_pct__gpu_train) is intentionally
  # NOT gated yet — `nvidia-smi dmon` polls at 1 Hz but pbmc3k epochs
  # finish in ~0.15s and tabula_sapiens_100k epochs in ~0.8s, so the
  # samples miss peak compute. Throughput is reliable; util% needs an
  # in-process sampler before it can be a floor.
  - benchmark: ml_loader
    format: scx_auto
    dataset: pbmc3k
    metric: batches_per_sec__raw
    min: 38.6
  - benchmark: ml_loader
    format: scx_auto
    dataset: pbmc3k
    metric: batches_per_sec__hvg_norm
    min: 11.7
  - benchmark: ml_loader
    format: scx_auto
    dataset: pbmc3k
    metric: batches_per_sec__gpu_train
    min: 12.1
  - benchmark: ml_loader
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__raw
    min: 66.3
  - benchmark: ml_loader
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__hvg_norm
    min: 66.0
  - benchmark: ml_loader
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__gpu_train
    min: 63.3
  - benchmark: ml_loader
    format: h5ad_none
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__hvg_norm
    min: 7.5
  - benchmark: ml_loader
    format: tiledb_soma
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__hvg_norm
    min: 10.0

  # --- correctness validation suite (§3.2) ---------------------------
  # Hard parity gate: any failure in scanpy-equivalence,
  # backed-mode-equivalence, preprocessing-paths, or SLAF round-trip
  # blocks the gate. Per-suite floors localize a failure to one
  # validator without forcing the operator to dig into
  # metadata.suite_counts.
  #
  # n_failed counts only `c.passed=False, c.error=None` checks
  # (genuine parity violations). Errors (import failures, missing
  # dependencies) are captured by *_n_skipped and do NOT trip these
  # floors — the SLAF suite is empty when slafdb is missing, which
  # is an acceptable env-dependent skip.
  #
  # overall_passed_int floors a single rolled-up bool so the gate's
  # one-liner failure message is human-readable when *any* suite
  # breaks. Per-suite floors below provide the attribution.
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: overall_passed_int
    min: 1
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: n_failed
    max: 0
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: scanpy_equivalence_n_failed
    max: 0
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: backed_equivalence_n_failed
    max: 0
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: preprocessing_paths_n_failed
    max: 0
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: slaf_equivalence_n_failed
    max: 0

  # --- cell_eval_parity_perf marquee floors (§3.3) -------------------
  # AGENTS.md headline claims:
  #   - energy_distance(backend="gemm", dtype="f32"): 52x at 20K x 2K x 50 perts
  #   - clustering_agreement: 12.83x at 200 perts
  #
  # Floors are calibrated below observed Phase-1 medians (0.6x for min,
  # 2.0x for max), NOT against the marquee claims directly — this
  # protects against a same-axis cell-eval slowdown faking a "free win"
  # while still catching real SCX regressions.
  #
  # Per-op keys are emitted sparsely (only for non-skipped operations);
  # the gate's median-over-non-None values picks them up cleanly.
  #
  # Coverage scope:
  #   - pert_synth_10k and pert_synth_100k are both gated. census_1m and
  #     larger remain excluded: _SKIP_RULES in cell_eval_parity_perf.py
  #     skips energy_distance variants at n_obs >= 500K, and routine
  #     gating at census scale needs a separate budget tier.
  #   - speedup__clustering_agreement is NOT gated — at 50 perts (the
  #     pert_synth_* config) SCX is ~0.8x of cell-eval. The 12.83x claim
  #     lives at 200 perts (a config we don't ship yet). The
  #     scx_median_s__clustering_agreement floor still catches SCX-side
  #     regressions on the clustering path independent of cell-eval.
  - benchmark: cell_eval_parity_perf
    format: scx_auto
    dataset: pert_synth_10k
    metric: speedup__energy_distance_blas_f32
    min: 11.0
  - benchmark: cell_eval_parity_perf
    format: scx_auto
    dataset: pert_synth_10k
    metric: scx_median_s__energy_distance_blas_f32
    max: 1.4
  - benchmark: cell_eval_parity_perf
    format: scx_auto
    dataset: pert_synth_10k
    metric: scx_median_s__clustering_agreement
    max: 1.0
  # pert_synth_100k floors (n=3 internal repeats, 0.5x speedup / 2.0x
  # wall envelope). Non-marquee energy_distance variants (f64,
  # scalar_f32, alias) skip at n_obs >= 100K — see _SKIP_RULES in
  # cell_eval_parity_perf.py:73-95. clustering_agreement still doesn't
  # surpass cell-eval at 50 perts (observed 0.84x); only the
  # scx_median_s envelope is gated.
  - benchmark: cell_eval_parity_perf
    format: scx_auto
    dataset: pert_synth_100k
    metric: speedup__energy_distance_blas_f32
    min: 8.5
  - benchmark: cell_eval_parity_perf
    format: scx_auto
    dataset: pert_synth_100k
    metric: scx_median_s__energy_distance_blas_f32
    max: 105.0
  - benchmark: cell_eval_parity_perf
    format: scx_auto
    dataset: pert_synth_100k
    metric: scx_median_s__clustering_agreement
    max: 8.5
