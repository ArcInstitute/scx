  # --- accel_pca: the backed (out-of-core) GPU arm ---
  #
  # This arm exists because OPT-GPU-13's 1.36-1.40x on out-of-core GPU PCA was
  # ungated and could not have been gated by any existing variant: they all run
  # on the runner's IN-MEMORY adata, which reaches GPU PCA through pyscx's
  # `BorrowedCsrSource` (`n_shards()` hard-coded 1), so the decode-prefetch
  # pipeline takes its sequential fallback and the multi-shard column-means pass
  # is unobservable. `__pyscx_gpu_streaming` is no exception — it differs only by
  # `SCX_GPU_PCA_RESIDENT=0` and reads the same single-shard source. Measured,
  # in-memory `device="gpu"` PCA on pbmc3k reports `route:
  # rapids_singlecell_gpu` and never enters the native path at all.
  #
  # THE PREMISE, floored on both datasets. One shard means the prefetch took its
  # sequential fallback and this arm measured what the in-memory arms measure —
  # under a name claiming otherwise. Shard count follows `n_obs` at the writer's
  # default `shard_target_rows` (16384); a drift to one shard fails here rather
  # than silently making every timing floor below pass on a smaller problem.
