  # --- accel_leiden: ARI vs leidenalg ---
  # First comprehensive run on pbmc3k produced ARI=0.893 for pyscx_cpu,
  # 0.895 for pyscx_gpu — consistent with AGENTS.md's "ARI 0.92 vs
  # leidenalg" target at larger scale, with small-dataset noise pulling
  # pbmc3k down. Floor set at 0.85 to accommodate that variance.
  - benchmark: accel_leiden
    format: accel_leiden__pyscx_gpu
    dataset: pbmc3k
    metric: ari_vs_leidenalg
    min: 0.85
  - benchmark: accel_leiden
    format: accel_leiden__pyscx_cpu
    dataset: pbmc3k
    metric: ari_vs_leidenalg
    min: 0.85

  # --- accel_preprocess: numerical equivalence to scanpy ---
  # GPU f32 vs CPU f64 intermediate drift on normalize+log1p is ~1e-5
  # on typical counts; 1e-3 provides ~2 orders of magnitude headroom.
  - benchmark: accel_preprocess
    format: accel_preprocess__pyscx_gpu
    dataset: pbmc3k
    metric: max_abs_diff_vs_scanpy
    max: 1.0e-3

  # --- accel_hvg: HVG set overlap vs scanpy seurat_v3 ---
  - benchmark: accel_hvg
