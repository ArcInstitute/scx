# 18. fragment_ops / in-place op walls (`wall_s__<operation>`) — OPT-FORMAT-1
#     PR-02c adds a sparse `wall_s__<op>` to all five arms plus a new
#     `obs_import` arm. Until then the module *timed* four in-place mutations
#     but none of those timings was gateable: `wall_s` is a reserved `add_run`
#     parameter and never reaches `runs[].extra`, so only the pooled
#     `median_wall_s` was visible — and that is dominated by `rollback`, the
#     cheapest arm.
#
#     `wall_s__rollback` is the sharpest OPT-FORMAT-1 instrument in the suite.
#     `rollback` -> `apply_catalog_at` -> `finalize_header_with_checksum`
#     streams offset 256 -> EOF, so a rollback is one 4 KB pwrite, two fsyncs
#     and a whole-file BLAKE3 rehash: essentially all of its wall IS the
#     checksum extent.
#
#     Measured 2026-09-02, 2 runs each:
#
#         metric              pbmc3k (4.5 MB)   census_1m (2.80 GB)
#         wall_s__rollback    0.0047            2.247   <- ~1.25 GB/s, +-2 ms
#         wall_s__delete      0.0067            1.727   <- ~1.6 GB/s
#         wall_s__obs_import  0.0244           19.72
#         wall_s__compact     2.514            (minutes; ~50 GB read)
#         wall_s__append      0.0158           25.61
#         wall_s__compact_full 3.13            (no census _full fixture yet)
#
#     CORRECTED, and this is why the census numbers were worth taking:
#     `wall_s__obs_import` was expected to be the second-cleanest instrument
#     ("one column added, whole file rehashed"). It is not. Only ~2.2 s of its
#     19.72 s is the rehash — **~11%**. `attach_external_obs` rewrites the obs
#     section and appends it at EOF (493 MB at census_1m against a 4 MB score
#     column, recorded per run as `obs_rewrite_bytes`), and that write plus
#     reading 28 obs columns to join is the other 89%. Do not floor it as an
#     OPT-FORMAT-1 signal.
#
#     *** ALL THE CENSUS NUMBERS ABOVE ARE DEBUG-BUILD NUMBERS. ***
#     Same cause as item 16: the in-tree editable pyscx `.so` was a debug
#     artifact from 08-31 until it was rebuilt `--release` at 12:13 on 09-02,
#     and the targeted job that produced them ran at 09:23. Re-measured through
#     the real capture (release, census_1m, identical work — `rows_imported`
#     1,000,000, `n_matched` 1,000,000, `obs_rewrite_bytes` 493,330,352,
#     `size_before_bytes` 2,800,057,397):
#
#         metric              debug (09:23)   release (capture)
#         wall_s__rollback        2.247            1.674
#         wall_s__delete          1.727            1.701
#         wall_s__obs_import     19.72             4.33
#
#     `rollback` and `delete` barely move — they are dominated by a BLAKE3
#     stream and an fsync, which a debug build does not slow down. `obs_import`
#     is 4.5x faster, because its other 89% *is* interpreted work.
#
#     Which changes the split this entry reports: the rehash is now ~1.67 s of
#     4.33 s, i.e. **~39%**, not ~11%. The ordering conclusion survives —
#     `rollback` is still the cleanest OPT-FORMAT-1 instrument, being
#     essentially all checksum — but `obs_import` is not the 89%-elsewhere
