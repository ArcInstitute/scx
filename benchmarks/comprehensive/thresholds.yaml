    min: 1
  - benchmark: shardad_fidelity
    format: shardad
    dataset: tabula_sapiens_100k
    metric: overall_passed_int
    min: 1

  # ─── F5 row-group block-index adoption (read_scattered) ──────────────
  # `read_scattered` drives an unsorted, scattered random-row gather over a
  # row-group-framed compact-trial file, opened with scatter_block_index=True.
  # On a framed file every scattered shard-group is
  # served by the codec-agnostic block index, so `block_index_groups > 0`,
  # `full_shard_groups == 0`, and `block_index_adoption_rate == 1.0`. A
  # regression that silently full-shard-decodes (framing dropped, or the loader
  # block-index path unwired) drops `block_index_groups` to 0 (and lifts
  # `full_shard_groups` above 0) → gate failure. These are correctness
  # contracts, not perf floors; they survive baseline promotion.
  #
  # Gated on BOTH the shipped write default G=256 (DEFAULT_ROW_GROUP_ROWS — the
  # G a plain `codec="auto"` / from_anndata write actually frames at) and the
  # historical compact-trial fixture default G=512, across the tier-small float
  # datasets that produce framed shards. The explicit `full_shard_groups max: 0`
  # floor on the multi-shard datasets makes the "no silent full-shard fallback"
  # guard direct rather than only implied by adoption_rate == 1.0.
  # `check_absolute_floors` skips any triple silently on runs that didn't
  # execute it (e.g. a narrower --formats/--datasets gate). See the F5
  # follow-up plan and docs/codec.md.
  - benchmark: read_scattered
    format: scx_compact_trial_g512
    dataset: pbmc3k
    metric: block_index_groups
    min: 1
  - benchmark: read_scattered
    format: scx_compact_trial_g512
    dataset: pbmc3k
    metric: block_index_adoption_rate
    min: 1.0
  - benchmark: read_scattered
    format: scx_compact_trial_g512
    dataset: smartseq2
    metric: block_index_groups
    min: 1
  - benchmark: read_scattered
    format: scx_compact_trial_g512
    dataset: tabula_sapiens_100k
    metric: block_index_groups
    min: 1
  # Full adoption on the MULTI-shard datasets is the important guard — a silent
  # full-shard fallback there (framing dropped / loader path unwired) is exactly
  # where the block-index win matters. Measured 1.0 on both (2026-07-04).
  - benchmark: read_scattered
    format: scx_compact_trial_g512
    dataset: smartseq2
    metric: block_index_adoption_rate
    min: 1.0
  - benchmark: read_scattered
    format: scx_compact_trial_g512
    dataset: tabula_sapiens_100k
    metric: block_index_adoption_rate
    min: 1.0
  # Direct "no full-shard fallback" floor (multi-shard G=512): full_shard_groups
  # must be exactly 0 when the block index is adopted for every scattered group.
  - benchmark: read_scattered
    format: scx_compact_trial_g512
    dataset: smartseq2
    metric: full_shard_groups
    max: 0
  - benchmark: read_scattered
    format: scx_compact_trial_g512
    dataset: tabula_sapiens_100k
    metric: full_shard_groups
    max: 0

  # ─── Same adoption contract at the shipped write default G=256 ───────
  # G=256 is DEFAULT_ROW_GROUP_ROWS, so this mirrors what a default-framed
  # training file (codec="auto", no explicit --row-group-rows) sees. Same
  # correctness floors: block_index_groups > 0, adoption == 1.0, and
  # full_shard_groups == 0 on the multi-shard datasets.
  - benchmark: read_scattered
    format: scx_compact_trial_g256
    dataset: smartseq2
    metric: block_index_groups
    min: 1
  - benchmark: read_scattered
    format: scx_compact_trial_g256
    dataset: tabula_sapiens_100k
    metric: block_index_groups
    min: 1
  - benchmark: read_scattered
    format: scx_compact_trial_g256
    dataset: smartseq2
    metric: block_index_adoption_rate
    min: 1.0
  - benchmark: read_scattered
    format: scx_compact_trial_g256
    dataset: tabula_sapiens_100k
    metric: block_index_adoption_rate
    min: 1.0
  - benchmark: read_scattered
    format: scx_compact_trial_g256
    dataset: smartseq2
    metric: full_shard_groups
    max: 0
  - benchmark: read_scattered
    format: scx_compact_trial_g256
    dataset: tabula_sapiens_100k
    metric: full_shard_groups
    max: 0

  # ─── F5 compact-trial compression ratio (default G=512) ──────────────
  # Conversion is deterministic, so these ratios are stable; the floors sit
  # ~8–11% below the 2026-07-04 measured medians (pbmc3k 4.82, pbmc10k 6.73,
  # smartseq2 4.07, tabula 6.79) to absorb dataset refreshes / codec-selection
  # drift while catching a real ratio regression (e.g. framing silently
  # inflating output). Ratio is essentially flat across G (±0.3%), so one G
  # (the default 512) is floored per dataset. `bits_per_nnz` is intentionally
  # NOT floored — its nnz estimate is unreliable on backed float files.
  - benchmark: compression
    format: scx_compact_trial_g512
    dataset: pbmc3k
    metric: compression_ratio
    min: 4.3
  - benchmark: compression
    format: scx_compact_trial_g512
    dataset: pbmc10k
    metric: compression_ratio
    min: 6.0
  - benchmark: compression
    format: scx_compact_trial_g512
    dataset: smartseq2
    metric: compression_ratio
    min: 3.6
  - benchmark: compression
    format: scx_compact_trial_g512
    dataset: tabula_sapiens_100k
    metric: compression_ratio
    min: 6.0

  # ─── scx_auto (adaptive) compression ratio — no size regression ───
  # Post-flip `scx_auto` is cost-aware adaptive: it adopts ShufDeltaZstd per
  # integer shard where it wins by ≥ ADOPT_MARGIN (5%), keeps the heuristic
  # otherwise, and keeps Pcodec on float — so its ratio is ≥ `scx_fast` (the
  # heuristic) and close to `scx_compact_trial_g512` (which adopts on any win;
  # the 5% margin can leave a few marginal-win shards on the heuristic, so
  # adaptive `auto` ≤ compact-trial in ratio by a small amount). These floors
  # reuse the (conservative, deterministic) compact-trial-g512 values as the
  # "no size regression" guard — the measured medians (e.g. pbmc10k 6.73,
  # tabula 6.79) leave headroom well above the margin effect. PROVISIONAL:
  # tighten to the captured adaptive medians on the P4.3 recapture.
  - benchmark: compression
    format: scx_auto
    dataset: pbmc3k
    metric: compression_ratio
    min: 4.3
  - benchmark: compression
    format: scx_auto
    dataset: pbmc10k
    metric: compression_ratio
    min: 6.0
  - benchmark: compression
    format: scx_auto
    dataset: smartseq2
    metric: compression_ratio
    min: 3.6
  - benchmark: compression
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: compression_ratio
    min: 6.0

# ---------------------------------------------------------------------------
# Deferred floors — known gaps tracked here so operators can see what's
# missing and why. Add entries above this block once the blockers below
# resolve; do NOT add them under `absolute_floors` until then, as the
# gate would synthesise "missing metric" violations on every run.
# ---------------------------------------------------------------------------
#
# 1. ml_loader / slaf throughput + TTFB floors
#    Blocker: slafpy lives in a separate `scx-bench-slaf` conda env;
#    the orchestrator activates exactly one env per gate run, so a
#    single-env capture never produces slaf rows in the same snapshot
#    as the rest. A floor here would synthesise a "missing metric"
#    violation on every run from `scx-bench`. Revisit once the
#    orchestrator supports per-runner env activation (or once slafpy
#    is reachable from `scx-bench` without a transitive breakage).
#
# 2. accel_gpu_train / avg_gpu_util_pct__gpu_train floors
#    Blocker: the current sampler runs `nvidia-smi dmon` at 1 Hz, which
#    misses sub-second epoch boundaries on small fixtures (pbmc10k:
#    ~30–60 ms per batch). The reported avg_util_pct under-counts the
#    real utilisation by 20–50%, depending on epoch geometry. A floor
#    on the under-counted value would either tolerate genuine
#    underutilisation (set high) or false-positive on healthy runs
#    (set low). Need an in-process CUDA event sampler that ticks at
#    >= the kernel launch rate before a floor is safe.
#
# 3. cell_eval_parity_perf / census_1m floors
#    Blocker: the cell-eval reference's energy_distance variants are
#    O(N²) in n_obs and infeasible at >= 500K cells (would take days
#    on the reference path even though SCX completes in minutes). The
#    parity benchmark skips these variants at `n_obs >= 500K` —
#    floors there would surface as missing-metric violations. Revisit
#    if cell-eval upstream lands a streaming energy_distance, or if
#    we accept "no reference comparison at census scale" and gate
#    only on the SCX side wall-time / RSS (a different metric than
#    cell_eval_parity_perf measures today).
#
# 4. nb_glm_route_csc_direct (GPU NB-GLM device-resident aggregation, Stage C)
#    The Stage-A/B GPU pseudobulk NB-GLM floors (nb_glm_route_gpu_correct,
#    nb_glm_cpu_gpu_concordant, nb_glm_pdex_ref_concordant) are now ACTIVE
#    `absolute_floors` rows above, gated on the `nb_glm_synth` stratified
#    fixture via the `accel_de_nb_glm` bench module. What remains deferred is
#    the Stage-C device-resident aggregation route `gpu_nb_glm_csc` (CSC/CSR
#    sum kernels feeding the fitter with no host round-trip — the path to ≥3x).
#    When it lands, add a `nb_glm_route_csc_direct` floor (mirroring
#    `de_route_csc_direct`) on `accel_de_nb_glm__pyscx_gpu` + an
#    aggregation-phase perf signal. The `gpu_nb_glm_csc` route string is
#    reserved but never emitted today.
#
# 5. ml_loader batches_per_sec floors for the adaptive `scx_auto` (post-flip) —
#    PARTIALLY ACTIVE + PROVISIONAL. After the auto→adaptive flip (2026-07-12),
#    `scx_auto` is cost-aware adaptive and `scx_fast` is the decode-max heuristic
#    (the pre-flip `auto`). The `scx_fast` throughput floors and the `scx_auto`
#    compression floors are transplanted from the pre-flip numbers (see the
#    ml_loader + compression blocks). The adaptive `scx_auto` throughput floor is
#    ACTIVE only for `pbmc10k` (reused from the old `auto_v2` capture — a
#    conservative lower bound). DEFERRED to the P4.3 recapture: adaptive
#    `scx_auto` throughput floors for `pbmc3k` / `tabula_sapiens_100k` / census,
#    and tightening every PROVISIONAL floor to the captured adaptive medians
#    (min = 0.85× the measured min run). The recapture must also add the looser
#    raw-path (G1b) floor documented in docs/performance.md.
#
# 6. discrimination_route_gpu_correct (GPU discrimination_score)
#    The GPU eval-metric route floors (perturbation_metrics_route_gpu_correct,
#    energy_distance_route_gpu_correct) are now ACTIVE `absolute_floors` rows
#    above, gated on `pert_synth_10k` via the `accel_eval_metrics` bench module.
#    `discrimination_score` GPU stays DEFERRED: it needs exact-rank parity
#    (`rank = count(d < correct_dist)`) that an f32 cuBLAS gemm can't guarantee
#    (f32 rounding can flip near-tie ranks), and it is already fast on the small
#    `[P×G]` effect matrix — low ROI. When a GPU kernel lands (exact-rank-safe),
#    add a `discrimination_route_gpu_correct` floor mirroring the two above, plus
#    an `accel_eval_metrics__pyscx_discrimination_score_gpu` variant. The
#    `discrimination_score` op stamps only `cpu_*` routes today.
