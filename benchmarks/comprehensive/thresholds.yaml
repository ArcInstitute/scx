  # not the answer: a broken column-means pass that still reports a `gpu_*` route
  # and finishes under 1.43 s on tabula — and under nothing at all on census —
  # stays green. `run()` already emits these extras for every variant, so the
  # arm was carrying them unfloored (Cursor Agent).
