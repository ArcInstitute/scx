  # --- ml_loader throughput floors -----------------------------------
  # Floors at 0.5x observed baseline median (0.6x on pbmc3k
  # since N_RUNS_SMALL=5 gives a tighter median than N_RUNS_LARGE=3).
  # Per-scenario keys (batches_per_sec__<scenario>) are emitted only
  # on that scenario's runs, so the gate's median is over scenario-
  # coherent runs (not aliased across raw/hvg/norm/hvg_norm).
  #
  # Headline claim ("82x vs TileDB-SOMA-ML, ~340x vs SLAFDataLoader,
  # 1,405 batches/sec on 1M cells") is in docs/performance.md; these
  # floors protect that claim at the small / medium tier.
  #
  # GPU utilization (avg_gpu_util_pct__gpu_train) is intentionally
  # NOT gated yet — `nvidia-smi dmon` polls at 1 Hz but pbmc3k epochs
  # finish in ~0.15s and tabula_sapiens_100k epochs in ~0.8s, so the
  # samples miss peak compute. Throughput is reliable; util% needs an
  # in-process sampler before it can be a floor.
  - benchmark: ml_loader
    format: scx_auto
    dataset: pbmc3k
    metric: batches_per_sec__raw
    min: 38.6
  - benchmark: ml_loader
    format: scx_auto
    dataset: pbmc3k
    metric: batches_per_sec__hvg_norm
    min: 11.7
  - benchmark: ml_loader
    format: scx_auto
    dataset: pbmc3k
    metric: batches_per_sec__gpu_train
    min: 12.1
  - benchmark: ml_loader
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__raw
    min: 66.3
  - benchmark: ml_loader
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__hvg_norm
    min: 66.0
  - benchmark: ml_loader
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__gpu_train
    min: 63.3
  - benchmark: ml_loader
    format: h5ad_none
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__hvg_norm
    min: 7.5
  - benchmark: ml_loader
    format: tiledb_soma
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__hvg_norm
    min: 10.0

  # `num_workers > 0` floors. Activated after the fork-safety fix —
  # pre-fix this path deadlocked, so no historical baseline exists.
  # Floors are seeded conservatively at 0.0 (any non-zero throughput is
  # an improvement over an infinite hang) and will be re-baselined to
  # 0.5× the post-fix median by a future
  # `promote_baseline.py --version v0.X.Y-fork-safety`. Once that
  # baseline lands, replace `min: 0.0` with the calibrated floors and
  # write a justification under
  # `benchmarks/comprehensive/results/justifications/`.
  - benchmark: ml_loader
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__pyscx_training_dataset_workers2
    min: 647.2
  - benchmark: ml_loader
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__pyscx_training_dataset_workers2_persistent
    min: 680.8

  # IndexPlanDataset workers2 floor — same 0.5×-of-post-fix-median
  # convention as the workers2 entries above.
  # Calibrated 2026-05-01 from SLURM job 113080 (Lambda HPC, H100, 100k
  # synthetic fixture): median workers2 throughput 144.64 bps; floor =
  # 0.5 × 144.64 ≈ 72.3 bps. Workers2 is ~0.36× workers0 (404.4 bps) —
  # lower than the TrainingDataset workers2 ratio (~0.50×) because each
  # worker thrashes the shard cache on a non-locality-sorted random
  # plan stream.
  - benchmark: index_plan
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__pyscx_index_plan_dataset_workers2
    min: 72.3

  # --- correctness validation suite ----------------------------------
  # Hard parity gate: any failure in scanpy-equivalence,
  # backed-mode-equivalence, preprocessing-paths, or SLAF round-trip
  # blocks the gate. Per-suite floors localize a failure to one
  # validator without forcing the operator to dig into
  # metadata.suite_counts.
  #
  # n_failed counts only `c.passed=False, c.error=None` checks
  # (genuine parity violations). Errors (import failures, missing
  # dependencies) are captured by *_n_skipped and do NOT trip these
  # floors — the SLAF suite is empty when slafdb is missing, which
  # is an acceptable env-dependent skip.
  #
  # overall_passed_int floors a single rolled-up bool so the gate's
  # one-liner failure message is human-readable when *any* suite
  # breaks. Per-suite floors below provide the attribution.
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: overall_passed_int
    min: 1
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: n_failed
    max: 0
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: scanpy_equivalence_n_failed
    max: 0
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: backed_equivalence_n_failed
    max: 0
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: preprocessing_paths_n_failed
    max: 0
  - benchmark: correctness
    format: scx_auto
    dataset: pbmc3k
    metric: slaf_equivalence_n_failed
    max: 0

  # --- roundtrip codec parity ----------------------------------------
  # Catches silent value corruption in any of the SCX codecs: scx_auto
  # (auto-selector), scx_none (raw LE), scx_scx1 (Delta-Golomb-Rice /
  # FOR-BP / Rice), scx_zstd, scx_lz4 (byte-shuffle + LZ4), and
  # scx_pcodec. correctness.py does NOT cover this — every check there
  # writes and reads through the same codec, so a symmetric corruption
  # (encode-then-decode that loses bits identically) goes undetected.
  #
  # All current SCX codecs are lossless by design, so the floor is
  # exact equality. Comparison happens in float32 (pyscx always
  # materialises X as f32, regardless of on-disk encoding) on a
  # canonicalised CSR (sort_indices + eliminate_zeros on both sides) —
  # see roundtrip.py module docstring.
  #
  # max_abs_diff / max_rel_diff are emitted as diagnostics but NOT
  # floor-gated: redundant with n_value_mismatches == 0 for lossless
  # codecs, and would need a non-zero tolerance once a future lossy
  # variant lands.
  #
  # Coverage scope: pbmc3k + tabula_sapiens_100k for all 6 SCX
  # variants. The benchmark still RUNS on whatever larger datasets the
  # launcher passes (rows appear in the summary), but isn't floor-gated
  # there — codec contracts are dataset-independent and these two
  # datasets cover the u16 and u32 index paths (n_vars boundary at
  # 65535).
  #
  # The scx_auto rows partly overlap with the explicit codec rows
  # (auto-selector picks scx1 for pbmc3k's u8 counts), but keeping
  # both catches a regression where scx_auto STOPS picking the right
  # codec — the unmeasured selector-drift gap.
  - benchmark: roundtrip
    format: scx_auto
    dataset: pbmc3k
    metric: overall_passed_int
    min: 1
  - benchmark: roundtrip
    format: scx_auto
    dataset: pbmc3k
    metric: n_value_mismatches
    max: 0
  - benchmark: roundtrip
    format: scx_none
    dataset: pbmc3k
    metric: overall_passed_int
    min: 1
  - benchmark: roundtrip
    format: scx_none
    dataset: pbmc3k
    metric: n_value_mismatches
    max: 0
  - benchmark: roundtrip
    format: scx_scx1
    dataset: pbmc3k
    metric: overall_passed_int
    min: 1
  - benchmark: roundtrip
    format: scx_scx1
    dataset: pbmc3k
    metric: n_value_mismatches
    max: 0
  - benchmark: roundtrip
    format: scx_zstd
    dataset: pbmc3k
    metric: overall_passed_int
    min: 1
  - benchmark: roundtrip
    format: scx_zstd
    dataset: pbmc3k
    metric: n_value_mismatches
    max: 0
  - benchmark: roundtrip
    format: scx_lz4
    dataset: pbmc3k
    metric: overall_passed_int
    min: 1
  - benchmark: roundtrip
    format: scx_lz4
    dataset: pbmc3k
    metric: n_value_mismatches
    max: 0
  - benchmark: roundtrip
    format: scx_pcodec
    dataset: pbmc3k
    metric: overall_passed_int
    min: 1
  - benchmark: roundtrip
    format: scx_pcodec
    dataset: pbmc3k
    metric: n_value_mismatches
    max: 0
  - benchmark: roundtrip
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: overall_passed_int
    min: 1
  - benchmark: roundtrip
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: n_value_mismatches
    max: 0
  - benchmark: roundtrip
    format: scx_none
    dataset: tabula_sapiens_100k
    metric: overall_passed_int
    min: 1
  - benchmark: roundtrip
    format: scx_none
    dataset: tabula_sapiens_100k
    metric: n_value_mismatches
    max: 0
  - benchmark: roundtrip
    format: scx_scx1
    dataset: tabula_sapiens_100k
    metric: overall_passed_int
