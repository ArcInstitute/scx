  # --- index_plan throughput floors -----------------------------------
  # Floors set at 0.5x of the 1M-cell synthetic-fixture medians
  # captured on
  # vci-steady-state-node-020 (Lambda HPC, --cpus-per-task=16
  # --mem=64G, --partition=standard). 1M x 2K x 5% density x HVG=2000 x
  # 1024 pairs/batch x 1000 batches. Source JSONs:
  #   benchmarks/comprehensive/results/index_plan_phase7/index_plan_1m_*.json
  # The locality scenario is gated; the random scenario is informational
  # only (a target estimate, not a regression gate, per spec). The
  # training_dataset ceiling is gated to catch upstream regressions in
  # the sequential pipeline that would otherwise leave index_plan looking
  # healthy.
  #
  # `..._index_plan_locality` — pbmc3k KEPT, tabula RE-DERIVED 2026-09-03.
  #
  # These were "derived by scaling" from a synthetic 1M anchor on the
  # assumption that "smaller fixtures fit in cache better". The *direction* was
  # right and the *magnitudes* were not. Measured 2026-09-03:
  #
  #     pbmc3k               114.08 bps   (floor 5.0    — passes, kept)
  #     tabula_sapiens_100k    0.72 bps   (floor 12.0   — 17x above; re-derived)
  #     census_1m              0.20 bps   (floor 4.9    — 25x above; see below)
  #
  # The ordering 114 > 0.72 > 0.20 is exactly "smaller fits better", so the
  # model was sound; the anchor was not. The synthetic 1M fixture ran 9.81 bps
  # where the real census_1m runs 0.20 — **49x apart at the same cell count** —
  # and the census block below already warned "census_1m may use a different
  # fixture than the synthetic 1M one … drop or re-tune if the dataset mismatch
  # causes spurious failures". This is that re-tune.
  #
  # NOT a regression: `..._locality` at tabula measured 0.520 in three separate
  # July 2026 snapshots (`baseline_2026_07_10`,
  # `candidate_auto_converge_20260712`, `candidate_2026_07_23_dataload_phase0`)
  # and 0.720 today — a 38% improvement. The `..._training_dataset` variant on
  # the same fixture went 20.825 -> 24.395 and passes its floor.
  #
  # pbmc3k's 5.0 is left alone: it is 23x below a stable 114.08, so it is loose,
  # but it is the one value in this group that was never wrong and re-deriving
  # it is not this change's business.
  - benchmark: index_plan
    format: scx_auto
    dataset: pbmc3k
    metric: batches_per_sec__pyscx_index_plan_locality
    min: 5.0
  # 0.85 × 0.720 = 0.612. Spread is 0.72 / 0.72 across both runs.
  - benchmark: index_plan
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__pyscx_index_plan_locality
    min: 0.612
  - benchmark: index_plan
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__pyscx_training_dataset
    min: 23.0
  # Was "1M synthetic floors at 0.5x observed median (9.81 / 36.62 → 4.9 /
  # 18.3)", with the caveat "census_1m may use a different fixture than the
  # synthetic 1M one … drop or re-tune if the dataset mismatch causes spurious
  # failures". It did, and this is the re-tune: measured 0.20 bps (50 batches
  # in 244.6 s, both runs identical), so the synthetic anchor was 49x optimistic
  # for the real fixture. New floor = 0.85 × 0.20 = 0.170.
  #
  # CAVEAT on precision: the metric is recorded rounded to 2 decimals, so at
  # 0.20 one tick is 5% of the value and the 15% margin is three ticks. Fine as
  # a gross-regression guard; do not read it as a 15%-sensitive gate.
  #
  # `..._training_dataset` on the same triple measured 21.775 against its 18.3
  # floor and is left alone — that anchor did transfer.
  - benchmark: index_plan
    format: scx_auto
    dataset: census_1m
    metric: batches_per_sec__pyscx_index_plan_locality
    min: 0.170
  - benchmark: index_plan
    format: scx_auto
    dataset: census_1m
    metric: batches_per_sec__pyscx_training_dataset
    min: 18.3

  # ----- multimodal_compression (Phase K) -------------------------
  # Absolute floors on the SCX multimodal output, derived from the
  # 2026-05-08 SLURM run on real 10x public CITE-seq + Multiome
  # fixtures. ``output_size_bytes`` is gated as a 1.4× ceiling
  # (a 40% on-disk inflation is a codec or modality-routing
  # regression); ``compression_ratio_vs_h5mu`` floors keep SCX
  # from drifting below ~70% of the measured advantage over
  # uncompressed h5mu.
  #
  # Measured CITE-seq (5247 cells, 33538 RNA + 32 ADT):
  #   SCX per-modality: 15.8 MB, 5.25× vs h5mu raw.
  # Measured Multiome (11898 cells, 36601 RNA + 143887 ATAC):
  #   SCX per-modality: 238.3 MB, 4.56× vs h5mu raw.
  - benchmark: multimodal_compression
    format: scx_multimodal_per_modality_auto
    dataset: cite_seq_pbmc_5k
    metric: output_size_bytes
    max: 22000000   # 22 MB ≈ 1.4× measured 15.8 MB
  - benchmark: multimodal_compression
    format: scx_multimodal_per_modality_auto
    dataset: multiome_pbmc_10k
    metric: output_size_bytes
    max: 335000000  # 335 MB ≈ 1.4× measured 238 MB
  - benchmark: multimodal_compression
    format: scx_multimodal_per_modality_auto
    dataset: cite_seq_pbmc_5k
    metric: compression_ratio_vs_h5mu
    min: 3.5         # ~70% of measured 5.25×
  - benchmark: multimodal_compression
    format: scx_multimodal_per_modality_auto
    dataset: multiome_pbmc_10k
    metric: compression_ratio_vs_h5mu
    min: 3.0         # ~70% of measured 4.56×

  # ----- multimodal_training (Phase K) ----------------------------
  # MultimodalTrainingDataset throughput + time-to-first-batch floors.
  #
  # Throughput is floored on cells_per_sec (batch-size-INVARIANT), not
  # batches_per_sec. These fixtures are small and the loader does not
  # cycle, so a measured "epoch" is a single pass: cite_seq 5,247 cells
  # / batch 4,096 ≈ 2 batches; multiome 11,898 cells with the batch
  # pinned to 256 by the wide-ATAC per-modality memory budget ≈ 47
  # batches. batches_per_sec therefore depends on batch_size and the
  # single-pass batch count (it was the old 285/12 floors, which assumed
  # a 100-batch cycled epoch that never happens) — not a stable signal.
  # cells_per_sec is the cells/s the loader actually sustains and is
  # comparable across batch-size / batch-pinning changes.
  #
  # Re-anchored after OPT-LOADER-1 (the multimodal batch is moved into numpy
  # instead of cloned). That removed a per-batch full copy of every modality's
  # dense X on the consumer thread with the GIL held, and it was the dominant
  # term: a main-vs-branch A/B on one worker node, 5 runs per arm, measured
  #
  #   per-modality CITE-seq:  9,738 -> 31,118 cells/s  (3.20x)
  #   per-modality multiome:  1,781 ->  5,699 cells/s  (3.20x)
  #
  # with identical n_batches / n_cells and bit-identical epoch digests. The
  # three non-SCX keys on the same datasets moved 0.89-1.07x, which is this
  # node's noise floor.
  #
  # The floors are 0.7x of the measured median, NODE-NORMALISED: the same A/B's
  # main arm measured 1,781 / 9,738 cells/s where the LATEST baseline records
  # 1,627 / 8,470 on unchanged code, so this node is 1.10x / 1.15x faster and
  # the raw medians would over-anchor by that much. 5,699 / 1.10 * 0.7 = 3,644
  # and 31,118 / 1.15 * 0.7 = 18,942, rounded down. That is a tighter
  # conservatism than the 0.5x these floors used to carry, and deliberately so:
  # what was removed scaled with bytes copied, so the new level is structural
  # rather than incidental. TTFB improved too (0.47 -> 0.19 s CITE-seq,
  # 1.59 -> 1.47 s multiome) but its caps keep their cold-cache slack unchanged.
  - benchmark: multimodal_training
    format: scx_multimodal_per_modality_auto
    dataset: cite_seq_pbmc_5k
    metric: cells_per_sec
    min: 18500       # 0.7× of 31,118 measured, normalised for a 1.15× node
  - benchmark: multimodal_training
    format: scx_multimodal_per_modality_auto
    dataset: cite_seq_pbmc_5k
    metric: time_to_first_batch_s
    max: 1.5         # unchanged; ~7.9× the 0.19s now measured, absorbs cold-cache jitter
  - benchmark: multimodal_training
    format: scx_multimodal_per_modality_auto
    dataset: multiome_pbmc_10k
    metric: cells_per_sec
    min: 3600        # 0.7× of 5,699 measured, normalised for a 1.10× node
  - benchmark: multimodal_training
    format: scx_multimodal_per_modality_auto
    dataset: multiome_pbmc_10k
    metric: time_to_first_batch_s
    max: 4.0         # unchanged; ~2.7× the 1.47s now measured

  # ─── Streaming h5ad → SCX conversion (Phase 10) ─────────────────────
  # The streaming converter's whole point is bounded peak memory — bounded by
  # SHARDS IN FLIGHT, not by file size. `streaming_peak_rss_mb` comes from the
  # arm pinned to `conversion_streaming.GATED_READER_THREADS` (4), because the
  # parallel reader holds `reader_threads + writer_queue_depth` shards and
  # `reader_threads` otherwise defaults to `available_parallelism()` — which
  # would make this threshold a property of the runner rather than of the code.
  # The unpinned number is recorded as `streaming_default_threads_peak_rss_mb`
  # and deliberately not gated.
  #
  # Derivation for census_1m, 2026-08-22. Measured figures are from job **2834737**,
  # whose results are tracked at
  # `results/raw/conversion_streaming__scx_streaming_vs_materialize__census_1m.json`
  # — the same capture docs/performance.md publishes, so the two cannot drift.
  # (An earlier revision of this comment quoted job 2834726's 2278/2335/2423 MB,
  # a different run of the same code; the numbers agree to ~2% but citing an
  # untracked capture is what let the doc and its backing diverge.)
  #   nnz/cell                    1402
  #   one 16384-row shard         16384 × 1402 × 16 B  = 351 MB
  #   ~6 in flight at rt=4        (4 readers + writer queue) = ~2100 MB
  #   + interpreter/import base   ~350 MB (measured on pbmc3k)
  #   = predicted                 ~2450 MB
  #   measured                    2258 / 2342 / 2368 MB (median 2342)
  # Floor set at 4096 MB — ~1.7× the worst observed, tight enough to catch a
  # doubling (which is what an accumulator leak looks like) and loose enough to
  # absorb allocator variance. The previous 2048 MB was "~10× the design
  # ceiling" of ~130 MB/shard, derived for ~20 000 vars at ~5% density on a
  # SEQUENTIAL reader holding one shard; the parallel ingest reader landed four
  # days after that floor was written (2026-05-15 vs 2026-05-19) and census_1m's
  # per-shard working set is 2.7× the assumed one. The floor was never evaluated
  # in between, because the benchmark was absent from ALL_BENCHMARKS.
  #
  # Wall-clock is intentionally NOT gated: the materialise path naturally
  # wins on datasets that fit in RAM (parallel shard encode over
  # pre-computed boundaries), and a streaming wall regression doesn't
  # change the bounded-memory contract. Track wall numbers in
  # docs/performance.md; gate only the memory ceiling here.
  - benchmark: conversion_streaming
    format: scx_streaming_vs_materialize
    dataset: census_1m
    metric: streaming_peak_rss_mb     # the reader_threads=4 arm only
    max: 4096.0

  # ─── Streaming 10x → SCX conversion (OPT-CONVERT-9) ─────────────────
  # `scx convert --from 10x` had one materialising path until OPT-CONVERT-9:
  # `read_tenx_h5` read `/matrix/{indptr,indices,data}` whole. It now streams,
  # and by default, so this is the floor on the claim.
  #
  # Driven through the **CLI**, not `from_h5ad`, because the direction is not
  # reachable from it: `pyscx.from_10x` routes through `scanpy.read_10x_h5` into
  # `from_anndata` — a third path with no `stream` kwarg and no bounded reader.
  # The source is a synthesised 10x fixture (`prep_tenx_fixture.py`), since no
  # benchmark dataset is a 10x file; it copies the h5ad's CSR arrays verbatim,
  # which *is* the 10x CSC-over-genes×cells layout, so the fixture is real.
  #
  # Derivation for census_500k, measured 2026-09-11 on a Chimera worker node
  # with `target/release/scx` (`--features hdf5`), one run per arm, each in its
  # own process (peak from `getrusage(RUSAGE_CHILDREN)` over a single `scx`
  # child, so it is that convert's high-water mark and nothing else's).
  #
  # **Not yet a tracked capture.** Unlike the census_1m block above, which
  # cites job 2834737's results JSON, these numbers come from a direct local
  # run of the two arms — enough to derive a floor, not enough to quote in
  # `docs/performance.md`, which needs a manifest entry
  # (`docs/benchmark_manifest.md`). Replace this paragraph with the job id and
  # results path once a full-tier capture has populated the metric.
  #   500,000 cells × 61,497 genes, 747,048,147 nnz, 5.59 GB source
  #   nnz/cell                    1494
  #   31 CSR shards of 16384 rows, ~24.1M nnz each
  #   one shard's worker phase    24.1M × 48 B  = 1156 MB  (budget.rs's model)
  #   measured, --stream (rt=4)   2593 MB / 17.5 s
  #   measured, --stream=false    8599 MB / 33.2 s
  # Floor set at 4096 MB — 1.58× the measured streaming peak, and **less than
  # half** the materialising arm's 8599 MB, so a regression back to a
  # whole-matrix read fails this floor rather than merely looking slower. Same
  # value as the census_1m h5ad floor above, which is a coincidence of scale
  # rather than a shared derivation.
  #
  # Wall clock is not gated here either, for the reason above — though note the
  # streaming arm is also 1.9× *faster*, because the eager path pays a full
  # extra scan of `data` in `detect_value_encoding` plus a whole-matrix
  # `values_to_raw_bytes` before it encodes anything.
  #
  # The `tenx_materialize` arm is the comparison baseline, not a contract, and
  # is deliberately unfloored: `_assert_tenx_streaming_beat_materialize` raises
  # when the pair stops demonstrating a bound, which is the property that
  # matters and is not expressible as a ceiling on either arm alone.
  - benchmark: conversion_streaming
    format: scx_streaming_vs_materialize
    dataset: census_500k
    metric: tenx_streaming_peak_rss_mb   # the --stream=true, rt=4 arm only
    max: 4096.0

  # ─── Observed RSS ceiling for a budgeted ingest (OPT-CONVERT-10) ───
  # The `budget_bound` arm hands `from_h5ad` a 2 GiB `memory_budget` at
  # `shard_size=2048`, and this floor says the process's peak RSS stayed
  # inside it on this fixture. A **ratio**, not an MB ceiling,
  # deliberately: the peak carries the runner's interpreter baseline
  # (~450-520 MB, see the build_csc note below) and the budget is the only
  # thing that makes the number mean anything, so dividing by it is what
  # makes the floor portable.
  #
  # ⚠️ It is an **observation**, not a contract. Every row of
  # `scx-convert/src/budget.rs`'s allocation table is `enforced: false`,
  # and each row names what it does not price — frame expansion,
  # intra-codec planes, the encoded indptr on an nnz=0 shard, the
  # detection bitmap, the density-guess readers. A budgeted convert can
  # therefore exceed its budget by something none of them charge, and one
  # compressible fixture landing at 0.505 does not make it a promise.
  # What the floor is worth is regression detection at the one shape
  # anything measures it: the ratio rising means an allocation appeared
  # that the model does not charge, or the model got cheaper without the
  # allocations following.
  #
  # 1.0 rather than ~1.2x an observation for a different reason, then:
  # not because it is guarding a promise, but because the budget is the
  # natural unit and a headroom multiple over it would be arbitrary. The
  # measured value is 0.505, so the floor has 2x of real slack already.
  # Derivation, from smartseq2's own indptr: the widest shard at
  # shard_size=2048 holds 7,951,265 nnz, which at 48 B/nnz whole-phase is
  # 382 MB; the budget admits 5 outstanding and grants 4 threads, so the
  # expected peak is ~1.5 GB plus baseline against a 2048 MB budget.
  #
  # This became measurable at all only when `budget.rs` started charging
  # the framed encode's transient. Before that the same shard was priced
  # at 127 MB, 2 GiB granted 15 threads, and the peak was bounded by
  # nothing the budget knew about.
  #
  # ⚠️ smartseq2 because it is deep-sequenced AND in every tier. The
  # genuinely worst case is `chemogenetic_rgfp` (~6,700 nnz/cell of raw
  # integer UMIs, where `encoded ~= payload` is tight rather than slack),
  # which is off-tier — see the deferred floor below.
  - benchmark: conversion_streaming
    format: scx_streaming_vs_materialize
    dataset: smartseq2
    metric: peak_over_memory_budget__budget_bound
    max: 1.0

  # ─── Streaming SCX → h5ad / h5mu export (Phase 8) ──────────────────
  # Mirror of the ingestion floor above. Streaming export's contract
  # is the same: peak RSS bounded by one shard's worth of CSR per
  # matrix written, regardless of total file size. Same regression
  # mode (cross-shard accumulator leak in
  # ``scx_to_h5ad_streaming`` / ``scx_to_h5mu_streaming``) trips
  # this floor. Wall-clock is intentionally not gated — materialise
  # naturally wins on datasets that fit in RAM, and a streaming wall
  # regression doesn't change the bounded-memory contract.
  # Same pinned-arm construction as the ingestion floor above.
  # Measured on census_1m at rt=4 (job 2834737, tracked at
  # `results/raw/export_streaming__scx_streaming_vs_materialize__census_1m.json`):
  # 3125 / 3162 / 3189 MB, median 3162. Higher than ingest's 2342 MB at the same
  # thread count because the decode pool and the HDF5 write buffers are both live
  # while the writer runs on the calling thread; and it scales more gently with
  # threads for the same reason (3162 → 5622 MB median from 4 to 16,
  # against ingest's 2342 → 5893).
  # Floor at 5120 MB, ~1.6× the worst observed.
  - benchmark: export_streaming
    format: scx_streaming_vs_materialize
    dataset: census_1m
    metric: streaming_peak_rss_mb     # the reader_threads=4 arm only
    max: 5120.0

  # ─── Streaming export of a file that actually HAS a .raw ──────────
  #
  # The ceiling above is measured on `census_1m_auto.scx`, and that file has no
  # `.raw`, `obsm_keys == []` and `layer_names == []` — as does every other
  # `.scx` in the suite, because no source h5ad carries any of the three. So it
  # never reaches the code that copies them. A green ceiling there proves the
  # file was small, not that the export streams.
  #
  # `_full.scx` (built by `benchmarks/scripts/prep_full_fixtures.py`) adds a
  # `.raw`, `obsm["X_pca"]` / `obsm["X_umap"]` and a `counts` layer.
  #
  # What each term costs, after PR-04 (OPT-CONVERT-1) made `/raw` stream:
  #   raw    — streamed, via `stream_raw_at` (`h5ad/stream_write.rs`), the same
  #            `stream_csr_to_group_at` driver as `/X` and the layers. It used
  #            to call `read_all_raw_csr_shards()` and hold the whole matrix,
  #            and it dominated this ceiling.
  #   obsm   — still materialised (`read_all_obsm()`, with an
  #            `ExportFilterSectionEager` warning under a keep mask). 19.8 MB
  #            at 52 columns on tabula, ~208 MB at census scale. OPT-CONVERT-4.
  #   layers — already streamed via `stream_layers_at`.
  #
  # MEASURED, PR-04 capture (SLURM job 2907891, median of 3,
  # `reader_threads=4`), against the `v0.16.0-opt-instruments` baseline on the
  # same fixtures:
  #
  #                          before      after     plain arm   full-minus-plain
  #   tabula_sapiens_100k    3799.4     2308.1        1800.0        508 MB
  #   census_1m             20198.3     7547.2        3212.2       4335 MB
  #   pbmc3k                  363.7      352.7         342.2         11 MB
  #
  # PROVENANCE. An earlier capture of these same numbers (job 2907694) recorded
  # `git_sha aaee6ecf` with `git_dirty: true`, and that commit was later rebased
  # away — so it is an ancestor of nothing and GitHub cannot resolve it, failing
  # `docs/benchmark_manifest.md` rules 2 and 3. Job 2907891 re-ran from the
  # committed PR head (`868cf6d6`). It still records `git_dirty: true`, and the
  # dirtiness is exactly two files: a `.gitignore` line adding `manuscript/` to
  # the ignore list, and this benchmark's own tracked result JSON, which the run
  # rewrites as it goes. Both are benchmark-irrelevant — the documented-dirtiness
  # case rule 3 allows. The two captures agree to within 1.7%, which is what
  # makes the first one's numbers safe to discard rather than argue about.
  #
  # i.e. 1.65x at tabula and 2.68x at census — 12.7 GB freed on the census
  # export. The plain (`_auto.scx`) arm is the control — those fixtures have no
  # raw, so a change scoped to raw must not move them — and it does not: 1.015x
  # / 1.010x / 1.011x, which is cross-capture variance (this capture ran on
  # GPU71BA, the v0.16.0 baseline on a different node), not a shift. Quoting it
  # as a flat "1.00x" would be tidier and false.
  #
  # The residual over the plain arm is NOT one shard's worth. It is the
  # remaining eager `obsm` read plus the fact that peak RSS over a multi-matrix
  # export is not the max of independent peaks — shard buffers freed after `/X`
  # are not returned to the OS before the layer and raw are written. Attributing
  # the rest needs OPT-CONVERT-4 and an allocator-level look; it is not claimed
  # here.
  #
  # CEILINGS AT ~1.30x THE MEDIAN, rounded to a round number (3000 = 1.300x of
  # 2308.1; 9800 = 1.298x of 7547.2), not the 1.18x used elsewhere, and the looseness
  # is deliberate. The ceiling this replaces was set at 4096 from a capture whose
  # worst observation was 3347, and by the v0.16.0 capture the median had moved
  # to 3799.4 with a worst of 3846.6 — 6.5% of headroom left, i.e. it was about
  # to fail for no reason but cross-capture drift. That drift has been measured
  # at 15-22% on this metric across three captures. A tight ceiling here buys
  # nothing: what it guards against is a regression to a materialising raw,
  # which is +68% at tabula and +166% at census and clears any of these numbers
  # by a wide margin.
  - benchmark: export_streaming
    format: scx_streaming_vs_materialize
    dataset: tabula_sapiens_100k
    metric: streaming_full_peak_rss_mb
    max: 3000.0

  # census_1m, same arm. Deferred item 13 asked for this row once
  # `census_1m_full.scx` existed; it was built during the v0.16.0 capture and
  # the arm has produced rows since, unfloored. 7547.2 x 1.30 = 9811.
  - benchmark: export_streaming
    format: scx_streaming_vs_materialize
    dataset: census_1m
    metric: streaming_full_peak_rss_mb
    max: 9800.0

  # ─── compact of a file that HAS obsm and a layer ──────────────────
  #
  # The rewrite-side twin of the ceiling above, and it covers a different set of
  # sections. `scx-ops`' carry table (`carry.rs::compact`) is explicit: under
  # `compact`, `X | Layer | Obsm | ObsMetadata` are `RowFiltered` — carried —
  # while `Raw` is `Dropped { warns: true }` ("raw's obs axis is not filtered in
  # lockstep with X"). So this arm measures the **layer and obsm** copies, and
  # the fixture's `.raw` contributes a read and a warning, not a resident copy.
  #
  # `fragment_ops`' plain `compact` arm runs on `<name>_auto.scx`, which has
  # neither a layer nor an obsm key, so it never reaches either path.
  #
  # Measured on tabula_sapiens_100k, three runs each, two independent captures:
  # the first calling `_time_op` directly on the undirtied `_auto.scx`, the
  # second through `run()` as the orchestrator does (where the plain `compact`
  # arm works on a base+append+delete file, hence its higher number — that one
  # is the real arm).
  #
  #                        capture 1 (peaks, MB)      capture 2 (peaks, MB)
  #   plain compact            1281 / 1285 / 1294       1537 / 1538 / 1541
  #   `compact_full`           3054 / 3079 / 3185       3088 / 3201 / 3371
  #
  # Sizes: `_auto.scx` 222.7 MiB in -> 204.6 MiB out; `_full.scx` 612.6 MiB in
  # -> 413.8 MiB out. The output is *smaller* than a 2.75x input would suggest
  # precisely because raw is dropped.
  #
  # The ~1.6 GB delta is dominated by the `counts` layer — a second X-sized
  # matrix, 194,891,401 nnz x 8 B = 1487 MB — plus obsm at 19.8 MB, with the
  # remainder in re-encode buffers.
  #
  # Ceiling at 4096 MB, 21% over the worst single observation (3371), matching
  # the export ceiling's construction.
  - benchmark: fragment_ops
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: peak_rss_mb__compact_full
    max: 4096.0

  # ─── Bounded row gather: `handle[mask]` peak (PR C / REC-1) ───────
  #
  # `read_selective`'s `row_mask_gather` arm reads every eighth cell through
  # `to_anndata(backed=True).X[cell_indices]` — an interleaved index set that
  # touches every shard, i.e. the gather arc-reactor's guide calling runs. It
  # is the arm that sees `BackedCsrReader::read_row_indices`' memory shape:
  # before PR C the gather built one CSR per requested row and concatenated
  # them (a second copy of the result on top of the LRU); now the result is
  # assembled once into exact-size buffers, and a sparse request on a
  # row-group-framed shard decodes only the touched row groups.
  #
  # The metric is the sparse `peak_rss_mb__row_mask_gather` — a true in-region
  # peak from `PeakRssSampler` — not the reserved `peak_rss_mb`, which is the
  # runner's `max(before, after)` of two instantaneous readings and cannot see
  # a transient the read frees before returning (on this arm it reads 773 MB
  # at tabula_sapiens_100k against a sampled 1403 MB).
  #
  # Measured 2026-09-03 with the PR C reader, `scx_auto`, cpu_preemptible,
  # n_runs = 3 per arm:
  #
  #                          true peak (MB)          cells gathered
  #   tabula_sapiens_100k    1399 / 1399 / 1403      12,500 of 100,000
  #   census_500k            2958 / 2958 / 2961      62,500 of 500,000
  #
  # Ceilings at 21% over the worst single observation, matching the export and
  # `compact_full` ceilings' construction. A return to the per-row CSR shape
  # adds roughly the result again: ≈ +900 MB at census_500k, which trips that
  # ceiling by a wide margin, but only ≈ +200 MB at tabula_sapiens_100k
  # (≈ 1600 MB), which stays under 1700 — the tabula row is a drift guard on
  # the same construction as its siblings, not the regression detector; the
  # census_500k row is. Lowering tabula below 1600 would leave ~10 % headroom
  # over three observations spread 4 MB apart; do that only from a capture of
  # the regressed shape, not from this estimate.
  - benchmark: read_selective
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: peak_rss_mb__row_mask_gather
    max: 1700.0
  - benchmark: read_selective
    format: scx_auto
    dataset: census_500k
    metric: peak_rss_mb__row_mask_gather
    max: 3600.0

  # ─── MatrixMarket export declares `integer`, not `real` ───────────
  #
  # A contract, not a statistic, and the only one in this file that guards a
  # *header field*. `scx-mtx/src/write.rs` decides the declared type from the
  # materialised f32 values:
  #
  #   let all_integer = data.iter()
  #       .all(|&v| v == v.floor() && v.is_finite() && v >= 0.0);
  #   let type_str = if all_integer { "integer" } else { "real" };
  #
  # and formats the body with the same flag (`val as i64` vs the float). So a
  # file of integral counts writes `integer` and `1`, which is what downstream
  # readers expect.
  #
  # The regression this exists to catch: deriving that flag from the shard's
  # *value encoding* instead of from the values. An h5ad-sourced file holds
  # integral counts in a `Float32`-encoded shard — the normal case — so that
  # change would silently flip every such file to `real`. It is the obvious
  # thing to reach for when making the export streaming, because the values are
  # exactly what a streaming writer no longer has all of at once.
  #
  # Measured on pbmc3k: header
  # `%%MatrixMarket matrix coordinate integer general`, values float32 with
  # min 1.0 / max 419.0 and every one integral.
  #
  # `mtx_values_all_integral` is the premise, floored beside it: a header check
  # on a matrix that is *not* integral would pass for the wrong reason, so a
  # fixture that stops being integral has to fail here rather than quietly
  # turn the gate above vacuous.
  #
  # **The pair was shown to discriminate, not merely to read 1.0.** Running the
  # same arm on `pbmc3k_lognorm` — the log-normalised sibling, same shape and
  # same 2,286,884 non-zeros — produces
  # `%%MatrixMarket matrix coordinate real general` and drives *both* metrics to
  # 0.0. So an `integer` header is a claim the export re-derives per file, and a
  # regression that hard-coded either answer would show here.
  #
  # That is also why these rows name `pbmc3k` and not the dataset glob:
  # `pbmc3k_lognorm` legitimately reports 0.0 and would fail a `min: 1.0` row.
  # It is outside every tier so no default capture reaches it, but an explicit
  # `--datasets pbmc3k_lognorm` would.
  #
  # Only pbmc3k for now. tabula_sapiens_100k also runs this benchmark and emits
  # both metrics, but nothing has confirmed its values are integral yet — add
  # its two rows once a capture reports `mtx_values_all_integral: 1.0` there,
  # and not before.
  - benchmark: mtx_export
    format: scx_auto
    dataset: pbmc3k
    metric: mtx_header_integer
    min: 1.0
  - benchmark: mtx_export
    format: scx_auto
    dataset: pbmc3k
    metric: mtx_values_all_integral
    min: 1.0

