#     3-category control).
#
#     Prescribed `soma_joinid` would have measured nothing: it is `int64` on
#     census_1m, so it takes `obs_to_pydict`'s numpy branch and builds no
#     dictionary at all. High cardinality, cheap path.
#
#     MEASURED THROUGH THE ARM, census_1m, 2 runs of a full 977-batch epoch
#     (SLURM job 2891005, warm):
#         raw_obs_lowcard   ("sex", 3 categories)             4.2 batches/s
#         raw_obs_highcard  ("observation_joinid", 957,955)   4.1 batches/s
#         obs_highcard_overhead_ms_per_batch                  7.86
#         obs_highcard_slowdown_vs_lowcard                    1.033
#
#     ** That is ~14x SMALLER than this entry first claimed, and the earlier
#     number should not be used. ** A standalone 40-batch cold probe reported
#     +109 ms/batch (1.15 -> 1.02 batches/s), which happened to agree with the
#     review doc's estimate of 60-120 ms/batch; neither survives a full epoch.
#     40 batches cannot separate a one-off construction cost from a per-batch
#     one — the constructor alone was 8.3-8.8 s in that probe.
#
#     The mechanism is real and confirmed live: a batch's
#     `obs["observation_joinid"]` arrives as `{codes, categories}` with
#     **957,955 categories**, and `categories is previous_batch_categories` is
#     False — the list is rebuilt every batch, uncached, exactly as
#     OPT-LOADER-6 describes.
#
#     *** CORRECTED 2026-09-02, AND THE CONCLUSION REVERSES. ***
#     Every number above was measured against a DEBUG pyscx `.so`. The in-tree
#     editable build was a debug artifact from 08-31 until it was rebuilt
#     `--release` at 12:13 on 09-02; the targeted job that produced them ran at
#     09:23, before that. `run_parallel` refuses to start on a debug build for
#     exactly this reason, but a script that calls the benchmark functions
#     directly bypasses the guard. Re-measured through the real capture
#     (release, warm, census_1m, 977 batches, 3 runs):
#
#       scenario            batches/s     ms/batch
#       raw (no obs)           51.70        19.34
#       raw_obs_lowcard        47.40        21.10   ("sex", 3 categories)
#       raw_obs_highcard       26.80        37.31   (957,955 categories)
#
#     The overhead is **16.2 ms/batch**, not 7.9, and the slowdown is
#     **1.77x**, not 1.033x. On a debug build every path is 4-10x slower, so a
#     constant per-batch cost is swamped and reads as noise; on release it
#     dominates. So the earlier "~3% of an epoch, not the several-fold the
#     review predicted" is wrong in the direction that matters:
#     **OPT-LOADER-6 is worth ~1.77x on this path**, and the review's estimate
#     was closer than the correction that replaced it. Price it accordingly.
#
#     Take this as a general caution about every measurement in this file that
#     did not go through `run_parallel`.
#
#     The arm honours `cold_cache` (`drop_file_cache` before every timed epoch,
#     policy recorded as `cache_policy`); it did not at first, so a cold
#     campaign would have measured a warmed file and labelled it cold. The
#     figures above are `cache_policy = "warm"` — read that key before
#     comparing a capture against them.
#
#     Category counts are read off the file (`obs_categorical`) rather than
#     taken from the module's spec: `obs_n_categories` is the observed count
#     and `obs_n_categories_declared` the spec's, so a fixture reconvert shows
#     up as a divergence instead of silently invalidating the metric. The
#     preflight also *refuses* a column that is no longer a dictionary, which
#     is the case where the arm would run and measure nothing.
#
#     ACTIVATION:
#       1. `obs_highcard_overhead_ms_per_batch` is the metric to floor, NOT
