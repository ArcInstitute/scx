  # THE WALL CEILING — tabula_sapiens_100k ONLY, and that asymmetry is measured,
  # not an oversight.
  #
  # Sensitivity run (SLURM 2938504, one host, one job, both arms, identical
  # shard counts, `_run_accel_pca_backed_sensitivity.sh`):
  #
  #   dataset               main      branch   speedup   1.25x ceiling catches a revert?
  #   tabula_sapiens_100k   1.615 s   1.141 s   1.42x    YES  (ceiling 1.43 < main 1.615)
  #   census_500k           4.033 s   3.573 s   1.13x    NO   (ceiling 4.47 > main 4.033)
  #
  # So a census_500k wall ceiling at the house 1.25x would be a threshold that
  # cannot fire: reverting the change entirely leaves the arm comfortably under
  # it. Authoring one anyway would put a green check on an ungated path, which is
  # worse than no floor at all because it reads as coverage. Tightening it to
  # ~1.10x would fire, but 10% on a wall time is inside cross-node variation and
  # would flake. census_500k therefore carries the exact floors (shard count,
  # route) and no timing floor.
  #
  # Why census is LESS sensitive despite 4x the shards: the arm runs on the
  # runner's HVG-subset fixture (2,000 genes), so at 500k rows the SpMM and QR
  # dominate and the host-side means pass is a smaller share of the wall. The
  # 1.36-1.40x PR-12 measured was on the full gene axis, where it is not.
  #
  # 1.43 = 1.25x the branch median of 1.141 s. Re-derive after any recapture.
  - benchmark: accel_pca
    format: accel_pca__pyscx_gpu_backed
    dataset: tabula_sapiens_100k
    metric: pca_backed_wall_s
    max: 1.43
