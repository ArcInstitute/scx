  # otherwise, and keeps Pcodec on float — so its ratio is ≥ `scx_fast` (the
  # heuristic) and close to `scx_compact_trial_g512` (which adopts on any win;
  # the 5% margin can leave a few marginal-win shards on the heuristic, so
  # adaptive `auto` ≤ compact-trial in ratio by a small amount). These floors
  # reuse the (conservative, deterministic) compact-trial-g512 values as the
  # "no size regression" guard — the measured medians (e.g. pbmc10k 6.73,
