  # Grouped-write RSS ceilings (gross-regression guards only).
  # NOTE: `peak_rss_mb` is `current_rss_mb()` sampled *after* the op — the
  # residual resident set, NOT the transient parallel-gather high-water mark (the
  # A/B campaign measured true peak separately with `/usr/bin/time -v`:
  # chemogenetic ~18.7 GB, replogle ~6.3 GB, tahoe ~5.0 GB), and it is cumulative
  # across the benchmark's scenarios in one process. So this gate catches a
  # sustained blowup toward the historical 48–72 GB OOM regime, but will NOT catch
  # a spike-then-free peak; ceilings sit well above the residual to avoid flaky
  # failures. The Phase-1 parallel fast path trades peak RSS for speed, bounded to
  # O(concurrency × block cap) — RAYON_NUM_THREADS caps concurrency and the block
  # cap is clamped to --memory-budget. Wall time stays measured-not-gated
