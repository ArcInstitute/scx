  # --- index_plan throughput floors -----------------------------------
  # Floors set at 0.5x of the 1M-cell synthetic-fixture medians
  # captured on
  # vci-steady-state-node-020 (Lambda HPC, --cpus-per-task=16
  # --mem=64G, --partition=standard). 1M x 2K x 5% density x HVG=2000 x
  # 1024 pairs/batch x 1000 batches. Source JSONs:
  #   benchmarks/comprehensive/results/index_plan_phase7/index_plan_1m_*.json
  # The locality scenario is gated; the random scenario is informational
  # only (a target estimate, not a regression gate, per spec). The
  # training_dataset ceiling is gated to catch upstream regressions in
  # the sequential pipeline that would otherwise leave index_plan looking
  # healthy.
  #
  # Smaller-dataset floors derived by scaling: pbmc3k (~3K cells) and
  # tabula_sapiens_100k (~100K cells) shouldn't see worse cps than the
  # 1M result × 0.5 safety margin, since smaller fixtures fit in cache
  # better and don't exercise shard-decode misses.
  - benchmark: index_plan
    format: scx_auto
    dataset: pbmc3k
    metric: batches_per_sec__pyscx_index_plan_locality
    min: 5.0
  - benchmark: index_plan
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__pyscx_index_plan_locality
    min: 12.0
  - benchmark: index_plan
    format: scx_auto
    dataset: tabula_sapiens_100k
    metric: batches_per_sec__pyscx_training_dataset
    min: 23.0
  # 1M synthetic floors at 0.5x observed median (9.81 / 36.62 → 4.9 / 18.3).
  # Note: census_1m may use a different fixture than the synthetic 1M one,
  # so this floor is conservative. Drop or re-tune if the dataset
  # mismatch causes spurious failures.
  - benchmark: index_plan
    format: scx_auto
    dataset: census_1m
    metric: batches_per_sec__pyscx_index_plan_locality
    min: 4.9
  - benchmark: index_plan
    format: scx_auto
    dataset: census_1m
    metric: batches_per_sec__pyscx_training_dataset
    min: 18.3

  # ----- multimodal_compression (Phase K) -------------------------
  # Absolute floors on the SCX multimodal output, derived from the
  # 2026-05-08 SLURM run on real 10x public CITE-seq + Multiome
  # fixtures. ``output_size_bytes`` is gated as a 1.4× ceiling
  # (a 40% on-disk inflation is a codec or modality-routing
  # regression); ``compression_ratio_vs_h5mu`` floors keep SCX
  # from drifting below ~70% of the measured advantage over
  # uncompressed h5mu.
  #
  # Measured CITE-seq (5247 cells, 33538 RNA + 32 ADT):
  #   SCX per-modality: 15.8 MB, 5.25× vs h5mu raw.
  # Measured Multiome (11898 cells, 36601 RNA + 143887 ATAC):
  #   SCX per-modality: 238.3 MB, 4.56× vs h5mu raw.
  - benchmark: multimodal_compression
    format: scx_multimodal_per_modality_auto
    dataset: cite_seq_pbmc_5k
    metric: output_size_bytes
    max: 22000000   # 22 MB ≈ 1.4× measured 15.8 MB
  - benchmark: multimodal_compression
    format: scx_multimodal_per_modality_auto
    dataset: multiome_pbmc_10k
    metric: output_size_bytes
    max: 335000000  # 335 MB ≈ 1.4× measured 238 MB
  - benchmark: multimodal_compression
    format: scx_multimodal_per_modality_auto
    dataset: cite_seq_pbmc_5k
    metric: compression_ratio_vs_h5mu
    min: 3.5         # ~70% of measured 5.25×
  - benchmark: multimodal_compression
    format: scx_multimodal_per_modality_auto
    dataset: multiome_pbmc_10k
    metric: compression_ratio_vs_h5mu
    min: 3.0         # ~70% of measured 4.56×

  # ----- multimodal_training (Phase K) ----------------------------
  # MultimodalTrainingDataset throughput + time-to-first-batch
  # floors. SCX should hit at least ~50% of measured batches/s and
  # TTFB no worse than ~2× measured. 50% / 2× is wider than the
  # ml_loader floors because the multimodal loader handles two
  # streams in parallel and is more sensitive to per-modality codec
  # choice than the single-stream `ml_loader`.
  #
  # Measured CITE-seq SCX per-modality: 570 batches/s, 0.079 s TTFB.
  # Measured Multiome SCX per-modality: 24 batches/s, 1.84 s TTFB.
  - benchmark: multimodal_training
    format: scx_multimodal_per_modality_auto
    dataset: cite_seq_pbmc_5k
    metric: batches_per_sec
    min: 285         # 0.5× measured 570
  - benchmark: multimodal_training
    format: scx_multimodal_per_modality_auto
    dataset: cite_seq_pbmc_5k
    metric: time_to_first_batch_s
    max: 0.2         # ~2.5× measured 0.079s; absorbs cold-cache jitter
  - benchmark: multimodal_training
    format: scx_multimodal_per_modality_auto
    dataset: multiome_pbmc_10k
