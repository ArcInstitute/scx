  # --- ml_loader throughput floors -----------------------------------
  # SCX own-throughput floors: min = 0.85 × the min-observed run for
  # that scenario (~15% noise headroom). Competitor floors (shardad,
  # cellstream, tiledb_soma, h5ad_*): min = 0.5 × median.
  # Per-scenario keys (batches_per_sec__<scenario>) are emitted only
  # on that scenario's runs, so the gate's median is over scenario-
  # coherent runs (not aliased across raw/hvg/norm/hvg_norm).
  #
  # PROFILE FLIP (auto→adaptive, 2026-07-12): `scx_auto` is now the
  # cost-aware adaptive profile (predominantly ShufDeltaZstd), and the
  # decode-speed-max heuristic (the pre-flip `auto` = Scx1) moved to
  # `scx_fast`. So the decode-max throughput floors below are keyed to
  # `scx_fast` (their numbers were measured on the old `auto` = the
  # identical heuristic single-encode), and `scx_auto` carries the
  # adaptive floors (measured on the old `auto_v2`, a conservative lower
  # bound — the margin rule adopts ≤ auto_v2's shufdelta, so adaptive
  # `auto` decodes no slower). PROVISIONAL pending the P4.3 recapture,
  # which re-derives exact adaptive floors for every dataset.
  #
  # Recalibrated 2026-07-12 from the v0.11.0-cellstream-recapture
  # Chimera capture (results/baseline_2026_07_10).
  # Headline claim ("82x vs TileDB-SOMA-ML, ~340x vs SLAFDataLoader")
  # is in docs/performance.md; these floors protect it at each tier.
  #
  # GPU utilization (avg_gpu_util_pct__gpu_train) is intentionally
  # NOT gated yet — `nvidia-smi dmon` polls at 1 Hz but pbmc3k epochs
  # finish in ~0.15s and tabula_sapiens_100k epochs in ~0.8s, so the
  # samples miss peak compute. Throughput is reliable; util% needs an
  # in-process sampler before it can be a floor.
  #
  # scx_fast (decode-speed-max; the pre-flip `auto` heuristic) — carries
  # the decode-max throughput floors across all measured tiers.
  #
  # `batches_per_sec__raw` RE-DERIVED 2026-09-03 on pbmc3k and
  # tabula_sapiens_100k. Both were `min: 29.0`, a single value applied to two
  # datasets, and the Deferred block flagged the whole scx_fast group as
  # PROVISIONAL — "transplanted from pre-flip numbers … tighten to the captured
  # medians on the recapture, min = 0.85x the measured min run". Done, with the
  # per-dataset spread that a shared 29.0 could not express:
  #
  #     dataset               runs                          min    0.85x min
  #     pbmc3k                20.2 21.0 21.1 21.4 22.1     20.2      17.17
  #     tabula_sapiens_100k   28.4 28.8 29.0               28.4      24.14
  #
  # pbmc3k was violating at 21.1 against 29.0 — a 27% shortfall that is not a
  # regression but a floor borrowed from a different dataset. tabula was
  # violating by 0.7% (28.8 vs 29.0), i.e. the shared value happened to sit
  # inside tabula's own noise band, which is why one number for two datasets
  # read as plausible for as long as it did.
  #
  # The other tiers are NOT re-derived here and keep their provisional values;
  # they pass, and re-deriving a passing floor is the broader Deferred item 5
  # work (which also wants the missing adaptive `scx_auto` rows authored).
  - benchmark: ml_loader
    format: scx_fast
    dataset: pbmc3k
    metric: batches_per_sec__raw
    min: 17.17
