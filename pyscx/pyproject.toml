[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyscx"
version = "0.2.1"
description = "Python bindings for SCX (Sparse Cell eXpression System)"
license = {text = "MIT"}
authors = [
    {name = "Nick Youngblut", email = "nick.youngblut@arcinstitute.org"}
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pyarrow",
    "anndata",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "scanpy",
    "python-dotenv",
]
eval = [
    "polars",
]
scvi = [
    "scvi-tools",
]
# Multimodal h5mu / MuData round-trip via `pyscx.from_mudata` /
# `PyExperiment.to_mudata`. Optional — the rest of pyscx works
# without it; only the multimodal API requires `mudata`.
mudata = [
    "mudata>=0.2,<1.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
