[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyscx"
version = "0.6.2"
description = "Python bindings for SCX (Sparse Cell eXpression System)"
license = {text = "MIT"}
authors = [
    {name = "Nick Youngblut", email = "nick.youngblut@arcinstitute.org"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "pyarrow>=14,<24",
    "anndata>=0.11,<0.13",
    "patchelf>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scanpy>=1.10",
    "python-dotenv",
    # `maturin[patchelf]` bundles the `patchelf` binary so `maturin develop`
    # can set the libpyscx rpath. Without it `maturin develop` prints a
    # non-fatal "Failed to set rpath" warning on every build. (F5 from
    # SCX-USER-REPORT-2026-05-21-Tier3.md.)
    "maturin[patchelf]>=1.0,<2.0",
]
eval = [
    "polars>=1.0",
]
scvi = [
    "scvi-tools",
]
# Multimodal h5mu / MuData round-trip via `pyscx.from_mudata` /
# `PyExperiment.to_mudata`. Optional — the rest of pyscx works
# without it; only the multimodal API requires `mudata`.
mudata = [
    "mudata>=0.2,<1.0",
]
gpu = [
    "cupy-cuda12x>=12.0; platform_system=='Linux'",
]
cloud = [
    "boto3>=1.28",
    "google-cloud-storage>=2.0",
    "azure-storage-blob>=12.0",
]
# 10x Genomics ingestion via `pyscx.from_10x`. Pulls in scanpy for its
# `read_10x_h5` reader. Optional — only required if calling `from_10x`.
"10x" = [
    "scanpy>=1.10",
]

# `hdf5` is included by default so a bare
# `maturin develop` produces a working venv where `pyscx.from_h5ad`
# is callable. Opt out with `maturin develop --no-default-features
# --features pyo3/extension-module` when libhdf5 is unavailable;
# `pyscx/__init__.py` gates the wrapper imports so `import pyscx`
# still succeeds in that mode.
[tool.maturin]
features = ["pyo3/extension-module", "hdf5"]
python-source = "python"
include = [{ path = "python/pyscx/py.typed", format = "sdist" }]
