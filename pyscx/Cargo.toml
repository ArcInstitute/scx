[package]
name = "pyscx"
version = "0.15.0"
edition = "2021"
description = "Python bindings for SCX via PyO3"
license.workspace = true
authors.workspace = true

[lib]
name = "pyscx"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
numpy = { workspace = true }
arrow = { workspace = true }
scx-format-io = { path = "../scx-format-io" }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
half = { workspace = true }
scx-loader = { path = "../scx-loader", features = ["python"] }
scx-engine = { path = "../scx-engine" }
scx-mtx = { path = "../scx-mtx" }
scx-ops = { path = "../scx-ops" }
scx-accel = { path = "../scx-accel" }
scx-convert = { path = "../scx-convert" }
scx-cloud = { path = "../scx-cloud", optional = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true }
base64 = { workspace = true }
byteorder = { workspace = true }
rayon = { workspace = true }
blake3 = { workspace = true }
log = { workspace = true }
pyo3-log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# `hdf5` gates `pyscx.from_h5ad` and the backed-AnnData auto-routing in
# `pyscx.from_anndata`. Both reach into `scx_convert::h5ad_to_scx_streaming`,
# which requires libhdf5 at build time. Without this feature the
# bindings still build (CPU-only CI lane), but backed AnnDatas raise
# `NotImplementedError` directing the caller to rebuild with
# `maturin develop --features hdf5`.
hdf5 = ["scx-convert/hdf5"]
# Bundles libhdf5 + zlib statically — mirrors scx-cli's hdf5-static
# feature. Used by `maturin build --features hdf5-static` so wheel
# builds don't depend on a system libhdf5.
hdf5-static = ["hdf5", "scx-convert/hdf5-static"]
cloud = ["scx-cloud", "tokio"]
gpu = ["scx-accel/gpu"]
