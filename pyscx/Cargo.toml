[package]
name = "pyscx"
version = "0.3.2"
edition = "2021"
description = "Python bindings for SCX via PyO3"
license.workspace = true
authors.workspace = true

[lib]
name = "pyscx"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
numpy = { workspace = true }
arrow = { workspace = true }
scx-format = { path = "../scx-format" }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
scx-loader = { path = "../scx-loader", features = ["python"] }
scx-engine = { path = "../scx-engine" }
scx-mtx = { path = "../scx-mtx" }
scx-ops = { path = "../scx-ops" }
scx-accel = { path = "../scx-accel" }
scx-cloud = { path = "../scx-cloud", optional = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true }
base64 = { workspace = true }
byteorder = { workspace = true }
rayon = { workspace = true }
blake3 = { workspace = true }
log = { workspace = true }
pyo3-log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
cloud = ["scx-cloud", "tokio"]
gpu = ["scx-accel/gpu"]
