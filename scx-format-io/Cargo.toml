[package]
name = "scx-format-io"
version = "0.20.0"
edition = "2021"
description = "Runtime reader/writer, backed/streaming access, and shard codec dispatch for the SCX format"
license.workspace = true
authors.workspace = true

[features]
default = ["parallel", "deletion-vectors"]
# `parallel` covers both the rayon-backed decode helpers and the bounded ordered
# decode-prefetch pipeline in `prefetch.rs` (which needs a bounded MPSC channel
# on top of the pool). Without it every prefetch front-end still exists and
# falls back to a plain sequential loop. It also turns on `scx-sparse/parallel`,
# which routes a CSC sidecar build's pushes across the builder's buckets in
# parallel.
parallel = ["rayon", "crossbeam-channel", "scx-sparse/parallel"]
deletion-vectors = ["roaring"]
# Opt-in seams that exist only so a *downstream* crate's tests can establish a
# premise it otherwise cannot: `BackedCsrReader::set_decode_barrier` lets
# `scx-loader` hold a shard in the singleflight in-flight table deterministically
# instead of racing a sleep against a decode. Never enable it in a shipped build
# — nothing under this feature is part of the public contract.
test-hooks = []

[dependencies]
rayon = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
blake3 = { workspace = true }
arrow = { workspace = true }
memmap2 = { workspace = true }
thiserror = { workspace = true }
byteorder = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
roaring = { workspace = true, optional = true }
half = { workspace = true }
scx-format = { path = "../scx-format" }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
lru = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = { workspace = true }
# `benches/encode_bench.rs` only. Same pin `scx-codec` uses for `codec_bench`.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "encode_bench"
harness = false
