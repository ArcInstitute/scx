[package]
name = "scx-format-io"
version = "0.15.0"
edition = "2021"
description = "Runtime reader/writer, backed/streaming access, and shard codec dispatch for the SCX format"
license.workspace = true
authors.workspace = true

[features]
default = ["parallel", "deletion-vectors"]
# `parallel` covers both the rayon-backed decode helpers and the bounded ordered
# decode-prefetch pipeline in `prefetch.rs` (which needs a bounded MPSC channel
# on top of the pool). Without it every prefetch front-end still exists and
# falls back to a plain sequential loop.
parallel = ["rayon", "crossbeam-channel"]
deletion-vectors = ["roaring"]

[dependencies]
rayon = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
blake3 = { workspace = true }
arrow = { workspace = true }
memmap2 = { workspace = true }
thiserror = { workspace = true }
byteorder = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
roaring = { workspace = true, optional = true }
half = { workspace = true }
scx-format = { path = "../scx-format" }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
lru = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = { workspace = true }
