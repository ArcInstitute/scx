[workspace]
members = ["scx-format", "scx-format-io", "scx-codec", "scx-sparse", "scx-cli", "scx-convert", "scx-ops", "scx-engine", "scx-loader", "scx-cloud", "scx-gpu", "scx-mtx", "scx-accel", "scx-testkit", "pyscx", "rscx", "tests/scx-integration-tests"]
# rscx excluded from default-members: requires R toolchain + extendr, not always
# available (CI, Rust-only dev). Build explicitly with: cargo build -p rscx
#
# scx-gpu is deliberately included: cudarc compiles without CUDA installed
# (it only fails at runtime when no GPU is present). Its GPU tests are
# `#[ignore]`d and gated by require_gpu!(), so a CPU-only run reports them as
# ignored instead of as passes; `scx-gpu/tests/gpu_test_gating.rs` enforces the
# pairing. The CI `build-cpu-only` job pins the compile half of this contract.
default-members = ["scx-format", "scx-format-io", "scx-codec", "scx-sparse", "scx-cli", "scx-convert", "scx-ops", "scx-engine", "scx-loader", "scx-cloud", "scx-gpu", "scx-mtx", "scx-accel", "scx-testkit", "pyscx", "tests/scx-integration-tests"]
resolver = "2"

# Keep overflow checks on for the codec crate even in release/bench. Decode is
# not arithmetic-bound, so the cost is negligible, and it turns every latent
# integer wrap on a corrupt/hostile shard into a hard panic-under-test rather
# than silent corruption (pairs with the checked_shl/checked_add + MAX_RICE_K
# parse-boundary guards in delta_golomb/rice). Per-package overrides must live
# at the workspace root; a [profile.*] block in scx-codec/Cargo.toml is ignored.
# Thin LTO across the workspace: a small, free win for the compiled gather /
# collation hot path now that Rust collation (sparse_cellset_collate) runs on
# the per-batch training critical path of the sparse cell-set loader.
[profile.release]
lto = "thin"

[profile.release.package.scx-codec]
overflow-checks = true

[profile.bench.package.scx-codec]
overflow-checks = true

# scx-sparse gets the same treatment, and for the same reason: it is the other
# crate that turns decoded — therefore unauthenticated — shard bytes into
# structures whose arithmetic assumes an invariant the read path does not check.
# Concretely, a statistic that infers an implicit-zero count as `extent - nnz`
# inverts those operands on a duplicated coordinate: in release that wrapped to
# ~1.8e19 and was returned as a variance of 8.3e19. Those sites now go through
# `scx_sparse::implicit_zero_count`, so this override is a backstop for the
# *next* one, not the fix. (Note it covers this crate only — the same class of
# subtraction lives in `scx-accel`'s CSC Wilcoxon kernel and had to be guarded
# explicitly there.)
#
# It also covers a second family that is still unguarded: the `end - start` row
# spans derived from `indptr`, whose monotonicity `ScxCsr::new_unchecked` only
# `debug_assert!`s. A non-monotonic indptr from a corrupt file now panics here
# instead of wrapping into a giant slice range.
#
# ⚠️ Unlike the codec's, this override is NOT free, and the number is measured
# rather than assumed. `cargo bench -p scx-sparse --bench transpose_bench`
# (50k x 5k, the crate's hottest loop and what `scx build-csc` runs), before vs
# after, confirmed stable over a repeat run:
#
#   new_scatter   815.09 µs -> 838.69 µs   (+2.9%)
#   old_sort      5.2290 ms -> 5.3329 ms   (+2.0%)
#
# That is the price of the backstop, on this path only. It is accepted here
# deliberately: `scx build-csc` is a one-off per file, whereas a wrapped count
# read back as a variance is silent and permanent. If that trade ever stops
# being worth it, deleting these four lines is the whole reversal — the six
# sites the wrap actually reached are explicitly checked and stay checked.
[profile.release.package.scx-sparse]
overflow-checks = true

[profile.bench.package.scx-sparse]
overflow-checks = true

[workspace.package]
license = "MIT"
authors = ["Nick Youngblut <nick.youngblut@arcinstitute.org>"]

[workspace.dependencies]
# Core
blake3 = "1"
arrow = { version = "58", features = ["ipc"] }
zstd = "0.13"
memmap2 = "0.9"
thiserror = "2"
byteorder = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
tempfile = "3"
ndarray = "0.16"
rayon = "1"
crossbeam-channel = "0.5"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
faer = "0.24"
libloading = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "io-util"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# HDF5 — `hdf5` on crates.io is frozen at 0.8.1 (the original
# `aldanor/hdf5-rust` repo went unmaintained). The active 0.9.x line
# lives at `hdf5-metno` (metno fork). Renamed via Cargo's
# `package = …` so consumer source `use hdf5::…` is unchanged.
# 0.9.0 fixed the `H5Pget_fapl_direct` feature-gate mismatch that
# blocked builds against conda-forge `hdf5=1.12.*=nompi*`. Only used
# for h5ad conversion; fallback path is a Python subprocess via h5py.
# `f16` enables the `H5Type` impl for `half::f16` so the converter can
# upcast float16 obsm/varm/X/columns to f32 instead of aborting.
hdf5 = { package = "hdf5-metno", version = "0.9.4", features = ["f16"] }

half = "2"
base64 = "0.22"
lz4_flex = "0.11"
pco = "1"
bitpacking = "0.9"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
roaring = "0.10"
lru = "0.12"
object_store = { version = "0.12", features = ["gcp", "aws", "azure"] }
url = "2"
bytes = "1"
futures = "0.3"
fs4 = "0.12"

# GPU
cudarc = { version = "0.19", features = ["cuda-12020"] }

# Testing
proptest = "1"

# Logging — structured logging across library crates. `log` is the
# facade; consumers wire up sinks (env_logger for CLI, pyo3-log for
# Python).
log = "0.4"
env_logger = "0.11"
pyo3-log = "0.13"

# Tracing for deadlock diagnostics in the loader pipeline.
# Off by default; enable via `RUST_LOG=trace` with a subscriber wired up.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# `scx-loader/tests/test_fork_deadlock.rs` only.
nix = { version = "0.29", features = ["process", "signal"] }

# Sizing the per-pipeline rayon pool.
num_cpus = "1"

# Python bindings
pyo3 = { version = "0.28", features = ["extension-module"] }
# `half` feature: native f16 numpy arrays for F3 dtype materialization.
numpy = { version = "0.28", features = ["half"] }
