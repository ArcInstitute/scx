[workspace]
members = ["scx-format", "scx-codec", "scx-sparse", "scx-cli", "scx-ops", "scx-engine", "scx-loader", "scx-cloud", "scx-mtx", "pyscx", "rscx"]
resolver = "2"

[workspace.package]
license = "MIT"
authors = ["Nick Youngblut <nick.youngblut@arcinstitute.org>"]

[workspace.dependencies]
# Core
blake3 = "1"
arrow = { version = "58", features = ["ipc"] }
zstd = "0.13"
memmap2 = "0.9"
thiserror = "2"
byteorder = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ndarray = "0.15"
rayon = "1"
crossbeam-channel = "0.5"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "io-util"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# HDF5 — see Phase1.md note on crate risk
hdf5 = "0.8"

half = "2"
roaring = "0.10"
object_store = { version = "0.12", features = ["gcp", "aws", "azure"] }
url = "2"
bytes = "1"
futures = "0.3"
fs4 = "0.12"

# Testing
proptest = "1"

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
