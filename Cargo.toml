[workspace]
members = ["scx-format", "scx-codec", "scx-sparse", "scx-cli", "scx-ops", "scx-engine", "scx-loader", "scx-cloud", "scx-gpu", "scx-mtx", "scx-accel", "pyscx", "rscx", "tests/scx-integration-tests"]
# rscx excluded from default-members: requires R toolchain + extendr, not always
# available (CI, Rust-only dev). Build explicitly with: cargo build -p rscx
#
# scx-gpu is deliberately included: cudarc compiles without CUDA installed
# (it only fails at runtime when no GPU is present). GPU tests gracefully
# skip via require_gpu!(). The CI `build-cpu-only` job pins this contract.
default-members = ["scx-format", "scx-codec", "scx-sparse", "scx-cli", "scx-ops", "scx-engine", "scx-loader", "scx-cloud", "scx-gpu", "scx-mtx", "scx-accel", "pyscx", "tests/scx-integration-tests"]
resolver = "2"

[workspace.package]
license = "MIT"
authors = ["Nick Youngblut <nick.youngblut@arcinstitute.org>"]

[workspace.dependencies]
# Core
blake3 = "1"
arrow = { version = "58", features = ["ipc"] }
zstd = "0.13"
memmap2 = "0.9"
thiserror = "2"
byteorder = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ndarray = "0.15"
rayon = "1"
crossbeam-channel = "0.5"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
faer = "0.24"
libloading = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "io-util"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# HDF5 — `hdf5-rust` is unmaintained upstream; only used for h5ad
# conversion. Fallback path is a Python subprocess via h5py.
hdf5 = "0.8"

half = "2"
base64 = "0.22"
lz4_flex = "0.11"
pco = "1"
bitpacking = "0.9"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
roaring = "0.10"
lru = "0.12"
object_store = { version = "0.12", features = ["gcp", "aws", "azure"] }
url = "2"
bytes = "1"
futures = "0.3"
fs4 = "0.12"

# GPU
cudarc = { version = "0.19", features = ["cuda-12020"] }

# Testing
proptest = "1"

# Logging — structured logging across library crates. `log` is the
# facade; consumers wire up sinks (env_logger for CLI, pyo3-log for
# Python).
log = "0.4"
env_logger = "0.11"
pyo3-log = "0.12"

# Tracing for deadlock diagnostics in the loader pipeline.
# Off by default; enable via `RUST_LOG=trace` with a subscriber wired up.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# `scx-loader/tests/test_fork_deadlock.rs` only.
nix = { version = "0.29", features = ["process", "signal"] }

# Sizing the per-pipeline rayon pool.
num_cpus = "1"

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
