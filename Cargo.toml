[workspace]
members = ["scx-format", "scx-codec", "scx-sparse", "scx-cli", "pyscx"]
resolver = "2"

[workspace.package]
license = "MIT"
authors = ["Nick Youngblut <nick.youngblut@arcinstitute.org>"]

[workspace.dependencies]
# Core
blake3 = "1"
arrow = { version = "58", features = ["ipc"] }
zstd = "0.13"
memmap2 = "0.9"
thiserror = "2"
byteorder = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ndarray = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# HDF5 — see Phase1.md note on crate risk
hdf5 = "0.8"

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
