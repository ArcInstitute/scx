[package]
name = "scx-integration-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
scx-testkit = { path = "../../scx-testkit" }
scx-format-io = { path = "../../scx-format-io", features = ["deletion-vectors"] }
scx-codec = { path = "../../scx-codec" }
scx-ops = { path = "../../scx-ops" }
scx-engine = { path = "../../scx-engine" }
scx-sparse = { path = "../../scx-sparse" }
scx-accel = { path = "../../scx-accel" }
# Phase 4: the neighbourhood-plan reorder test needs both the plan builder
# (scx-loader) and the sort op (scx-ops), and this is the only crate with both.
scx-loader = { path = "../../scx-loader" }
scx-cloud = { path = "../../scx-cloud" }
roaring = { workspace = true }
rand = { workspace = true }
rand_chacha = "0.3"
tempfile = { workspace = true }
arrow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
