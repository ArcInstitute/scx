[package]
name = "scx-loader"
version = "0.17.0"
edition = "2021"
description = "ML training data loader for SCX files"
license.workspace = true
authors.workspace = true

[dependencies]
# `parallel` is a default feature, but it is named explicitly because the loader
# depends on it structurally: `BackedCsrReader::set_cpu_pool` — the fork guard
# that keeps a forked DataLoader worker off rayon's dead global registry — only
# exists under it. Without it here, a future `default-features = false` would
# surface as "no method named set_cpu_pool" rather than as a feature problem.
scx-format-io = { path = "../scx-format-io", features = [
    "deletion-vectors",
    "parallel",
] }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
# v4 PFlog α estimator (estimate_alpha) — used at loader construction when
# pflog_alpha=None. Cycle-free, but note it transitively pulls scx-engine (and
# faer/HNSW etc.) into the loader via scx-accel — see docs/architecture.md.
scx-accel = { path = "../scx-accel" }
# GPU training-loader decode (Phase D). Hard-cudarc crate — only builds with the
# CUDA toolchain, so gated behind the opt-in `gpu` feature (mirrors scx-accel).
scx-gpu = { path = "../scx-gpu", optional = true }
tokio = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
# Binomial sampler for the seeded count-downsample primitive (downsample.rs).
# Note rand_distr 0.4 has no multinomial — that path is sequential-conditional
# binomials, matching numpy's own scheme.
rand_distr = { workspace = true }
# Stable per-file identity for the downsample RNG key (blake3 truncated-64 of the
# canonical path), so a reordered manifest does not redraw every cell.
blake3 = { workspace = true }
arrow = { workspace = true }
roaring = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
num_cpus = { workspace = true }

[dependencies.pyo3]
workspace = true
optional = true

[dependencies.numpy]
workspace = true
optional = true

[features]
python = ["pyo3", "numpy"]
# Opt-in GPU training-loader decode (Phase D). Pulls in scx-gpu (CUDA toolchain
# required to build). The default CPU loader is untouched when this is off.
gpu = ["dep:scx-gpu"]

[dev-dependencies]
# Re-declared purely to turn on `test-hooks`, which gives the tests
# `BackedCsrReader::set_decode_barrier` — the only way to hold a shard in the
# singleflight in-flight table on purpose, and therefore the only way to pin
# `IterMetrics::prefetch_skipped_in_flight` with a predicate instead of a sleep.
# Cargo unifies this with the `[dependencies]` entry above, so the feature is on
# for `cargo test` and off for every shipped build.
scx-format-io = { path = "../scx-format-io", features = ["test-hooks"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
nix = { workspace = true }
tracing-subscriber = { workspace = true }
