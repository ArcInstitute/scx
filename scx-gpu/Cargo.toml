[package]
name = "scx-gpu"
version = "0.1.0"
edition = "2021"
description = "GPU-accelerated codec decoding, cuSPARSE interop, and GPUDirect Storage for SCX"
license.workspace = true
authors.workspace = true

[dependencies]
scx-format = { path = "../scx-format" }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
cudarc = { workspace = true, features = ["cusparse"] }
thiserror = { workspace = true }
byteorder = { workspace = true }

[features]
default = []
gds = []  # opt-in GDS support (requires nvidia-fs drivers)
