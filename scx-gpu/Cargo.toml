[package]
name = "scx-gpu"
version = "0.10.1"
edition = "2021"
description = "GPU-accelerated codec decoding, cuSPARSE interop, and GPUDirect Storage for SCX"
license.workspace = true
authors.workspace = true

[dependencies]
scx-format-io = { path = "../scx-format-io" }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
cudarc = { workspace = true, features = ["cublas", "cusparse", "cusolver", "curand"] }
faer = { workspace = true }
thiserror = { workspace = true }
byteorder = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libloading = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }

[features]
default = []
gds = []    # opt-in GDS support (requires nvidia-fs drivers)
bench = []  # enables test_utils for benchmark binaries

[[bin]]
name = "gpu_bench"
path = "src/bin/gpu_bench.rs"
required-features = ["bench"]
