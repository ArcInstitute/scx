[package]
name = "scx-accel"
version = "0.11.8"
edition = "2021"
description = "Rust-native analysis accelerators for SCX (PCA, kNN, etc.)"
license.workspace = true
authors.workspace = true

[features]
default = []
# GPU-accelerated variants (PCA, kNN, UMAP, Harmony) — require the CUDA
# toolkit at build time (for PTX compilation in scx-gpu) and a CUDA driver
# at runtime.
gpu = ["dep:scx-gpu"]

[dependencies]
scx-engine = { path = "../scx-engine" }
scx-format-io = { path = "../scx-format-io" }
scx-sparse = { path = "../scx-sparse" }
scx-gpu = { path = "../scx-gpu", optional = true }
faer = { workspace = true }
# `faer` re-exports `faer_traits::ComplexField` privately; depend on the crate
# directly to use it as a trait bound on the generic distance kernels.
faer-traits = "0.24"
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
instant-distance = "0.6"
num-traits = "0.2"
rayon = { workspace = true }
thread_local = "1.1"
libc = "0.2"
libm = "0.2"
log = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = { workspace = true }
# Test scaffolding for CSC kernels — `csc/test_helpers.rs` builds tiny
# SCX files via the lower-level writer API to exercise CSR/CSC parity.
scx-codec = { path = "../scx-codec" }
arrow = { workspace = true }

[[bench]]
name = "distances"
harness = false

[[bench]]
name = "covariance_pca"
harness = false

[[bench]]
name = "randomized_pca_inmemory"
harness = false

[[bench]]
name = "nb_glm"
harness = false

[[bench]]
name = "de_group_sums"
harness = false
