[package]
name = "scx-accel"
version = "0.1.0"
edition = "2021"
description = "Rust-native analysis accelerators for SCX (PCA, kNN, etc.)"
license.workspace = true
authors.workspace = true

[features]
default = []
# GPU-accelerated variants (PCA, kNN, UMAP, Harmony) — require the CUDA
# toolkit at build time (for PTX compilation in scx-gpu) and a CUDA driver
# at runtime.
gpu = ["dep:scx-gpu"]

[dependencies]
scx-engine = { path = "../scx-engine" }
scx-format = { path = "../scx-format" }
scx-sparse = { path = "../scx-sparse" }
scx-gpu = { path = "../scx-gpu", optional = true }
faer = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
instant-distance = "0.6"
rayon = { workspace = true }
thread_local = "1.1"
libc = "0.2"
libm = "0.2"
log = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
