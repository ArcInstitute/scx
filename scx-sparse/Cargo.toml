[package]
name = "scx-sparse"
version = "0.19.0"
edition = "2021"
description = "CSR sparse matrix operations for SCX"
license.workspace = true
authors.workspace = true

[features]
# Off by default: this crate sits under `scx-format`, the pure layout crate.
# `scx-format-io`'s own `parallel` feature turns it on, so every build that
# writes a CSC sidecar through `ScxWriter` gets it.
parallel = ["rayon"]

[dependencies]
rayon = { workspace = true, optional = true }
half = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
log = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "transpose_bench"
harness = false
