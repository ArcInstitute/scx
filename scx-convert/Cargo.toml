[package]
name = "scx-convert"
version = "0.3.0"
edition = "2021"
description = "External format <-> SCX conversion (h5ad, h5mu, MTX, 10x)"
license.workspace = true
authors.workspace = true

[features]
default = []
hdf5 = ["dep:hdf5", "dep:hdf5-sys", "dep:libz-sys", "dep:ndarray"]
# Bundles libhdf5 + zlib statically — mirrors scx-cli's hdf5-static feature.
hdf5-static = ["hdf5", "hdf5-sys/static", "hdf5-sys/zlib", "libz-sys/static"]

[dependencies]
arrow = { workspace = true }
serde_json = { workspace = true }
byteorder = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
half = { workspace = true }
chrono = "0.4"
scx-format = { path = "../scx-format" }
scx-codec = { path = "../scx-codec" }
scx-sparse = { path = "../scx-sparse" }
scx-mtx = { path = "../scx-mtx" }
scx-ops = { path = "../scx-ops" }
# Phase 2 external CSC → CSR transpose writes intermediate
# `(row, col, value)` triples to a session temp directory. `TempDir`
# is auto-deleted on drop — the cleanest "scoped resource" pattern
# for that path.
tempfile = { workspace = true }

hdf5 = { workspace = true, optional = true }
# Renamed: the 0.9.x line of `hdf5-rust` ships the `hdf5-sys` companion
# as `hdf5-metno-sys`. Local dep alias stays `hdf5-sys` so the feature
# paths in `[features]` (e.g. `hdf5-sys/static`) keep resolving.
hdf5-sys = { package = "hdf5-metno-sys", version = "0.10", optional = true }
libz-sys = { version = "1", optional = true, default-features = false }
ndarray = { workspace = true, optional = true }

[dev-dependencies]
flate2 = "1"
